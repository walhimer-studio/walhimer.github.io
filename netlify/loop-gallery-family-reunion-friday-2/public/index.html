<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Loop Gallery — Family Reunion Friday 2</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #hint {
      position: fixed; left: 10px; top: 10px; z-index: 3;
      font: 11px/1.45 ui-monospace, monospace;
      color: rgba(90, 120, 140, 0.55);
      pointer-events: none; max-width: 440px;
    }
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.94);
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      font: 12px/1.4 system-ui, sans-serif;
      display: grid; gap: 8px;
    }
    #panel .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #panel button, #panel label.btn {
      appearance: none; border: 1px solid rgba(0,0,0,0.15);
      background: #fff; border-radius: 999px; padding: 8px 14px;
      font: inherit; cursor: pointer;
    }
    #panel button.primary { background: #111; color: #fff; border-color: #111; }
    #panel button.danger { background: #8b1a1a; color: #fff; border-color: #8b1a1a; }
    #panel button:disabled { opacity: 0.45; cursor: not-allowed; }
    #status { color: rgba(0,0,0,0.55); flex: 1; min-width: 160px; }
    #preview { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; display: none; border: 1px solid rgba(0,0,0,0.1); }
    #fileInput { display: none; }
    #modBadge {
      display: none; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
      color: #8b1a1a; border: 1px solid rgba(139,26,26,0.35); border-radius: 999px; padding: 4px 10px;
    }
    #modBadge.on { display: inline-block; }
    #panPad {
      position: fixed; right: 12px; bottom: calc(96px + env(safe-area-inset-bottom));
      z-index: 4; display: grid; grid-template-columns: 44px 44px 44px; gap: 6px;
      pointer-events: auto;
    }
    #panPad button {
      appearance: none; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.92);
      border-radius: 10px; width: 44px; height: 44px; font: 18px/1 system-ui, sans-serif;
      color: #333; cursor: pointer; touch-action: manipulation;
    }
    #panPad .spacer { visibility: hidden; pointer-events: none; }
  </style>
</head>
<body>
  <div id="hint">
    Loop Gallery · Family Reunion Friday 2 · static white wall<br>
    ↑ forward · ↓ back · ← → left / right · drag wall · on-screen arrows<br>
    Any image · full picture on wall · max 2 MB export · max 5 uploads<br>
    Moderator: add <code>?mod=TOKEN</code> to URL for remove-nearest
  </div>
  <div id="panPad" aria-label="Pan wall">
    <span class="spacer"></span>
    <button type="button" id="panUp" aria-label="Forward">↑</button>
    <span class="spacer"></span>
    <button type="button" id="panLeft" aria-label="Left">←</button>
    <button type="button" id="panDown" aria-label="Back">↓</button>
    <button type="button" id="panRight" aria-label="Right">→</button>
  </div>
  <div id="panel">
    <div class="row">
      <label class="btn" for="fileInput">Choose image</label>
      <input id="fileInput" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.heif" />
      <img id="preview" alt="" />
      <button type="button" id="hangWall" class="primary" disabled>Hang on wall</button>
      <button type="button" id="deleteNearest" class="danger" hidden>Remove nearest</button>
      <span id="modBadge">Moderator</span>
      <span id="status">Loading…</span>
    </div>
  </div>
  <script src="js/three.min.js"></script>
  <script type="module">
import { createWhiteWallScene } from './white-wall.mjs';
import {
  initGallerySync, checkUploadLimit, commitUploadLimit, checkModerator,
} from './gallery-sync.mjs';

const THREE = window.THREE;
const params = new URLSearchParams(location.search);
const DEFAULT_ROOM = 'family-reunion-friday-2';
const ROOM_ID = (params.get('room') || DEFAULT_ROOM).replace(/[^\w-]/g, '') || DEFAULT_ROOM;
const MOD_TOKEN = params.get('mod') || '';
const MAX_UPLOADS = 5;
const MAX_BYTES = 2 * 1024 * 1024;
const LOCAL_KEY = `loopGallery:${ROOM_ID}:uploads`;
const SLOTS_KEY = `loopGallery:${ROOM_ID}:slots`;

const statusEl = document.getElementById('status');
const fileInput = document.getElementById('fileInput');
const previewEl = document.getElementById('preview');
const hangWall = document.getElementById('hangWall');
const deleteNearest = document.getElementById('deleteNearest');
const modBadge = document.getElementById('modBadge');

let uploadCount = 0;
let pendingFile = null;
let pendingMeta = null;
let firebaseSync = null;
let wallScene = null;
let isModerator = false;
let FRAME_MAX_W = 18;
let FRAME_MAX_H = 13;
let FRAME_MIN_H = 5;
let GRID_COLS = 8;
let GRID_ROWS = 5;

const slots = new Map();
const frameGroup = new THREE.Group();
const textureLoader = new THREE.TextureLoader();
textureLoader.setCrossOrigin('anonymous');

function applyTextureColorSpace(tex) {
  if ('colorSpace' in tex && THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
  else if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
}

async function loadArtTexture(url) {
  async function attempt(src, useCors) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      if (useCors && !src.startsWith('data:') && !src.startsWith('blob:')) {
        img.crossOrigin = 'anonymous';
      }
      img.onload = () => {
        const tex = new THREE.Texture(img);
        tex.needsUpdate = true;
        applyTextureColorSpace(tex);
        resolve(tex);
      };
      img.onerror = () => reject(new Error('image load failed'));
      img.src = src;
    });
  }
  try {
    return await attempt(url, true);
  } catch (_) {
    if (!url.startsWith('data:') && !url.startsWith('blob:')) {
      return attempt(url, false);
    }
    throw new Error('Could not load wall texture');
  }
}

async function loadSlotTexture(data) {
  const tries = [];
  if (data.previewUrl?.startsWith('data:')) tries.push(data.previewUrl);
  if (firebaseSync?.objectUrlForSlot) {
    tries.push(async () => firebaseSync.objectUrlForSlot(data));
  }
  if (data.url?.startsWith('data:') || data.url?.startsWith('blob:')) tries.push(data.url);
  if (typeof data.url === 'string' && data.url.startsWith('http')) tries.push(data.url);

  let lastErr;
  for (const item of tries) {
    try {
      const src = typeof item === 'function' ? await item() : item;
      if (!src) continue;
      return await loadArtTexture(src);
    } catch (err) {
      lastErr = err;
    }
  }
  throw lastErr || new Error('Could not load wall texture');
}

function setStatus(msg) { statusEl.textContent = msg; }

function formatKb(n) {
  return `${(n / 1024).toFixed(n >= 10240 ? 0 : 1)} KB`;
}

function fitFrameToWall(imageAspect) {
  if (!imageAspect || !Number.isFinite(imageAspect)) imageAspect = 1;
  let frameW;
  let frameH;
  if (imageAspect > FRAME_MAX_W / FRAME_MAX_H) {
    frameW = FRAME_MAX_W;
    frameH = FRAME_MAX_W / imageAspect;
  } else {
    frameH = FRAME_MAX_H;
    frameW = FRAME_MAX_H * imageAspect;
  }
  if (frameH < FRAME_MIN_H) {
    frameH = FRAME_MIN_H;
    frameW = FRAME_MIN_H * imageAspect;
  }
  if (frameW > FRAME_MAX_W) {
    frameW = FRAME_MAX_W;
    frameH = FRAME_MAX_W / imageAspect;
  }
  if (frameH > FRAME_MAX_H) {
    frameH = FRAME_MAX_H;
    frameW = FRAME_MAX_H * imageAspect;
  }
  return { frameW, frameH, aspect: imageAspect };
}

function containDraw(ctx, bmp, tw, th) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, tw, th);
  const scale = Math.min(tw / bmp.width, th / bmp.height);
  const dw = bmp.width * scale;
  const dh = bmp.height * scale;
  ctx.drawImage(bmp, (tw - dw) / 2, (th - dh) / 2, dw, dh);
}

function loadLocalCount() {
  try { uploadCount = parseInt(localStorage.getItem(LOCAL_KEY) || '0', 10) || 0; } catch (_) { uploadCount = 0; }
}

function saveLocalCount() {
  try { localStorage.setItem(LOCAL_KEY, String(uploadCount)); } catch (_) {}
}

function loadLocalSlots() {
  try {
    const raw = localStorage.getItem(SLOTS_KEY);
    if (!raw) return;
    JSON.parse(raw).forEach((s) => addFrame(s, false));
  } catch (_) {}
}

function saveLocalSlots() {
  try {
    const arr = [...slots.values()].map(({ slotId, side, worldZ, col, row, url, storagePath, aspect, frameW, frameH }) => {
      const cleanUrl = url?.startsWith('blob:') || url?.startsWith('data:') ? undefined : url;
      return { slotId, side, worldZ, col, row, url: cleanUrl, storagePath, aspect, frameW, frameH };
    });
    localStorage.setItem(SLOTS_KEY, JSON.stringify(arr));
  } catch (_) {}
}

function parseCell(data) {
  if (data.col != null && data.row != null) return { col: data.col, row: data.row };
  const m = /^W-(\d+)-(\d+)$/.exec(data.slotId || '');
  if (m) return { col: +m[1], row: +m[2] };
  const idx = typeof data.worldZ === 'number'
    ? Math.abs(Math.round(data.worldZ)) % (GRID_COLS * GRID_ROWS)
    : slots.size % (GRID_COLS * GRID_ROWS);
  return { col: idx % GRID_COLS, row: Math.floor(idx / GRID_COLS) };
}

function findNextEmpty() {
  return wallScene?.findNextEmpty(slots) ?? null;
}

function findNearestSlot() {
  const pan = wallScene?.getViewPan?.() || { x: 0, y: 0 };
  let best = null;
  let bestD = Infinity;
  for (const s of slots.values()) {
    const { x, y } = wallScene.cellCenter(s.col, s.row);
    const d = (x - pan.x) ** 2 + (y - pan.y) ** 2;
    if (d < bestD) { bestD = d; best = s; }
  }
  return best;
}

function makeFrameMesh(col, row, frameW, frameH, texture) {
  const { x, y } = wallScene.cellCenter(col, row);
  const holder = new THREE.Group();
  holder.userData.slotId = null;

  const backing = new THREE.Mesh(
    new THREE.PlaneGeometry(frameW + 0.28, frameH + 0.28),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  backing.position.set(x, y, 0.02);
  holder.add(backing);

  const mat = new THREE.MeshBasicMaterial({ map: texture, toneMapped: false, side: THREE.DoubleSide });
  applyTextureColorSpace(texture);
  const art = new THREE.Mesh(new THREE.PlaneGeometry(frameW, frameH), mat);
  art.position.set(x, y, 0.04);
  art.renderOrder = 2;
  holder.add(art);

  const border = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(frameW + 0.18, frameH + 0.18)),
    new THREE.LineBasicMaterial({ color: 0x222222 })
  );
  border.position.copy(art.position);
  border.renderOrder = 3;
  holder.add(border);

  return { group: holder, art, texture, frameW, frameH };
}

function addFrame(data, persist = true, quiet = false) {
  if (slots.has(data.slotId)) return Promise.resolve(false);
  const { col, row } = parseCell(data);
  const frameW = data.frameW ?? FRAME_MAX_W;
  const frameH = data.frameH ?? FRAME_MAX_H;

  return loadSlotTexture(data).then((tex) => {
    const built = makeFrameMesh(col, row, frameW, frameH, tex);
    built.group.userData.slotId = data.slotId;
    frameGroup.add(built.group);
    const storedUrl = data.remoteUrl && !data.remoteUrl.startsWith('blob:')
      ? data.remoteUrl
      : (data.url?.startsWith('data:') ? undefined : data.url);
    slots.set(data.slotId, {
      ...data,
      side: data.side || 'L',
      col,
      row,
      url: storedUrl,
      previewUrl: data.previewUrl,
      group: built.group,
      art: built.art,
      texture: built.texture,
      frameW: built.frameW,
      frameH: built.frameH,
    });
    if (persist) saveLocalSlots();
    return true;
  }).catch((err) => {
    console.error(err);
    if (!quiet) setStatus(err.message || 'Could not show image on wall');
    return false;
  });
}

function removeFrame(slotId) {
  const s = slots.get(slotId);
  if (!s) return;
  frameGroup.remove(s.group);
  s.texture?.dispose();
  if (s.url?.startsWith('blob:')) URL.revokeObjectURL(s.url);
  slots.delete(slotId);
  saveLocalSlots();
}

async function prepareJPEG(file) {
  const nameOk = /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name);
  if (file.type && !/^image\//i.test(file.type) && !nameOk) {
    throw new Error('Image file only');
  }
  if (file.size > MAX_BYTES * 4) {
    throw new Error(`Too large — pick an image under ${formatKb(MAX_BYTES * 4)}`);
  }

  let bmp;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (_) {
    try {
      bmp = await createImageBitmap(file);
    } catch (_2) {
      throw new Error('Could not read image — try JPG or PNG');
    }
  }

  const aspect = bmp.width / bmp.height;
  const frame = fitFrameToWall(aspect);

  const pxPerUnit = 24;
  let tw = Math.min(2048, Math.round(frame.frameW * pxPerUnit));
  let th = Math.min(2048, Math.round(frame.frameH * pxPerUnit));

  const canvas = document.createElement('canvas');
  canvas.width = tw;
  canvas.height = th;
  containDraw(canvas.getContext('2d'), bmp, tw, th);
  bmp.close();

  let quality = 0.9;
  let blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
  while (blob && blob.size > MAX_BYTES && quality > 0.45) {
    quality -= 0.06;
    blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
  }
  if (!blob) throw new Error('Could not encode JPEG');
  if (blob.size > MAX_BYTES) {
    throw new Error(`Export still over ${formatKb(MAX_BYTES)} after compression`);
  }

  const previewUrl = canvas.toDataURL('image/jpeg', Math.min(0.82, quality));
  const outFile = new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  return { file: outFile, previewUrl, ...frame, bytes: blob.size, aspect: frame.aspect };
}

function updateUploadUI() {
  const remaining = Math.max(0, MAX_UPLOADS - uploadCount);
  const canHang = pendingFile && pendingMeta && remaining > 0;
  hangWall.disabled = !canHang;
  deleteNearest.hidden = !isModerator;
  modBadge.classList.toggle('on', isModerator);
  const sync = firebaseSync?.mode === 'firebase'
    ? ` · synced${firebaseSync.configSource ? ` (${firebaseSync.configSource})` : ''}`
    : ` · local${firebaseSync?.error ? ` · ${firebaseSync.error}` : ''}`;
  const mod = isModerator ? ' · mod' : '';
  const hint = remaining > 0 && !pendingFile ? ' · choose image first' : '';
  setStatus(`${remaining} of ${MAX_UPLOADS} uploads left · room ${ROOM_ID}${sync}${mod}${hint}`);
}

fileInput.addEventListener('change', async () => {
  const file = fileInput.files?.[0];
  if (!file) return;
  pendingFile = null;
  pendingMeta = null;
  previewEl.style.display = 'none';
  hangWall.disabled = true;
  setStatus('Reading image…');
  try {
    const prep = await prepareJPEG(file);
    pendingFile = prep.file;
    pendingMeta = prep;
    previewEl.src = prep.previewUrl;
    previewEl.style.display = 'block';
    setStatus(`Ready · ${formatKb(prep.bytes)} · frame ${prep.frameW.toFixed(1)}×${prep.frameH.toFixed(1)} wall units`);
    updateUploadUI();
  } catch (err) {
    setStatus(err.message || 'Invalid image');
    fileInput.value = '';
  }
});

async function hang() {
  if (!pendingFile || !pendingMeta) {
    setStatus('Choose an image first');
    return;
  }
  if (uploadCount >= MAX_UPLOADS) {
    setStatus('Upload limit reached — 5 per browser for this room');
    return;
  }
  const slot = findNextEmpty();
  if (!slot) {
    setStatus('Wall is full — moderator can remove a piece');
    return;
  }

  setStatus('Hanging…');
  try {
    let remoteUrl;
    if (firebaseSync?.mode === 'firebase') {
      const lim = await commitUploadLimit(ROOM_ID);
      if (!lim.allowed) {
        setStatus(lim.error || 'Upload limit reached on this network');
        return;
      }
      const uploaded = await firebaseSync.uploadJPEG(
        pendingFile, slot.slotId, slot.side, slot.worldZ, pendingMeta
      );
      remoteUrl = uploaded.url;
    } else {
      remoteUrl = URL.createObjectURL(pendingFile);
    }

    const hung = await addFrame({
      slotId: slot.slotId,
      side: slot.side,
      worldZ: slot.worldZ,
      col: slot.col,
      row: slot.row,
      previewUrl: pendingMeta.previewUrl,
      url: pendingMeta.previewUrl,
      remoteUrl,
      storagePath: firebaseSync?.mode === 'firebase'
        ? `${firebaseSync.galleryRoot}/rooms/${ROOM_ID}/images/${slot.slotId}.jpg`
        : undefined,
      aspect: pendingMeta.aspect,
      frameW: pendingMeta.frameW,
      frameH: pendingMeta.frameH,
    });
    if (!hung) return;

    wallScene?.focusCell?.(slot.col, slot.row);
    uploadCount += 1;
    saveLocalCount();
    pendingFile = null;
    pendingMeta = null;
    fileInput.value = '';
    previewEl.style.display = 'none';
    updateUploadUI();
    setStatus(`Hung on wall · slot ${slot.slotId}`);
  } catch (err) {
    console.error(err);
    const msg = err?.message || 'Could not hang image';
    if (firebaseSync?.mode === 'firebase') {
      try {
        const localUrl = URL.createObjectURL(pendingFile);
        const hung = await addFrame({
          slotId: slot.slotId,
          side: slot.side,
          worldZ: slot.worldZ,
          col: slot.col,
          row: slot.row,
          previewUrl: pendingMeta.previewUrl,
          url: pendingMeta.previewUrl,
          remoteUrl: localUrl,
          aspect: pendingMeta.aspect,
          frameW: pendingMeta.frameW,
          frameH: pendingMeta.frameH,
        });
        if (hung) {
          wallScene?.focusCell?.(slot.col, slot.row);
          uploadCount += 1;
          saveLocalCount();
          pendingFile = null;
          pendingMeta = null;
          fileInput.value = '';
          previewEl.style.display = 'none';
          updateUploadUI();
          setStatus(`Hung on your screen only — fix Firebase rules for sync. ${msg}`);
          return;
        }
      } catch (_) { /* keep original error */ }
    }
    setStatus(msg);
  }
}

async function deleteNearestSlot() {
  if (!isModerator) return;
  const target = findNearestSlot();
  if (!target) {
    setStatus('Nothing on wall to remove');
    return;
  }
  if (firebaseSync?.mode === 'firebase' && firebaseSync.deleteSlot) {
    const res = await firebaseSync.deleteSlot(target.slotId, MOD_TOKEN);
    if (res.error) {
      setStatus(res.error);
      return;
    }
  }
  removeFrame(target.slotId);
  setStatus(`Removed slot ${target.slotId}`);
}

hangWall.addEventListener('click', () => { void hang(); });
deleteNearest.addEventListener('click', () => deleteNearestSlot());

document.addEventListener('keydown', (e) => {
  if (!wallScene) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowup') { wallScene.setMoveKey('forward', true); e.preventDefault(); }
  if (k === 'arrowdown') { wallScene.setMoveKey('back', true); e.preventDefault(); }
  if (k === 'arrowleft') { wallScene.setMoveKey('left', true); e.preventDefault(); }
  if (k === 'arrowright') { wallScene.setMoveKey('right', true); e.preventDefault(); }
  if (e.key === 'Backspace' && isModerator) deleteNearestSlot();
});
document.addEventListener('keyup', (e) => {
  if (!wallScene) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowup') wallScene.setMoveKey('forward', false);
  if (k === 'arrowdown') wallScene.setMoveKey('back', false);
  if (k === 'arrowleft') wallScene.setMoveKey('left', false);
  if (k === 'arrowright') wallScene.setMoveKey('right', false);
});

function bindPanButton(el, key) {
  if (!el) return;
  const on = () => wallScene?.setMoveKey(key, true);
  const off = () => wallScene?.setMoveKey(key, false);
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); on(); });
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
}

bindPanButton(document.getElementById('panUp'), 'forward');
bindPanButton(document.getElementById('panDown'), 'back');
bindPanButton(document.getElementById('panLeft'), 'left');
bindPanButton(document.getElementById('panRight'), 'right');

async function boot() {
  loadLocalCount();
  const panel = document.getElementById('panel');
  wallScene = createWhiteWallScene({ insertBefore: panel });
  const { frameMaxW, frameMaxH, frameMinH } = wallScene.maxFrameSize();
  FRAME_MAX_W = frameMaxW;
  FRAME_MAX_H = frameMaxH;
  FRAME_MIN_H = frameMinH;
  GRID_COLS = wallScene.layout.COLS;
  GRID_ROWS = wallScene.layout.ROWS;

  wallScene.getScene().add(frameGroup);
  loadLocalSlots();

  if (MOD_TOKEN) {
    try {
      const mod = await checkModerator(MOD_TOKEN);
      isModerator = !!mod.ok;
    } catch (_) { isModerator = false; }
  }

  try {
    const lim = await checkUploadLimit(ROOM_ID);
    if (lim.mode === 'firebase' && typeof lim.count === 'number') {
      uploadCount = Math.max(uploadCount, lim.count);
      saveLocalCount();
    }
    firebaseSync = await initGallerySync(
      ROOM_ID,
      (data) => { void addFrame(data, true, true); },
      (id) => removeFrame(id)
    );
  } catch (_) {
    firebaseSync = { mode: 'local' };
  }

  updateUploadUI();
  wallScene.getCanvas()?.focus({ preventScroll: true });
}

boot().catch((err) => {
  console.error(err);
  setStatus(err.message || 'Failed to start gallery');
});
  </script>
</body>
</html>
