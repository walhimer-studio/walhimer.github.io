[build]
  command = "node ../../machine-aesthetic/surrender-stack-poc/scripts/sync-gravity-netlify.mjs"
  publish = "public"
  functions = "netlify/functions"

[dev]
  command = "node ../../machine-aesthetic/surrender-stack-poc/scripts/sync-gravity-netlify.mjs"
  publish = "public"
  functions = "netlify/functions"
  port = 8888

[[redirects]]
  from = "/"
  to = "/display.html"
  status = 200

[[redirects]]
  from = "/phone"
  to = "/phone.html"
  status = 200
