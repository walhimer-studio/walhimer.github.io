<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ghost 77823 · Phone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #fff;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: #444;
    }
    header {
      position: sticky; top: 0; z-index: 2;
      padding: 14px 16px 10px;
      padding-top: calc(14px + env(safe-area-inset-top));
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid #e8e8e8;
    }
    header h1 {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #666;
    }
    header p { margin-top: 6px; font-size: 10px; color: #999; letter-spacing: 0.06em; }
    #status { color: #74b4dc; }
    main {
      padding: 12px 16px calc(24px + env(safe-area-inset-bottom));
      display: grid; gap: 14px;
    }
    label { display: grid; gap: 8px; }
    .ctrl-head {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #888;
    }
    .ctrl-head span.val { text-transform: none; color: #aaa; letter-spacing: 0.04em; }
    input[type="range"] {
      width: 100%; height: 36px; margin: 0; accent-color: #74b4dc;
    }
    .gravity-btns {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    }
    button {
      min-height: 48px;
      border: 1px solid #d8d8d8; background: #fff;
      font: inherit; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
      color: #666; border-radius: 4px; touch-action: manipulation;
    }
    button[aria-pressed="true"] {
      background: #f4f8fb; border-color: #74b4dc; color: #333;
    }
    .venue {
      font-size: 10px; color: #aaa; letter-spacing: 0.08em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header>
    <h1>Surrender Machines · Phone</h1>
    <p class="venue">room <span id="venue-label">default</span></p>
    <p id="status">connecting…</p>
  </header>
  <main aria-label="Machine controls">
    <label>
      <span class="ctrl-head">Speed <span class="val" id="val-speed">1.0×</span></span>
      <input type="range" id="sl-speed" min="10" max="300" value="100">
    </label>
    <label>
      <span class="ctrl-head">Horizontal gear size <span class="val" id="val-horizontal">1.00×</span></span>
      <input type="range" id="sl-horizontal" min="25" max="200" value="100">
    </label>
    <label>
      <span class="ctrl-head">Vertical gear size <span class="val" id="val-vertical">1.00×</span></span>
      <input type="range" id="sl-vertical" min="25" max="200" value="100">
    </label>
    <label>
      <span class="ctrl-head">Horizontal gear count <span class="val" id="val-h-count">40</span></span>
      <input type="range" id="sl-h-count" min="0" max="40" value="40">
    </label>
    <label>
      <span class="ctrl-head">Vertical gear count <span class="val" id="val-v-count">40</span></span>
      <input type="range" id="sl-v-count" min="0" max="40" value="40">
    </label>
    <div class="gravity-btns">
      <button type="button" id="btn-gravity-x" aria-pressed="true">Gravity X</button>
      <button type="button" id="btn-gravity-y" aria-pressed="true">Gravity Y</button>
      <button type="button" id="btn-gravity-z" aria-pressed="true">Gravity Z</button>
    </div>
  </main>
  <script type="module">
    import { attachPhone } from './gravity-remote.mjs';

    const params = new URLSearchParams(location.search);
    const VENUE = params.get('venue') || 'default';
    document.getElementById('venue-label').textContent = VENUE;

    const els = {
      speed: document.getElementById('sl-speed'),
      horizontal: document.getElementById('sl-horizontal'),
      vertical: document.getElementById('sl-vertical'),
      hCount: document.getElementById('sl-h-count'),
      vCount: document.getElementById('sl-v-count'),
      gx: document.getElementById('btn-gravity-x'),
      gy: document.getElementById('btn-gravity-y'),
      gz: document.getElementById('btn-gravity-z'),
    };

    const gravity = { x: true, y: true, z: true };

    function labels() {
      document.getElementById('val-speed').textContent = (Number(els.speed.value) / 100).toFixed(1) + '×';
      document.getElementById('val-horizontal').textContent = (Number(els.horizontal.value) / 100).toFixed(2) + '×';
      document.getElementById('val-vertical').textContent = (Number(els.vertical.value) / 100).toFixed(2) + '×';
      document.getElementById('val-h-count').textContent = els.hCount.value;
      document.getElementById('val-v-count').textContent = els.vCount.value;
    }

    function readUi() {
      return {
        speed: Number(els.speed.value),
        horizontal: Number(els.horizontal.value),
        vertical: Number(els.vertical.value),
        hCount: Number(els.hCount.value),
        vCount: Number(els.vCount.value),
        gravityX: gravity.x,
        gravityY: gravity.y,
        gravityZ: gravity.z,
        ts: Date.now(),
      };
    }

    function applyUi(s) {
      if (s.speed != null) els.speed.value = s.speed;
      if (s.horizontal != null) els.horizontal.value = s.horizontal;
      if (s.vertical != null) els.vertical.value = s.vertical;
      if (s.hCount != null) els.hCount.value = s.hCount;
      if (s.vCount != null) els.vCount.value = s.vCount;
      if (s.gravityX != null) { gravity.x = s.gravityX; els.gx.setAttribute('aria-pressed', s.gravityX ? 'true' : 'false'); }
      if (s.gravityY != null) { gravity.y = s.gravityY; els.gy.setAttribute('aria-pressed', s.gravityY ? 'true' : 'false'); }
      if (s.gravityZ != null) { gravity.z = s.gravityZ; els.gz.setAttribute('aria-pressed', s.gravityZ ? 'true' : 'false'); }
      labels();
    }

    function toggleAxis(axis, btn) {
      gravity[axis] = !gravity[axis];
      btn.setAttribute('aria-pressed', gravity[axis] ? 'true' : 'false');
      phone.push();
    }

    let phone;
    phone = await attachPhone({
      venue: VENUE,
      readUi,
      applyUi,
      onStatus: (t) => { document.getElementById('status').textContent = t; },
    });

    labels();

    for (const el of [els.speed, els.horizontal, els.vertical, els.hCount, els.vCount]) {
      el.addEventListener('input', () => { labels(); phone?.push(); });
    }
    els.gx.addEventListener('click', () => toggleAxis('x', els.gx));
    els.gy.addEventListener('click', () => toggleAxis('y', els.gy));
    els.gz.addEventListener('click', () => toggleAxis('z', els.gz));
  </script>
</body>
</html>
