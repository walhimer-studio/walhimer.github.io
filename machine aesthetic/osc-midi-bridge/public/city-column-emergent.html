<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City column</title>
  <script src="midi-wave-telescope.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <style>
    body { margin: 0; background: #111; }
    #scopeBtn {
      position: fixed; bottom: 12px; left: 12px; z-index: 20;
      font: 12px/1.3 -apple-system, sans-serif; color: #ccc;
      background: rgba(25,25,25,0.92); padding: 8px 12px; border-radius: 8px;
      cursor: pointer; border: 1px solid #444; max-width: min(420px, 94vw);
    }
    #scopeBtn.on { color: #7be7b3; border-color: #2a5c45; }
  </style>
</head>
<body>
  <button type="button" id="scopeBtn">Wave telescope: off — Web Audio from MIDI (no mic). Click to start.</button>
  <script>
/**
 * EmergentDNA-compatible RNG (matches canonical constructor / next).
 * Visual phenotype uses the same seed identity as MIDI generation on the bridge.
 */
function SeedRng(seed) {
  this.s = (seed >>> 0) || 1;
}
SeedRng.prototype.next = function next() {
  const x = Math.sin(this.s++) * 10000;
  return x - Math.floor(x);
};

let city = [];
let cs;
let rng;
let currentSeed = 123456;

let BOX_COUNT = 8;
let spacing = 300;
let boxSpeed = 1;
let BOX_ALPHA = 110;

let palette = [310, 45, 30, 210, 270];
let camZ = 500;

/** Distance past camera plane before a box recycles to the back (infinite runway). */
let zExit = 620;

/**
 * Target wall-clock time for the rearmost box to reach zExit (single pass, ~60fps).
 * Higher = slower drift. Default ~2.5 min — ?minutes=1 faster, ?minutes=5 slower.
 */
let targetPassMinutes = 2.5;

let bridgeWs = null;
let bridgeState = null;
/** Full city rebuild only when seed/density identity changes — not on every tempo/MIDI tick. */
let lastBridgeLayoutKey = null;

const waveTelescope =
  typeof createMidiWaveTelescope === "function" ? createMidiWaveTelescope() : null;
let telescopeOn = false;
let smoothWaveLevel = 0;

/** MIDI from S-1 (knobs/keys) via bridge → visual modulation */
let synthCC = {};
let smoothCamZOff = 0;
let smoothLightMul = 1;
let noteGlow = 0;
/** Decays after each note; CC-driven motion/light only blend in while this is > 0 (heard audio, not idle knob staging). */
let audioPresence = 0;
/** Last CC value from any knob — used when Roland uses CC #s outside our short list. */
let lastAnyCcValue = null;

function synthCCVal(controller, fallback) {
  const v = synthCC[controller];
  return v != null ? v : fallback;
}

/** Prefer known CCs; otherwise fall back to the last CC seen from the hardware. */
function firstDefinedCC(candidates, fallback) {
  for (let i = 0; i < candidates.length; i++) {
    const c = candidates[i];
    if (synthCC[c] != null) return synthCC[c];
  }
  if (lastAnyCcValue != null) return lastAnyCcValue;
  return fallback;
}

function handleSynthMidi(p) {
  if (!p || typeof p.kind !== "string") return;
  if (p.kind === "cc") {
    const controller = Number(p.controller);
    const value = Number(p.value);
    if (!Number.isFinite(controller) || !Number.isFinite(value)) return;
    synthCC[controller] = value;
    lastAnyCcValue = value;
  }
  if (p.kind === "noteon") {
    const vel = Number(p.velocity);
    if (!Number.isFinite(vel)) return;
    noteGlow = Math.min(200, noteGlow + vel * 2.2);
    audioPresence = Math.min(1, audioPresence + 0.35 + vel / 400);
    if (telescopeOn && waveTelescope) waveTelescope.noteOn(p.note, p.velocity);
  }
  if (p.kind === "noteoff" && telescopeOn && waveTelescope) {
    waveTelescope.noteOff(p.note);
  }
}

function parseSeedFromUrl() {
  const p = new URLSearchParams(window.location.search);
  const s = p.get("seed");
  if (!s) return null;
  if (/^[0-9a-fA-F]{1,8}$/.test(s)) return parseInt(s, 16) >>> 0;
  const n = Number(s);
  return Number.isFinite(n) ? (n >>> 0) : null;
}

function parseMinutesFromUrl() {
  const p = new URLSearchParams(window.location.search);
  const m = p.get("minutes");
  if (m == null) return null;
  const n = Number(m);
  if (!Number.isFinite(n) || n < 0.5 || n > 120) return null;
  return n;
}

function pickPaletteHue() {
  return palette[Math.floor(rng.next() * palette.length)];
}

function randRange(a, b) {
  return a + rng.next() * (b - a);
}

/** EditArt / export hooks — keep for Objkt-style workflows */
function triggerPreview() {}

function bridgeLayoutKey(s) {
  if (!s) return "";
  return [(s.seed >>> 0), Math.round(s.density * 1000)].join(":");
}

/** Recompute motion/light from OSC state without rebuilding geometry (avoids “control event” popping). */
function applyBridgeMotionOnly() {
  if (!bridgeState) return;
  BOX_ALPHA = Math.floor(60 + bridgeState.brightness * 160);
  camZ = 450 + bridgeState.mood * 120;
  zExit = camZ + 120;
  const travel = zExit + Math.max(0, BOX_COUNT - 1) * spacing;
  const targetSec = targetPassMinutes * 60;
  const fps = 60;
  const baseSpeed = travel / (targetSec * fps);
  const tempoMul = map(bridgeState.tempo, 40, 180, 0.7, 2.5);
  boxSpeed = baseSpeed * tempoMul;
}

/**
 * @param {{ rebuildCity?: boolean }} [opts]
 */
function setSeeds(opts) {
  const rebuildCity = !opts || opts.rebuildCity !== false;

  if (!rebuildCity) {
    applyBridgeMotionOnly();
    return;
  }

  const urlSeed = parseSeedFromUrl();
  const seed = bridgeState ? (bridgeState.seed >>> 0) : (urlSeed != null ? urlSeed : currentSeed);
  currentSeed = seed >>> 0;
  rng = new SeedRng(currentSeed);

  const minutesOverride = parseMinutesFromUrl();
  if (minutesOverride != null) targetPassMinutes = minutesOverride;

  if (bridgeState) {
    BOX_COUNT = Math.floor(6 + bridgeState.density * 8);
    spacing = 250 + (1 - bridgeState.density) * 200;
    BOX_ALPHA = Math.floor(60 + bridgeState.brightness * 160);
    camZ = 450 + bridgeState.mood * 120;
  }

  zExit = camZ + 120;

  const travel =
    zExit + Math.max(0, BOX_COUNT - 1) * spacing;
  const targetSec = targetPassMinutes * 60;
  const fps = 60;
  const baseSpeed = travel / (targetSec * fps);
  if (bridgeState) {
    const tempoMul = map(bridgeState.tempo, 40, 180, 0.7, 2.5);
    boxSpeed = baseSpeed * tempoMul;
  } else {
    boxSpeed = baseSpeed;
  }

  city = [];
  for (let i = 0; i < BOX_COUNT; i++) {
    city.push(makeBox(-i * spacing));
  }
}

function isPrivateLanHost(hostname) {
  return (
    /^192\.168\.\d{1,3}\.\d{1,3}$/.test(hostname) ||
    /^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(hostname) ||
    /^172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}$/.test(hostname)
  );
}

function isLikelySameOriginBridgePage() {
  if (location.protocol === "file:") return false;
  const p = new URLSearchParams(window.location.search);
  if (p.get("noBridge") === "1" || p.get("noBridge") === "true") return false;
  if (p.get("bridge") === "1" || p.get("bridge") === "force") return true;
  if (location.protocol !== "http:" && location.protocol !== "https:") return false;
  const h = location.hostname;
  const localHost =
    h === "localhost" ||
    h === "127.0.0.1" ||
    h === "::1" ||
    h === "[::1]";
  const port = location.port || (location.protocol === "https:" ? "443" : "80");
  const defaultBridgePort = port === "8787";
  return localHost || defaultBridgePort || isPrivateLanHost(h) || h.endsWith(".local");
}

function connectBridge() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const wsUrl = `${proto}//${location.host}`;
  try {
    bridgeWs = new WebSocket(wsUrl);
  } catch (e) {
    return;
  }
  bridgeWs.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "state") {
        const s = msg.payload;
        const key = bridgeLayoutKey(s);
        const needRebuild = lastBridgeLayoutKey === null || key !== lastBridgeLayoutKey;
        bridgeState = s;
        lastBridgeLayoutKey = key;
        if (needRebuild) setSeeds({ rebuildCity: true });
        else setSeeds({ rebuildCity: false });
      }
      if (msg.type === "synthMidi") {
        handleSynthMidi(msg.payload);
      }
      if (msg.type === "event" && telescopeOn && waveTelescope) {
        const e = msg.payload;
        if (e && Number.isFinite(Number(e.pitch))) {
          waveTelescope.notePulse(e.pitch, e.velocity, 140);
        }
      }
    } catch (_) {}
  };
}

function setup() {
  cs = min(windowWidth, windowHeight);
  createCanvas(cs, cs, WEBGL);
  pixelDensity(2);
  frameRate(60);
  colorMode(HSB, 360, 100, 100, 255);
  noStroke();
  setAttributes("alpha", true);
  textureWrap(CLAMP);

  const scopeEl = document.getElementById("scopeBtn");
  if (scopeEl && waveTelescope) {
    scopeEl.addEventListener("click", async () => {
      const ok = await waveTelescope.resume();
      telescopeOn = ok;
      scopeEl.textContent = ok
        ? "Wave telescope on — scroll follows MIDI→Web Audio level"
        : "Could not start Web Audio (click again)";
      scopeEl.classList.toggle("on", ok);
    });
  }

  // WebSocket must reach this tab — not only "localhost" (IPv6 ::1, LAN IP, or hostname break the old check).
  if (isLikelySameOriginBridgePage()) {
    connectBridge();
  }
  setSeeds({ rebuildCity: true });
}

function makeBox(zPos) {
  return {
    x: 0,
    z: zPos,
    w: randRange(120, 220),
    h: randRange(120, 320),
    d: randRange(120, 220),
    tex: makeMultiColorGradientTexture()
  };
}

function makeMultiColorGradientTexture() {
  const tex = createGraphics(128, 256);
  tex.pixelDensity(2);
  tex.colorMode(HSB, 360, 100, 100, 255);
  tex.noStroke();

  const h1 = pickPaletteHue();
  const h2 = pickPaletteHue();
  const h3 = pickPaletteHue();
  const h4 = pickPaletteHue();
  const a = BOX_ALPHA;

  for (let y = 0; y < tex.height; y++) {
    const t = y / (tex.height - 1);
    let h;
    if (t < 1 / 3) {
      h = lerp(h1, h2, t * 3);
    } else if (t < 2 / 3) {
      h = lerp(h2, h3, (t - 1 / 3) * 3);
    } else {
      h = lerp(h3, h4, (t - 2 / 3) * 3);
    }
    tex.fill(h, 100, 100, a);
    tex.rect(0, y, tex.width, 1);
  }

  tex.loadPixels();
  for (let y = 0; y < tex.height; y++) {
    for (let x = 0; x < tex.width; x++) {
      const idx = 4 * (y * tex.width + x);
      const wave = 0.65 + 0.35 * sin((x / tex.width) * TWO_PI * 2.0);
      tex.pixels[idx + 3] = tex.pixels[idx + 3] * wave;
    }
  }
  tex.updatePixels();
  return tex;
}

function draw() {
  background(0, 0, 100);

  let scrollMul = 1;
  if (telescopeOn && waveTelescope) {
    const raw = waveTelescope.level();
    smoothWaveLevel = lerp(smoothWaveLevel, raw, 0.22);
    const a = constrain(smoothWaveLevel, 0, 1);
    scrollMul = 0.06 + pow(a, 0.85) * 5.5;
  }

  audioPresence *= 0.965;

  const ccDepth = firstDefinedCC(
    [74, 1, 16, 17, 18, 19, 20, 21, 22, 23],
    64
  );
  const ccLight = firstDefinedCC([71, 91, 93, 7, 11], 64);
  // Idle: camera/light follow OSC seed params. Under notes: CC from the patch shapes what you hear — blend in with audioPresence.
  const mood = bridgeState ? bridgeState.mood : 0.5;
  const bright = bridgeState ? bridgeState.brightness : 0.6;
  const targetCamIdle = map(mood, 0, 1, -55, 55);
  const targetLightIdle = map(bright, 0, 1, 0.65, 1.25);
  const targetCamPlay = map(ccDepth, 0, 127, -120, 120);
  const targetLightPlay = map(ccLight, 0, 127, 0.4, 1.45);
  const ap = constrain(audioPresence + noteGlow * 0.0045, 0, 1);
  const targetCamOff = lerp(targetCamIdle, targetCamPlay, ap);
  const targetLight = lerp(targetLightIdle, targetLightPlay, ap);
  smoothCamZOff = lerp(smoothCamZOff, targetCamOff, 0.1);
  smoothLightMul = lerp(smoothLightMul, targetLight, 0.12);
  noteGlow *= 0.93;

  camera(
    0,
    0,
    camZ + smoothCamZOff + noteGlow * 0.15,
    0,
    0,
    0,
    0,
    1,
    0
  );
  ambientLight(255 * smoothLightMul);
  directionalLight(255, 255, 255, 0.35 * smoothLightMul, -1, -0.5);
  blendMode(BLEND);

  for (let b of city) {
    b.z += boxSpeed * scrollMul;
  }
  // Infinite column: recycle the front box behind the back when it passes the camera.
  city.sort((a, b) => a.z - b.z);
  while (city.length && city[city.length - 1].z > zExit) {
    if (city.length === 1) {
      city[0].z = -spacing;
      break;
    }
    const front = city.pop();
    front.z = city[0].z - spacing;
    city.unshift(front);
  }

  for (let b of city) {
    push();
    translate(b.x, 0, b.z);
    texture(b.tex);
    box(b.w, b.h, b.d);
    pop();
  }
  triggerPreview();
}

function windowResized() {
  cs = min(windowWidth, windowHeight);
  resizeCanvas(cs, cs);
  setSeeds({ rebuildCity: true });
}
  </script>
</body>
</html>
