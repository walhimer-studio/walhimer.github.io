<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stack POC · Display</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 0; right: 0; top: 0;
      padding: 12px 16px;
      font: 12px/1.4 system-ui, sans-serif;
      color: #ccc;
      background: linear-gradient(#000c, transparent);
      pointer-events: none;
    }
    #hud strong { color: #fff; }
    #qr {
      position: fixed; right: 16px; bottom: 16px;
      background: #fff; padding: 8px; border-radius: 8px;
      font: 11px system-ui, sans-serif; color: #111;
      max-width: 160px; text-align: center;
    }
    #qr img { display: block; width: 128px; height: 128px; }
    #qr a { color: #111; word-break: break-all; }
  </style>
</head>
<body>
  <div id="hud">
    <strong>Stack POC</strong> — seed drives visuals + audio ·
    seed <span id="seed">—</span> ·
    energy <span id="energy">—</span> ·
    hz <span id="hz">—</span> ·
    <span id="conn">connecting…</span>
  </div>
  <canvas id="c"></canvas>
  <div id="qr" hidden>
    <img id="qrImg" alt="QR controller" />
    <div>iPhone controller</div>
    <a id="qrLink" href="#"></a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
    import { SeedRng, seedToHz } from "./lib/seed-rng.mjs";

    let configMod;
    try {
      configMod = await import("./firebase-config.local.mjs");
    } catch {
      configMod = await import("./firebase-config.example.mjs");
    }
    const { firebaseConfig, RTDB_PATH } = configMod;

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const stateRef = ref(db, RTDB_PATH);

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let state = { seed: 77823, energy: 0.72, mood: 0.45 };
    let blobs = [];
    let t = 0;

    function rebuildBlobs(seed) {
      const rng = new SeedRng(seed);
      blobs = Array.from({ length: 12 }, () => ({
        x: rng.range(0.1, 0.9),
        y: rng.range(0.1, 0.9),
        r: rng.range(0.04, 0.14),
        phase: rng.range(0, Math.PI * 2),
        speed: rng.range(0.4, 1.6),
        hue: rng.range(180, 320),
      }));
    }

    rebuildBlobs(state.seed);

    function resize() {
      const dpr = devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", resize);
    resize();

    onValue(stateRef, (snap) => {
      const d = snap.val();
      if (!d) return;
      const nextSeed = Number(d.seed) >>> 0 || 77823;
      if (nextSeed !== state.seed) rebuildBlobs(nextSeed);
      state = {
        seed: nextSeed,
        energy: Number(d.energy) || 0,
        mood: Number(d.mood) || 0,
      };
      document.getElementById("seed").textContent = state.seed;
      document.getElementById("energy").textContent = state.energy.toFixed(2);
      document.getElementById("hz").textContent = seedToHz(state.seed, state.energy).toFixed(1);
      document.getElementById("conn").textContent = "Firebase live";
    }, () => {
      document.getElementById("conn").textContent = "Firebase error";
    });

    function draw() {
      t += 0.016;
      const w = innerWidth;
      const h = innerHeight;
      const bg = 8 + state.mood * 24;
      ctx.fillStyle = `hsl(${220 + state.mood * 40}, 12%, ${bg}%)`;
      ctx.fillRect(0, 0, w, h);

      for (const b of blobs) {
        const pulse = 0.5 + 0.5 * Math.sin(t * b.speed + b.phase + state.energy * 4);
        const radius = b.r * Math.min(w, h) * (0.85 + pulse * state.energy * 0.5);
        const x = b.x * w;
        const y = b.y * h;
        const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
        g.addColorStop(0, `hsla(${b.hue}, 70%, ${55 + state.energy * 20}%, 0.55)`);
        g.addColorStop(1, "hsla(0,0%,0%,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }
    draw();

    fetch("/api/lan")
      .then((r) => r.json())
      .then(({ controllerUrl }) => {
        const qr = document.getElementById("qr");
        const link = document.getElementById("qrLink");
        link.href = controllerUrl;
        link.textContent = controllerUrl.replace(/^https?:\/\//, "");
        document.getElementById("qrImg").src =
          `https://api.qrserver.com/v1/create-qr-code/?size=128x128&data=${encodeURIComponent(controllerUrl)}`;
        qr.hidden = false;
      })
      .catch(() => {});
  </script>
</body>
</html>
