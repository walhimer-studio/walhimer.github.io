<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Cube stop motion v7</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    #c { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: fixed; left: 12px; bottom: 12px; z-index: 2;
      font: 12px/1.4 ui-monospace, monospace;
      color: #456;
      background: rgba(255,255,255,0.9);
      padding: 6px 8px;
      max-width: 90vw;
    }
    #ui.err { color: #b00; font-weight: 600; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">loading…</div>
  <script>
const ui = document.getElementById('ui');
const BUILD = 'v7';

if (!document.title.includes('v7')) {
  ui.className = 'err';
  ui.textContent = 'Wrong cache — Cmd+Shift+R';
} else {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: true });

  if (!gl) {
    ui.className = 'err';
    ui.textContent = 'WebGL2 missing — use Chrome or Safari';
  } else {
    const { floor, random, min, max, cos, sin } = Math;

    const A = 0.58;
    const verts = new Float32Array([
      -1,-1, 1, 1,.2,.7,A,  1,-1, 1, 1,.5,0,A,  1, 1, 1, 0,.7,1,A,
      -1,-1, 1, 1,.2,.7,A,  1, 1, 1, 0,.7,1,A, -1, 1, 1, 0,.8,1,A,
      -1,-1,-1, 1,1,.1,A,  1,-1,-1, 1,.7,.1,A,  1, 1,-1, 0,.8,1,A,
      -1,-1,-1, 1,1,.1,A,  1, 1,-1, 0,.8,1,A, -1, 1,-1, 1,1,.5,A,
      -1, 1,-1, 1,1,0,A,   1, 1,-1, 1,0,.85,A,  1, 1, 1, 0,.3,1,A,
      -1, 1,-1, 1,1,0,A,   1, 1, 1, 0,.3,1,A, -1, 1, 1, 0,.9,1,A,
      -1,-1,-1, 0,.2,1,A,  1,-1,-1, 1,.6,.1,A,  1,-1, 1, 1,.8,0,A,
      -1,-1,-1, 0,.2,1,A,  1,-1, 1, 1,.8,0,A, -1,-1, 1, 0,.4,1,A,
       1,-1,-1, 1,0,.75,A, -1,-1,-1, 1,1,.15,A, -1, 1,-1, 0,.85,1,A,
       1,-1,-1, 1,0,.75,A, -1, 1,-1, 0,.85,1,A,  1, 1,-1, 1,1,.5,A,
      -1,-1,-1, 0,.35,1,A, -1,-1, 1, 0,.2,1,A, -1, 1, 1, 1,1,.3,A,
      -1,-1,-1, 0,.35,1,A, -1, 1, 1, 1,1,.3,A, -1, 1,-1, 1,1,0,A,
    ]);

    const vs = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec4 aCol;
uniform float yaw, pitch, halfW, halfH, offX, offY;
out vec4 vCol;
void main() {
  float cy = cos(yaw), sy = sin(yaw);
  float cx = cos(pitch), sx = sin(pitch);
  float x = cy*aPos.x + sy*aPos.z;
  float z = -sy*aPos.x + cy*aPos.z;
  float y = cx*aPos.y - sx*z;
  float z2 = sx*aPos.y + cx*z - 3.5;
  vCol = aCol;
  gl_Position = vec4(x/halfW + offX, y/halfH + offY, clamp(z2/20., -0.99, 0.99), 1.);
}`;

    const fs = `#version 300 es
precision highp float;
in vec4 vCol;
out vec4 o;
void main() { o = vCol; }`;

    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s) || 'shader fail');
      }
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      ui.className = 'err';
      ui.textContent = gl.getProgramInfoLog(prog) || 'link fail';
      throw new Error(ui.textContent);
    }

    const uYaw = gl.getUniformLocation(prog, 'yaw');
    const uPitch = gl.getUniformLocation(prog, 'pitch');
    const uHalfW = gl.getUniformLocation(prog, 'halfW');
    const uHalfH = gl.getUniformLocation(prog, 'halfH');
    const uOffX = gl.getUniformLocation(prog, 'offX');
    const uOffY = gl.getUniformLocation(prog, 'offY');

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 28, 0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 28, 12);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.DEPTH_TEST);

    const yaw = 0.55;
    const pitch = 0.38;
    const zoom = 2.15;
    const STEP = 0.024;
    const STEP_MS = 100;
    let offX = 0;
    let offY = 0;
    let leg = null;
    const ghosts = [];
    let frames = 0;

    // How far the cube center can move so the whole cube stays on the white canvas.
    const bounds = () => {
      const a = canvas.clientWidth / max(1, canvas.clientHeight);
      const hh = zoom;
      const hw = zoom * a;
      const cubeReach = 1.4;
      return {
        x: max(0.04, 1.0 - cubeReach / hw),
        y: max(0.04, 1.0 - cubeReach / hh),
      };
    };

    const clampPos = () => {
      const { x: lx, y: ly } = bounds();
      offX = max(-lx, min(lx, offX));
      offY = max(-ly, min(ly, offY));
    };

    const pickLeg = () => {
      const { x: lx, y: ly } = bounds();
      const dirs = [{dx:0,dy:1},{dx:0,dy:-1},{dx:-1,dy:0},{dx:1,dy:0}];
      const ok = dirs.filter((d) => {
        const nx = offX + d.dx * STEP;
        const ny = offY + d.dy * STEP;
        return nx >= -lx && nx <= lx && ny >= -ly && ny <= ly;
      });
      const pool = ok.length ? ok : dirs;
      const d = pool[floor(random() * pool.length)];
      leg = { dx: d.dx, dy: d.dy, n: 2 + floor(random() * 7) };
    };

    const step = () => {
      if (!leg || leg.n <= 0) pickLeg();
      const px = offX;
      const py = offY;
      offX += leg.dx * STEP;
      offY += leg.dy * STEP;
      leg.n -= 1;
      clampPos();
      if (offX === px && offY === py) {
        pickLeg();
        offX += leg.dx * STEP;
        offY += leg.dy * STEP;
        leg.n -= 1;
        clampPos();
      }
      ghosts.push({ x: offX, y: offY });
      if (ghosts.length > 600) ghosts.shift();
    };

    const drawCubeAt = (ox, oy, hw, hh) => {
      gl.uniform1f(uYaw, yaw);
      gl.uniform1f(uPitch, pitch);
      gl.uniform1f(uHalfW, hw);
      gl.uniform1f(uHalfH, hh);
      gl.uniform1f(uOffX, ox);
      gl.uniform1f(uOffY, oy);
      gl.drawArrays(gl.TRIANGLES, 0, 36);
    };

    const paint = () => {
      const dpr = min(devicePixelRatio || 1, 2);
      const cw = max(1, floor(canvas.clientWidth * dpr));
      const ch = max(1, floor(canvas.clientHeight * dpr));
      if (canvas.width !== cw || canvas.height !== ch) {
        canvas.width = cw;
        canvas.height = ch;
        clampPos();
      }
      gl.viewport(0, 0, cw, ch);
      const a = cw / ch;
      const hh = zoom;
      const hw = zoom * a;

      gl.clearColor(1, 1, 1, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(prog);
      gl.bindVertexArray(vao);
      for (let i = 0; i < ghosts.length; i++) {
        drawCubeAt(ghosts[i].x, ghosts[i].y, hw, hh);
      }
    };

    const syncUi = () => {
      ui.className = '';
      ui.textContent = `${BUILD} AUTO · ${ghosts.length} ghosts (max 600) · R reset`;
    };

    const reset = () => {
      ghosts.length = 0;
      offX = 0;
      offY = 0;
      frames = 0;
      pickLeg();
      step();
      paint();
      syncUi();
    };

    pickLeg();
    step();
    paint();
    syncUi();

    let stepAcc = 0;
    const frame = (t) => {
      frames += 1;
      if (!stepAcc) stepAcc = t;
      while (t - stepAcc >= STEP_MS) {
        stepAcc += STEP_MS;
        step();
        paint();
        syncUi();
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);

    window.addEventListener('resize', paint);
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'r') reset();
    });
  }
}
  </script>
</body>
</html>
