  <!-- ═══════════════════════════════════════════════════════════════════════
       PORTRAIT SHELL — square art centered in portrait panel
       Canonical: docs/wall-screen-edition/templates/portrait-wall.starter-square.html
       Copy for each square piece. Do not edit template in place. See README.md
       ═══════════════════════════════════════════════════════════════════════ -->
  <style id="portrait-shell">
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    .hud {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: min(92vw, 92vh);
      pointer-events: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #888;
      z-index: 1000;
    }
    .hud .seed {
      letter-spacing: 0.12em;
      text-transform: none;
      color: #aaa;
    }
  </style>
  <style id="portrait-square-frame">
    /* Square art centered in portrait panel — do not stretch to full height */
    canvas:not(.p5Canvas) {
      display: none !important;
    }
    main {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    html.kiosk-rot canvas.p5Canvas,
    canvas.p5Canvas {
      position: relative !important;
      display: block !important;
      width: min(100vw, 100vh) !important;
      height: min(100vw, 100vh) !important;
      max-width: min(100vw, 100vh) !important;
      max-height: min(100vw, 100vh) !important;
      margin: 0 !important;
    }
    html.kiosk-rot body,
    body {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
  </style>
  <style id="kiosk-portrait-rotate">
    html.kiosk-rot {
      margin: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: #fff !important;
      overflow: hidden !important;
    }
    html.kiosk-rot body {
      position: fixed !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #fff !important;
      transform-origin: top left !important;
    }
  </style>

  <!-- ═══════════════════════════════════════════════════════════════════════
       PORTRAIT SHELL — rotate logic (HDMI mismatch only — not art composition)
       rotate=auto: landscape HDMI → portrait panel
       Desktop preview of square art: use ?rotate=0
       Do not edit here unless the canonical template was updated.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
  (function () {
    var p = new URLSearchParams(location.search);
    var rotParam = p.get("rotate");
    var rot =
      rotParam === "270" ? "270" : rotParam === "0" ? "0" : rotParam === "90" ? "90" : "auto";

    function physW() { return document.documentElement.clientWidth; }
    function physH() { return document.documentElement.clientHeight; }
    function chooseRot() {
      if (rot === "0" || rot === "90" || rot === "270") return rot;
      return physW() >= physH() ? "90" : "0";
    }

    var ROT = chooseRot();
    var nativesPatched = false;

    function patchNatives() {
      if (nativesPatched || ROT === "0") return;
      nativesPatched = true;
      document.documentElement.classList.add("kiosk-rot");
      Object.defineProperty(window, "innerWidth", {
        configurable: true,
        get: function () { return physH(); }
      });
      Object.defineProperty(window, "innerHeight", {
        configurable: true,
        get: function () { return physW(); }
      });
    }

    var applying = false;
    function layout() {
      if (applying) return;
      ROT = chooseRot();
      var W = physW(), H = physH(), b = document.body;
      if (!b || !W || !H) return;
      applying = true;
      try {
        if (ROT === "0") {
          document.documentElement.classList.remove("kiosk-rot");
          b.style.removeProperty("width");
          b.style.removeProperty("height");
          b.style.removeProperty("top");
          b.style.removeProperty("left");
          b.style.removeProperty("transform");
        } else {
          patchNatives();
          b.style.setProperty("width", H + "px", "important");
          b.style.setProperty("height", W + "px", "important");
          if (ROT === "270") {
            b.style.setProperty("top", W + "px", "important");
            b.style.setProperty("left", "0px", "important");
            b.style.setProperty("transform", "rotate(-90deg)", "important");
          } else {
            b.style.setProperty("top", "0px", "important");
            b.style.setProperty("left", W + "px", "important");
            b.style.setProperty("transform", "rotate(90deg)", "important");
          }
        }
        window.dispatchEvent(new Event("resize"));
      } finally {
        applying = false;
      }
    }

    window.addEventListener("resize", layout, true);
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", layout);
    } else {
      layout();
    }
    window.addEventListener("load", function () {
      requestAnimationFrame(layout);
    });
  })();
  </script>
</body>
</html>
