<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>COMPOSE · offer</title>
  <meta name="description" content="COMPOSE — ephemeral upload through RGB→XYZ GPU volume. Not stored." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; color: #3a3834; font-family: ui-monospace, Menlo, Consolas, monospace; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100% !important; height: 100% !important; }
    #ui {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(transparent, rgba(255,255,255,0.92) 24%, rgba(255,255,255,0.98));
      border-top: 1px solid rgba(58,56,52,0.12);
    }
    #ui.display-only { display: none; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .row:last-child { margin-bottom: 0; }
    label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b6760; }
    input[type="text"] {
      flex: 1 1 140px; min-width: 0; font: inherit; font-size: 12px;
      border: 1px solid rgba(58,56,52,0.2); padding: 8px 10px; background: #fff;
    }
    button, .btn {
      font: inherit; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      border: 1px solid #3a3834; background: #fff; color: #3a3834; padding: 8px 12px; cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary { background: #3a3834; color: #fff; }
    #status { font-size: 11px; line-height: 1.45; color: #6b6760; min-height: 2.8em; }
    #hint {
      position: fixed; top: 12px; left: 12px; z-index: 2; font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; color: rgba(58,56,52,0.55); pointer-events: none;
    }
    #hint.display-only { left: 50%; transform: translateX(-50%); text-align: center; }
    input[type="file"] { display: none; }
    a { color: #b8976a; }
  </style>
</head>
<body>
  <div id="hint">COMPOSE · RGB→XYZ · ephemeral</div>
  <div id="stage" aria-hidden="true"></div>
  <div id="ui">
    <div class="row">
      <label for="name">Name</label>
      <input id="name" type="text" name="name" placeholder="optional" autocomplete="name" />
      <label for="cohort">Cohort</label>
      <input id="cohort" type="text" name="cohort" placeholder="e.g. 21" inputmode="numeric" style="max-width:72px" />
    </div>
    <div class="row">
      <input id="file" type="file" accept="image/*" />
      <button type="button" class="primary" id="btn-offer">Offer image</button>
      <button type="button" id="btn-capture" disabled>Keep slide</button>
    </div>
    <p id="status">Loading GPU…</p>
  </div>
  <script type="module">
    import { createComposeRgbXyz } from "./compose-rgb-xyz.mjs";

    const params = new URLSearchParams(location.search);
    const displayOnly = params.get("mode") === "display";
    const seed = Number(params.get("seed") ?? "77823") >>> 0;

    const ui = document.getElementById("ui");
    const hint = document.getElementById("hint");
    const statusEl = document.getElementById("status");
    const fileInput = document.getElementById("file");
    const btnOffer = document.getElementById("btn-offer");
    const btnCapture = document.getElementById("btn-capture");
    const nameInput = document.getElementById("name");
    const cohortInput = document.getElementById("cohort");

    if (displayOnly) {
      ui.classList.add("display-only");
      hint.classList.add("display-only");
      hint.textContent = "COMPOSE · display";
    }

    const setStatus = (msg) => {
      statusEl.textContent = msg;
    };

    const engine = createComposeRgbXyz({
      mount: document.getElementById("stage"),
      seed,
      onStatus: setStatus,
    });

    const labelFromForm = () => {
      const parts = [];
      const n = nameInput.value.trim();
      const c = cohortInput.value.trim();
      if (n) parts.push(n);
      if (c) parts.push(`Loop ${c}`);
      return parts.join(" · ");
    };

    btnOffer.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      btnOffer.disabled = true;
      setStatus("Reading image…");
      try {
        await engine.offerFile(file, labelFromForm());
        btnCapture.disabled = false;
      } catch (err) {
        setStatus(`Offer failed · ${err.message}`);
      } finally {
        btnOffer.disabled = false;
        fileInput.value = "";
      }
    });

    btnCapture.addEventListener("click", () => {
      const dataUrl = engine.capturePng();
      if (!dataUrl) {
        setStatus("Capture blocked · try again");
        return;
      }
      const a = document.createElement("a");
      const slug = (labelFromForm() || "compose-slide").replace(/[^\w.-]+/g, "-").replace(/^-|-$/g, "") || "compose-slide";
      a.download = `${slug}.png`;
      a.href = dataUrl;
      a.click();
      setStatus("Slide kept locally · not uploaded to server");
    });
  </script>
</body>
</html>
