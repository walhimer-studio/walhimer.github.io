<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emotion Mirror — Mark Walhimer</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #141418;
      --ink: #e8e4dc;
      --muted: #8a8680;
      --ml: #4da6ff;
      --line: #2a2a32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    main { max-width: 980px; margin: 0 auto; padding: 24px 20px 48px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; letter-spacing: 0.04em; text-transform: uppercase; }
    .sub { color: var(--muted); margin-bottom: 20px; font-size: 13px; }
    .layout { display: grid; gap: 16px; }
    .video-wrap {
      position: relative;
      width: 100%;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
    }
    .video-wrap video {
      display: block;
      width: 100%;
      max-height: 72vh;
      object-fit: contain;
    }
    .video-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 14px 16px;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .big {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .big.ml { color: var(--ml); }
    .scores { margin-top: 12px; }
    .score-row {
      display: grid;
      grid-template-columns: 72px 1fr 44px;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .score-row .bar {
      height: 8px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
    }
    .score-row .bar span {
      display: block;
      height: 100%;
      background: #555;
      border-radius: 2px;
    }
    .score-row.top span:first-child { color: var(--ml); font-weight: 600; }
    .score-row.top .bar span { background: var(--ml); }
    .card h2.section-gap {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .scores-video .score-row .bar span { background: #666; }
    .scores-video .score-row.top span:first-child { color: var(--ink); font-weight: 600; }
    .scores-video .score-row.top .bar span { background: #888; }
    .note { color: var(--muted); font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Emotion Mirror</h1>
    <p class="sub" id="status">Loading face mesh…</p>

    <div class="layout">
      <div class="video-wrap">
        <video id="player" controls playsinline></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="card">
        <h2>ML now · <span id="time-label">0:00</span></h2>
        <div class="big ml" id="ml-now">—</div>
        <div class="scores" id="scores-now"></div>

        <h2 class="section-gap">Video share · % of this video</h2>
        <div class="scores scores-video" id="scores-video"></div>
      </div>
    </div>

    <p class="note">Scrub the video progress bar — blue box tracks face live; ML labels + bars jump to nearest sample (~every 5s) · mute helps</p>
  </main>

  <script src="../js/ml5-1.min.js"></script>
  <script>
    const VIDEO_BASE = 'sessions/testimony/';
    const DATA_URL = 'sessions/testimony-emotion-ml.json';

    const ML_WORDS = ['angry', 'disgust', 'fear', 'happy', 'sad', 'surprise', 'neutral'];

    let data = null;
    let duration = 0;
    let loadedVideo = '';
    let samplesForVideo = [];
    let faceMesh = null;
    let meshReady = false;
    let lastPredictions = [];
    let overlayLoop = null;
    let detectBusy = false;
    const scratch = document.createElement('canvas');

    const player = document.getElementById('player');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function fmt(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function buildSampleIndex() {
      const byVideo = {};
      for (const seg of data.segments) {
        const mp4 = seg.video.replace(/\.mov$/i, '.mp4');
        if (!byVideo[mp4]) byVideo[mp4] = [];
        for (const s of seg.samples_detail || []) {
          byVideo[mp4].push({ ...s, video: mp4 });
        }
      }
      return byVideo;
    }

    function firstVideo() {
      const mp4 = data.segments[0]?.video?.replace(/\.mov$/i, '.mp4');
      return mp4 || Object.keys(data.byVideo || {})[0] || '';
    }

    function nearestSample(t) {
      if (!samplesForVideo.length) return null;
      return samplesForVideo.reduce((best, s) =>
        Math.abs(s.t_sec - t) < Math.abs(best.t_sec - t) ? s : best, samplesForVideo[0]);
    }

    function videoLayout() {
      const vw = player.videoWidth;
      const vh = player.videoHeight;
      const cw = player.clientWidth;
      const ch = player.clientHeight;
      if (!vw || !vh || !cw || !ch) return null;
      const scale = Math.min(cw / vw, ch / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      return { scale, ox: (cw - dw) / 2, oy: (ch - dh) / 2, vw, vh, cw, ch };
    }

    function resizeOverlay() {
      const wrap = overlay.parentElement;
      overlay.width = Math.round(wrap.clientWidth);
      overlay.height = Math.round(player.clientHeight);
    }

    function normKeypoint(p, layout) {
      if (!p || !layout) return null;
      let x = p.x;
      let y = p.y;
      if (x >= 0 && x <= 1.001 && y >= 0 && y <= 1.001) {
        x *= layout.vw;
        y *= layout.vh;
      }
      return {
        x: layout.ox + x * layout.scale,
        y: layout.oy + y * layout.scale,
      };
    }

    function faceBounds(keypoints, layout) {
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      for (const p of keypoints) {
        const pt = normKeypoint(p, layout);
        if (!pt) continue;
        minX = Math.min(minX, pt.x);
        minY = Math.min(minY, pt.y);
        maxX = Math.max(maxX, pt.x);
        maxY = Math.max(maxY, pt.y);
      }
      if (!Number.isFinite(minX)) return null;
      const pad = Math.max(8, (maxX - minX) * 0.08);
      return {
        x: minX - pad,
        y: minY - pad,
        w: maxX - minX + pad * 2,
        h: maxY - minY + pad * 2,
      };
    }

    function drawLabel(ctx, x, y, text, fill) {
      ctx.font = '600 13px ui-sans-serif, system-ui, sans-serif';
      const padX = 8;
      const padY = 5;
      const w = ctx.measureText(text).width + padX * 2;
      const h = 22;
      ctx.fillStyle = fill;
      ctx.fillRect(x, y - h, w, h);
      ctx.fillStyle = '#fff';
      ctx.fillText(text, x + padX, y - padY);
    }

    function mlScoresSorted(scores) {
      return ML_WORDS
        .map((name) => ({ name, val: scores?.[name] ?? 0 }))
        .sort((a, b) => b.val - a.val);
    }

    function renderScores(scores, el, dominant) {
      if (!el) return;
      el.innerHTML = '';
      if (!scores) return;
      for (const { name, val } of mlScoresSorted(scores)) {
        const row = document.createElement('div');
        row.className = 'score-row' + (name === dominant ? ' top' : '');
        row.innerHTML = `
          <span>${name}</span>
          <div class="bar"><span style="width:${val}%"></span></div>
          <span>${val}%</span>
        `;
        el.appendChild(row);
      }
    }

    function videoShare(samples) {
      const counts = Object.fromEntries(ML_WORDS.map((w) => [w, 0]));
      for (const s of samples) {
        if (Object.hasOwn(counts, s.dominant)) counts[s.dominant]++;
      }
      const total = samples.length || 1;
      return ML_WORDS
        .map((name) => ({
          name,
          val: Math.round((counts[name] / total) * 1000) / 10,
        }))
        .sort((a, b) => b.val - a.val);
    }

    function renderVideoShare(samples) {
      const el = document.getElementById('scores-video');
      if (!el) return;
      el.innerHTML = '';
      if (!samples?.length) return;
      const shares = videoShare(samples);
      const top = shares[0]?.name;
      for (const { name, val } of shares) {
        const row = document.createElement('div');
        row.className = 'score-row' + (name === top && val > 0 ? ' top' : '');
        row.innerHTML = `
          <span>${name}</span>
          <div class="bar"><span style="width:${val}%"></span></div>
          <span>${val}%</span>
        `;
        el.appendChild(row);
      }
    }

    function drawOverlay(predictions, sample) {
      const layout = videoLayout();
      if (!layout || !predictions?.length) return;

      const box = faceBounds(predictions[0].keypoints || [], layout);
      if (!box) return;

      const mlTop = sample?.dominant || '—';

      ctx.strokeStyle = '#4da6ff';
      ctx.lineWidth = 3;
      ctx.strokeRect(box.x, box.y, box.w, box.h);

      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(box.x + 1, box.y + 1, box.w - 2, box.h - 2);

      drawLabel(ctx, box.x, box.y, `ML: ${mlTop}`, '#4da6ff');

      if (sample?.scores) {
        let ty = box.y + 4;
        for (const { name, val } of mlScoresSorted(sample.scores)) {
          const fill = name === sample.dominant
            ? 'rgba(77, 166, 255, 0.92)'
            : 'rgba(20, 20, 24, 0.88)';
          drawLabel(ctx, box.x + box.w + 6, ty + 18, `${name} ${val}%`, fill);
          ty += 22;
        }
      }
    }

    function drawOverlayFrame() {
      if (!loadedVideo) return;
      resizeOverlay();
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      const t = Number.isFinite(player.currentTime) ? player.currentTime : 0;
      const sample = nearestSample(t);
      updateHud(sample);
      drawOverlay(lastPredictions, sample);
    }

    function stopTracking() {
      if (overlayLoop) {
        cancelAnimationFrame(overlayLoop);
        overlayLoop = null;
      }
    }

    function detectFromVideoFrame() {
      if (!meshReady || detectBusy || player.readyState < 2) return;
      const vw = player.videoWidth;
      const vh = player.videoHeight;
      if (!vw || !vh) return;
      scratch.width = vw;
      scratch.height = vh;
      scratch.getContext('2d').drawImage(player, 0, 0, vw, vh);
      detectBusy = true;
      faceMesh.detect(scratch, (results) => {
        detectBusy = false;
        lastPredictions = results || [];
      });
    }

    function startTracking() {
      if (!meshReady || !player.src) return;
      stopTracking();
      lastPredictions = [];
      let lastDetect = 0;
      const tick = (now) => {
        overlayLoop = requestAnimationFrame(tick);
        if (now - lastDetect > 150) {
          lastDetect = now;
          detectFromVideoFrame();
        }
        drawOverlayFrame();
      };
      overlayLoop = requestAnimationFrame(tick);
      detectFromVideoFrame();
    }

    function updateHud(sample) {
      const t = Number.isFinite(player.currentTime) ? player.currentTime : 0;
      sample = sample || nearestSample(t);
      document.getElementById('time-label').textContent = fmt(t);
      const mlNow = document.getElementById('ml-now');
      const scoresEl = document.getElementById('scores-now');
      if (sample) {
        mlNow.textContent = sample.dominant;
        renderScores(sample.scores, scoresEl, sample.dominant);
      } else {
        mlNow.textContent = '—';
        if (scoresEl) scoresEl.innerHTML = '';
      }
    }

    function onVideoReady(seekT) {
      duration = player.duration;
      resizeOverlay();
      if (!Number.isFinite(duration) || duration <= 0) {
        setStatus('Video loaded but duration unknown.');
        updateHud();
        return;
      }
      player.currentTime = seekT ?? 0;
      startTracking();
      setStatus('Scrub video · blue box + bars update with DeepFace samples');
    }

    function loadVideo(mp4, seekT) {
      const src = VIDEO_BASE + mp4;
      samplesForVideo = (data.byVideo[mp4] || []).slice().sort((a, b) => a.t_sec - b.t_sec);
      renderVideoShare(samplesForVideo);

      if (loadedVideo === src && player.readyState >= 1) {
        player.currentTime = seekT ?? player.currentTime;
        onVideoReady(seekT);
        return;
      }

      stopTracking();
      loadedVideo = src;
      setStatus('Loading video…');
      const ready = () => onVideoReady(seekT);
      player.onloadedmetadata = ready;
      player.onerror = () => setStatus(`Video failed (${src}).`);
      player.src = src;
      player.load();
      if (player.readyState >= 1) ready();
    }

    window.addEventListener('resize', drawOverlayFrame);

    player.addEventListener('seeked', () => {
      detectFromVideoFrame();
      drawOverlayFrame();
    });
    player.addEventListener('timeupdate', drawOverlayFrame);

    async function initMesh() {
      try {
        setStatus('Loading face mesh…');
        faceMesh = await ml5.faceMesh({ maxFaces: 1, refineLandmarks: true });
        meshReady = true;
        setStatus('Face mesh ready · loading ML data…');
        data = await fetch(DATA_URL).then(r => r.json());
        data.byVideo = buildSampleIndex();
        const mp4 = firstVideo();
        if (mp4) loadVideo(mp4, 0);
      } catch (err) {
        setStatus('Could not load face mesh or sessions/testimony-emotion-ml.json.');
        console.error(err);
      }
    }

    if (typeof ml5 === 'undefined') {
      setStatus('ml5 failed to load — check ../js/ml5-1.min.js is vendored locally.');
    } else {
      initMesh();
    }
  </script>
</body>
</html>
