<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>COMPOSE · offer</title>
  <meta name="description" content="COMPOSE — ephemeral upload through RGB→XYZ GPU volume. Not stored." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; color: #3a3834; font-family: ui-monospace, Menlo, Consolas, monospace; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100% !important; height: 100% !important; }
    #ui {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(transparent, rgba(255,255,255,0.92) 24%, rgba(255,255,255,0.98));
      border-top: 1px solid rgba(58,56,52,0.12);
    }
    #ui.display-only { display: none; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .row:last-child { margin-bottom: 0; }
    label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b6760; }
    input[type="text"] {
      flex: 1 1 140px; min-width: 0; font: inherit; font-size: 12px;
      border: 1px solid rgba(58,56,52,0.2); padding: 8px 10px; background: #fff;
    }
    button, .btn {
      font: inherit; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      border: 1px solid #3a3834; background: #fff; color: #3a3834; padding: 8px 12px; cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary { background: #3a3834; color: #fff; }
    #status { font-size: 11px; line-height: 1.45; color: #6b6760; min-height: 2.8em; }
    #hint {
      position: fixed; top: 12px; left: 12px; z-index: 2; font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; color: rgba(58,56,52,0.55); pointer-events: none;
    }
    #hint.display-only { left: 50%; transform: translateX(-50%); text-align: center; }
    input[type="file"] { display: none; }
    a { color: #b8976a; }
  </style>
  <script>
    window.addEventListener("error", (e) => {
      const el = document.getElementById("status");
      if (!el || el.textContent !== "Loading GPU…") return;
      const msg = e.message || e.reason?.message || "module failed to load";
      el.textContent = `GPU load failed · ${msg} · serve from repo root`;
    }, true);
  </script>
</head>
<body>
  <div id="hint">COMPOSE · RGB→XYZ · ephemeral</div>
  <div id="stage" aria-hidden="true"></div>
  <div id="ui">
    <div class="row">
      <label for="name">Name</label>
      <input id="name" type="text" name="name" placeholder="optional" autocomplete="name" />
      <label for="cohort">Cohort</label>
      <input id="cohort" type="text" name="cohort" placeholder="e.g. 21" inputmode="numeric" style="max-width:72px" />
    </div>
    <div class="row">
      <input id="file" type="file" accept="image/*" />
      <button type="button" class="primary" id="btn-offer">Offer image</button>
      <button type="button" id="btn-capture" disabled>Keep slide</button>
    </div>
    <p id="status">Loading GPU…</p>
  </div>
  <script type="module">
    async function loadThree() {
      for (const path of ["/sketches/js/three-0.170.0.module.js", "../js/three-0.170.0.module.js"]) {
        try {
          return await import(path);
        } catch (_) { /* try next path */ }
      }
      throw new Error("Three.js not found");
    }

    const THREE = await loadThree();

    const PAL = {
      pink: [255, 16, 240],
      yellow: [255, 244, 0],
      orange: [255, 120, 0],
      skyBlue: [199, 225, 250],
      white: [255, 255, 255],
      mint: [153, 165, 207],
      violet: [180, 140, 255],
    };

    const SPECTRUM = [PAL.pink, PAL.yellow, PAL.orange, PAL.mint, PAL.violet, PAL.skyBlue];

    const SLICE_FRAG = [
      "precision highp float;",
      "uniform sampler2D buf, img, mot;",
      "uniform float time;",
      "uniform vec3 dims;",
      "uniform float uSlice;",
      "uniform int doRaster;",
      "uniform int doSpectrum;",
      "uniform vec3 specA, specB, specInk;",
      "uniform float specAlphaAB, specAlphaInk, paletteVeil;",
      "varying vec2 vUv;",
      "vec2 atlasUV(vec2 uv, float z) { return vec2(uv.x, (z + uv.y) / dims.z); }",
      "vec3 sampleVol(vec2 uv, float dz) { return texture2D(buf, atlasUV(uv, uSlice + dz)).rgb; }",
      "void main() {",
      "  vec2 uv = vec2(vUv.x, 1.0 - vUv.y);",
      "  vec2 pos = floor(uv * dims.xy);",
      "  vec3 col = sampleVol(uv, 0.0);",
      "  vec4 m = texture2D(mot, uv);",
      "  float dr = floor(m.r * 255.0 + 0.5);",
      "  float dg = floor(m.g * 255.0 + 0.5);",
      "  float db = floor(m.b * 255.0 + 0.5);",
      "  vec2 oxy = vec2(0.0);",
      "  float oz = 0.0;",
      "  if (doRaster == 1) {",
      "    if (mod(dr, 2.0) >= 1.0) oxy.y += 1.0 / dims.y;",
      "    if (mod(dr, 4.0) >= 2.0) oxy.x += 1.0 / dims.x;",
      "    if (mod(dr, 8.0) >= 4.0) oxy.y -= 1.0 / dims.y;",
      "    if (mod(dr, 16.0) >= 8.0) oxy.x -= 1.0 / dims.x;",
      "    if (mod(db, 2.0) >= 1.0) oz += 1.0;",
      "    if (mod(db, 4.0) >= 2.0) oz -= 1.0;",
      "    if (mod(db, 8.0) >= 4.0) oz += 2.0;",
      "    col = sampleVol(uv + oxy, oz);",
      "  }",
      "  if (doSpectrum == 1) {",
      "    if (mod(dg, 2.0) >= 1.0) {",
      "      vec2 bUv = mod(pos, 16.0) / 16.0;",
      "      vec4 tile = texture2D(img, bUv);",
      "      col = mix(col, tile.rgb, tile.a * paletteVeil);",
      "    }",
      "    if (mod(dg, 4.0) >= 2.0) {",
      "      vec3 spec = mix(specA, specB, fract(time * 0.14));",
      "      col = mix(col, spec, specAlphaAB);",
      "    }",
      "    if (mod(dg, 8.0) >= 4.0) col = mix(col, specInk, specAlphaInk);",
      "  }",
      "  gl_FragColor = vec4(col, 1.0);",
      "}",
    ].join("\n");

    const CUBE_FRAG = [
      "precision highp float;",
      "uniform sampler2D vol;",
      "uniform vec3 dims;",
      "uniform vec3 boxSize;",
      "varying vec3 vPos;",
      "varying vec3 vRayDir;",
      "vec2 atlasUV(vec2 uv, float z) { return vec2(uv.x, (z + uv.y) / dims.z); }",
      "vec3 sampleVol(vec3 p) {",
      "  vec3 q = clamp(p, 0.001, 0.999);",
      "  float z = q.z * (dims.z - 1.0);",
      "  return texture2D(vol, atlasUV(q.xy, z)).rgb;",
      "}",
      "void main() {",
      "  vec3 ro = vPos;",
      "  vec3 rd = normalize(vRayDir);",
      "  vec3 inv = 1.0 / max(abs(rd), 1e-4);",
      "  vec3 t0 = (-boxSize - ro) * inv;",
      "  vec3 t1 = (boxSize - ro) * inv;",
      "  vec3 tmin = min(t0, t1);",
      "  vec3 tmax = max(t0, t1);",
      "  float ta = max(max(tmin.x, tmin.y), tmin.z);",
      "  float tb = min(min(tmax.x, tmax.y), tmax.z);",
      "  if (tb < max(ta, 0.0)) { gl_FragColor = vec4(1.0); return; }",
      "  float tStart = max(ta, 0.0);",
      "  vec3 col = vec3(1.0);",
      "  for (float i = 0.0; i < 48.0; i++) {",
      "    float t = tStart + (tb - tStart) * (i + 0.5) / 48.0;",
      "    vec3 p = (ro + rd * t) / (boxSize * 2.0) + 0.5;",
      "    if (any(lessThan(p, vec3(0.0))) || any(greaterThan(p, vec3(1.0)))) continue;",
      "    vec3 s = sampleVol(p);",
      "    float ink = length(s - vec3(1.0));",
      "    float a = clamp(0.05 + ink * 0.58, 0.0, 0.94);",
      "    col = mix(col, s, a);",
      "  }",
      "  gl_FragColor = vec4(col, 1.0);",
      "}",
    ].join("\n");

    function palette16() {
      const a = new Uint8Array(16 * 16 * 4);
      for (let i = 0; i < 256; i++) {
        const x = i % 16;
        const y = Math.floor(i / 16);
        const grid = x % 4 === 0 || y % 4 === 0;
        const c = grid ? SPECTRUM[(((x >> 2) + (y >> 2) * 2) % SPECTRUM.length)] : PAL.white;
        const veil = grid ? 0.12 + ((((x >> 2) + (y >> 2)) % 5) * 0.07) : 0;
        a[i * 4] = c[0];
        a[i * 4 + 1] = c[1];
        a[i * 4 + 2] = c[2];
        a[i * 4 + 3] = Math.floor(veil * 255);
      }
      return a;
    }

    function makeDataTex(w, h, data) {
      const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.UnsignedByteType);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      tex.needsUpdate = true;
      return tex;
    }

    function imageDataFromFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            const c = document.createElement("canvas");
            c.width = img.naturalWidth || img.width;
            c.height = img.naturalHeight || img.height;
            c.getContext("2d").drawImage(img, 0, 0);
            resolve(c.getContext("2d").getImageData(0, 0, c.width, c.height));
          } catch (err) {
            reject(err);
          } finally {
            URL.revokeObjectURL(url);
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Could not load image"));
        };
        img.src = url;
      });
    }

    function updateAutoCamera(camera, innerVol, t, { seed, hasOffer, displayOnly }) {
      const s = seed * 0.001;
      const pace = displayOnly ? 1 : (hasOffer ? 0.75 : 0.45);
      const focalY = innerVol ? innerVol.position.y : 5.25;
      const focalZ = innerVol ? innerVol.position.z : -18;

      const orbitHz = pace * (displayOnly ? 0.13 : hasOffer ? 0.1 : 0.055);
      const theta = t * orbitHz * Math.PI * 2 + s;
      const radius = (displayOnly ? 6.2 : hasOffer ? 4.6 : 2.5) * pace;
      const dolly = Math.sin(t * 0.085 * pace + s * 2) * (displayOnly ? 3.8 : 2.2);
      const bob = Math.sin(t * 0.21 * pace + s) * (displayOnly ? 2 : 1.1);
      const sway = Math.sin(t * 0.17 * pace + s * 4) * (displayOnly ? 1.2 : 0.6);

      const x = Math.cos(theta) * radius + sway;
      const y = focalY + bob + Math.cos(t * 0.13 * pace + s * 3) * 0.55;
      const z = (displayOnly ? 12.5 : 10) + dolly - (hasOffer ? 1.8 : 0);

      camera.position.set(x, y, z);
      camera.lookAt(
        Math.sin(t * 0.09 * pace + s) * (displayOnly ? 2.4 : 1.3),
        focalY + Math.sin(t * 0.15 * pace) * 0.65,
        focalZ + 8 + Math.cos(t * 0.07 * pace + s) * (displayOnly ? 3.5 : 2)
      );

      if (innerVol) {
        innerVol.rotation.y = t * pace * 0.055;
        innerVol.rotation.x = Math.sin(t * 0.12 * pace + s) * 0.07;
      }
    }

    function createComposeRgbXyz({ mount, seed = 77823, displayOnly = false, onStatus } = {}) {
      const depth = 24;
      let width = 128;
      let height = 96;
      let renderer;
      let scene;
      let camera;
      let innerVol;
      let volTex = [];
      let volId = 0;
      let imgTex;
      let motTex;
      let motScratch;
      let sliceRT;
      let sliceMat;
      let sliceScene;
      let sliceCam;
      let raf = 0;
      let running = false;
      let hasOffer = false;
      let offerLabel = "";
      const options = { doRaster: 1, doSpectrum: 1 };
      const specA = new THREE.Vector3(1, 0.9, 0.2);
      const specB = new THREE.Vector3(0.2, 0.85, 1);
      const specInk = new THREE.Vector3(0.15, 0.1, 0.2);

      const setStatus = (msg) => onStatus?.(msg);

      const volSize = () => {
        let w = Math.max(96, Math.min(192, Math.floor(window.innerWidth * 0.45)));
        let h = Math.max(72, Math.min(144, Math.floor(window.innerHeight * 0.38)));
        const maxH = Math.floor(4096 / depth);
        if (h > maxH) {
          const s = maxH / h;
          h = maxH;
          w = Math.max(64, Math.floor(w * s));
        }
        return { w, h };
      };

      const uploadMot = (pixels) => {
        if (!motTex) return;
        if (!motScratch) motScratch = document.createElement("canvas");
        if (motScratch.width !== width || motScratch.height !== height) {
          motScratch.width = width;
          motScratch.height = height;
        }
        const src = document.createElement("canvas");
        src.width = pixels.width;
        src.height = pixels.height;
        src.getContext("2d").putImageData(pixels, 0, 0);
        const ctx = motScratch.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(src, 0, 0, width, height);
        const d = ctx.getImageData(0, 0, width, height);
        motTex.image.data.set(d.data);
        motTex.needsUpdate = true;
      };

      const copySliceToAtlas = (destTex, z) => {
        const gl = renderer.getContext();
        renderer.initTexture(destTex);
        const destProps = renderer.properties.get(destTex);
        const rtProps = renderer.properties.get(sliceRT);
        gl.bindTexture(gl.TEXTURE_2D, destProps.__webglTexture);
        gl.bindFramebuffer(gl.FRAMEBUFFER, rtProps.__webglFramebuffer);
        gl.copyTexSubImage2D(gl.TEXTURE_2D, 0, 0, z * height, 0, 0, width, height);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      };

      const rebuild = () => {
        const { w, h } = volSize();
        width = w;
        height = h;

        volTex.forEach((t) => t.dispose());
        volTex = [0, 1].map(() => {
          const data = new Uint8Array(w * h * depth * 4);
          data.fill(255);
          const tex = new THREE.DataTexture(data, w, h * depth, THREE.RGBAFormat, THREE.UnsignedByteType);
          tex.minFilter = THREE.NearestFilter;
          tex.magFilter = THREE.NearestFilter;
          tex.needsUpdate = true;
          return tex;
        });

        if (imgTex) imgTex.dispose();
        imgTex = makeDataTex(16, 16, palette16());

        if (motTex) motTex.dispose();
        motTex = makeDataTex(width, height, new Uint8Array(width * height * 4).fill(255));

        if (sliceRT) sliceRT.dispose();
        sliceRT = new THREE.WebGLRenderTarget(width, height, {
          minFilter: THREE.NearestFilter,
          magFilter: THREE.NearestFilter,
          depthBuffer: false,
          stencilBuffer: false,
        });

        if (sliceMat) {
          sliceMat.uniforms.dims.value.set(width, height, depth);
          sliceMat.uniforms.buf.value = volTex[0];
          sliceMat.uniforms.img.value = imgTex;
          sliceMat.uniforms.mot.value = motTex;
        }

        if (innerVol) {
          innerVol.material.uniforms.vol.value = volTex[0];
          innerVol.material.uniforms.dims.value.set(width, height, depth);
        }
      };

      const init = () => {
        renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
        renderer.setClearColor(0xffffff, 1);
        mount.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(62, 1, 0.05, 400);
        camera.position.set(0, 2, 10);

        const { w, h } = volSize();
        width = w;
        height = h;

        volTex = [0, 1].map(() => {
          const data = new Uint8Array(w * h * depth * 4);
          data.fill(255);
          const tex = new THREE.DataTexture(data, w, h * depth, THREE.RGBAFormat, THREE.UnsignedByteType);
          tex.minFilter = THREE.NearestFilter;
          tex.magFilter = THREE.NearestFilter;
          tex.needsUpdate = true;
          return tex;
        });

        imgTex = makeDataTex(16, 16, palette16());
        motTex = makeDataTex(width, height, new Uint8Array(width * height * 4).fill(255));

        sliceRT = new THREE.WebGLRenderTarget(width, height, {
          minFilter: THREE.NearestFilter,
          magFilter: THREE.NearestFilter,
          depthBuffer: false,
          stencilBuffer: false,
        });

        sliceMat = new THREE.ShaderMaterial({
          uniforms: {
            buf: { value: volTex[0] },
            img: { value: imgTex },
            mot: { value: motTex },
            time: { value: 0 },
            dims: { value: new THREE.Vector3(width, height, depth) },
            uSlice: { value: 0 },
            doRaster: { value: 1 },
            doSpectrum: { value: 1 },
            specA: { value: specA },
            specB: { value: specB },
            specInk: { value: specInk },
            specAlphaAB: { value: 0.35 },
            specAlphaInk: { value: 0.22 },
            paletteVeil: { value: 0.55 },
          },
          vertexShader: "varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }",
          fragmentShader: SLICE_FRAG,
          depthTest: false,
          depthWrite: false,
        });

        sliceScene = new THREE.Scene();
        sliceCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        sliceScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), sliceMat));

        const bx = 26;
        const by = 15;
        const bz = 8;
        const cubeMat = new THREE.ShaderMaterial({
          uniforms: {
            vol: { value: volTex[0] },
            dims: { value: new THREE.Vector3(width, height, depth) },
            boxSize: { value: new THREE.Vector3(bx, by, bz) },
          },
          vertexShader: [
            "varying vec3 vPos; varying vec3 vRayDir;",
            "void main(){ vPos=position; vec4 mv=modelViewMatrix*vec4(position,1.0);",
            "vRayDir=-mv.xyz; gl_Position=projectionMatrix*mv; }",
          ].join("\n"),
          fragmentShader: CUBE_FRAG,
          side: THREE.BackSide,
          depthWrite: false,
        });

        innerVol = new THREE.Mesh(new THREE.BoxGeometry(bx * 2, by * 2, bz * 2), cubeMat);
        innerVol.position.set(0, by * 0.35, -18);
        scene.add(innerVol);

        const resize = () => {
          rebuild();
          const pw = mount.clientWidth || window.innerWidth;
          const ph = mount.clientHeight || window.innerHeight;
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.setSize(pw, ph, false);
          camera.aspect = pw / Math.max(ph, 1);
          camera.updateProjectionMatrix();
        };

        resize();
        window.addEventListener("resize", resize);
        setStatus(`COMPOSE · seed ${seed >>> 0} · offer an image`);
      };

      const render = (timeMs) => {
        const t = timeMs * 0.001;
        sliceMat.uniforms.time.value = t;
        sliceMat.uniforms.doRaster.value = options.doRaster;
        sliceMat.uniforms.doSpectrum.value = options.doSpectrum;

        const volPrev = volId;
        const volCur = volId ^ 1;
        volId = volCur;

        sliceMat.uniforms.buf.value = volTex[volPrev];
        renderer.setRenderTarget(sliceRT);
        for (let z = 0; z < depth; z++) {
          sliceMat.uniforms.uSlice.value = z;
          renderer.render(sliceScene, sliceCam);
          copySliceToAtlas(volTex[volCur], z);
        }
        renderer.setRenderTarget(null);

        innerVol.material.uniforms.vol.value = volTex[volCur];

        updateAutoCamera(camera, innerVol, t, { seed, hasOffer, displayOnly });

        renderer.render(scene, camera);
      };

      const start = () => {
        if (running) return;
        running = true;
        const loop = (t) => {
          if (!running) return;
          render(t);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
      };

      const stop = () => {
        running = false;
        if (raf) cancelAnimationFrame(raf);
      };

      const offerImageData = (pixels, label = "") => {
        uploadMot(pixels);
        hasOffer = true;
        offerLabel = label;
        setStatus(label ? `offered · ${label}` : "offered · in GPU only (not stored)");
      };

      const offerFile = async (file, label = "") => {
        const pixels = await imageDataFromFile(file);
        offerImageData(pixels, label || file.name || "upload");
      };

      const capturePng = () => {
        const canvas = renderer?.domElement;
        if (!canvas) return null;
        try {
          return canvas.toDataURL("image/png");
        } catch (_) {
          return null;
        }
      };

      init();
      start();

      return {
        offerFile,
        offerImageData,
        capturePng,
        start,
        stop,
        get hasOffer() {
          return hasOffer;
        },
        get offerLabel() {
          return offerLabel;
        },
      };
    }

    const params = new URLSearchParams(location.search);
    const displayOnly = params.get("mode") === "display";
    const seed = Number(params.get("seed") ?? "77823") >>> 0;

    const ui = document.getElementById("ui");
    const hint = document.getElementById("hint");
    const statusEl = document.getElementById("status");
    const fileInput = document.getElementById("file");
    const btnOffer = document.getElementById("btn-offer");
    const btnCapture = document.getElementById("btn-capture");
    const nameInput = document.getElementById("name");
    const cohortInput = document.getElementById("cohort");

    if (displayOnly) {
      ui.classList.add("display-only");
      hint.classList.add("display-only");
      hint.textContent = "COMPOSE · display · auto camera";
    }

    const setStatus = (msg) => {
      statusEl.textContent = msg;
    };

    let engine;
    try {
      engine = createComposeRgbXyz({
        mount: document.getElementById("stage"),
        seed,
        displayOnly,
        onStatus: setStatus,
      });
    } catch (err) {
      setStatus(`GPU init failed · ${err.message}`);
      throw err;
    }

    const labelFromForm = () => {
      const parts = [];
      const n = nameInput.value.trim();
      const c = cohortInput.value.trim();
      if (n) parts.push(n);
      if (c) parts.push(`Loop ${c}`);
      return parts.join(" · ");
    };

    btnOffer.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      btnOffer.disabled = true;
      setStatus("Reading image…");
      try {
        await engine.offerFile(file, labelFromForm());
        btnCapture.disabled = false;
      } catch (err) {
        setStatus(`Offer failed · ${err.message}`);
      } finally {
        btnOffer.disabled = false;
        fileInput.value = "";
      }
    });

    btnCapture.addEventListener("click", () => {
      const dataUrl = engine.capturePng();
      if (!dataUrl) {
        setStatus("Capture blocked · try again");
        return;
      }
      const a = document.createElement("a");
      const slug = (labelFromForm() || "compose-slide").replace(/[^\w.-]+/g, "-").replace(/^-|-$/g, "") || "compose-slide";
      a.download = `${slug}.png`;
      a.href = dataUrl;
      a.click();
      setStatus("Slide kept locally · not uploaded to server");
    });
  </script>
</body>
</html>
