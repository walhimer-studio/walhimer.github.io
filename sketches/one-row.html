<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>One Row</title>
  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    canvas { display: block; margin: 0 auto; }
    #bottom-hud {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      user-select: none;
    }
    #lifeline-track {
      width: min(44vw, 228px);
      height: 1px;
      background: rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
    }
    #lifeline-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: rgba(0, 0, 0, 0.55);
    }
    #seed-hud {
      margin: 0;
      font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: rgba(0, 0, 0, 0.45);
      letter-spacing: 0.12em;
    }
  </style>
  <script src="js/p5-1.11.2.min.js"></script>
</head>
<body>
<div id="bottom-hud">
  <div id="lifeline-track" aria-hidden="true"><span id="lifeline-fill"></span></div>
  <p id="seed-hud" aria-live="polite"></p>
</div>
<script>
/** Machine DNA · seed · lifeline · ?seed=N · N+1 rebirth */
const LIFESPAN_MS = 480000;

let city = [];
let cols = 1;
let rows = 30;
let spacing = 109;
let palette = [310, 45, 30, 210, 270];

let camZ = 2000;
let targetCamZ = 2000;
let camSpeed = 0.5;

let gradientTextures = [];
let artSeed;
let lifeStart;
let lifelineFill;
let seedHud;

function parseSeedFromUrl() {
  try {
    const raw = new URLSearchParams(location.search).get('seed');
    if (raw === null || raw === '') return null;
    const n = parseInt(raw, 10);
    if (Number.isFinite(n) && n >= 0) return n;
  } catch (e) {}
  return null;
}

function updateHud() {
  if (seedHud) seedHud.textContent = 'seed ' + artSeed;
}

function updateLifeline() {
  if (!lifelineFill) return;
  const pct = min(100, ((millis() - lifeStart) / LIFESPAN_MS) * 100);
  lifelineFill.style.width = pct.toFixed(2) + '%';
  if (millis() - lifeStart >= LIFESPAN_MS) rebirth(artSeed + 1);
}

function buildGradientTextures() {
  gradientTextures = [];
  for (let i = 0; i < 10; i++) {
    let hue1 = random(palette);
    let hue2 = random(palette);
    let tex = createGraphics(64, 256);
    tex.colorMode(HSB, 360, 100, 100, 255);
    for (let y = 0; y < tex.height; y++) {
      let inter = map(y, 0, tex.height, 0, 1);
      let hBlend = lerp(hue1, hue2, inter);
      tex.stroke(hBlend, 100, 100, 100);
      tex.line(0, y, tex.width, y);
    }
    gradientTextures.push(tex);
  }
}

function buildCity() {
  city = [];
  for (let z = -rows / 2; z < rows / 2; z++) {
    for (let x = -cols / 2; x < cols / 2; x++) {
      let w = random(100, 200);
      let d = random(100, 200);
      let h = random(100, 300);
      let tex = random(gradientTextures);
      city.push({ x: 0, z: z * spacing, w, h, d, tex });
    }
  }
}

function rebirth(seed) {
  artSeed = seed ?? floor(random(1e9));
  randomSeed(artSeed);
  noiseSeed(artSeed);
  lifeStart = millis();
  camZ = 2000;
  targetCamZ = 2000;
  buildGradientTextures();
  buildCity();
  updateHud();
  if (lifelineFill) lifelineFill.style.width = '0%';
  console.log('Seed:', artSeed);
}

function setup() {
  lifelineFill = document.getElementById('lifeline-fill');
  seedHud = document.getElementById('seed-hud');

  createCanvas(1000, 1000, WEBGL);
  pixelDensity(4);
  frameRate(60);
  colorMode(HSB, 360, 100, 100, 255);
  noStroke();
  setAttributes('alpha', true);

  rebirth(parseSeedFromUrl());
}

function draw() {
  updateLifeline();

  background(0, 0, 100);

  targetCamZ -= camSpeed;
  camZ = lerp(camZ, targetCamZ, 0.05);

  let camX = 0;
  let camY = 50;
  let lookZ = camZ - 100;
  let lookX = 0;
  camera(camX, camY, camZ, lookX, camY, lookZ, 0, 1, 0);

  ambientLight(255);
  directionalLight(255, 255, 255, 0.3, -1, -0.5);
  blendMode(BLEND);

  for (let b of city) {
    push();
    texture(b.tex);
    translate(b.x, 160 - b.h / 2, b.z);
    box(b.w, b.h, b.d);
    pop();
  }
}

function keyPressed() {
  if (key === 'g' || key === 'G') rebirth(artSeed + 1);
  if (key === 'n' || key === 'N') rebirth(floor(random(1e9)));
}
</script>
</body>
</html>
