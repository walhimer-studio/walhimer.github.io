<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupled AV — Prismatic Fluid</title>
  <style>
    :root {
      --ink: #f2f0ea;
      --muted: rgba(242, 240, 234, 0.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body {
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
    }
    #canvas { display: block; width: 100%; height: 100%; }
    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 55%, rgba(40, 20, 60, 0.4), transparent 50%),
        rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      z-index: 10;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .panel {
      text-align: center;
      max-width: 28rem;
      padding: 1.5rem;
    }
    .panel h1 {
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
      color: var(--muted);
    }
    .panel p {
      font-size: 1.05rem;
      line-height: 1.45;
      margin-bottom: 1.5rem;
    }
    .nav {
      margin-bottom: 1.25rem;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
    }
    .nav a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid rgba(242, 240, 234, 0.25);
    }
    .nav a:hover { color: var(--ink); }
    button {
      appearance: none;
      border: 1px solid rgba(242, 240, 234, 0.35);
      background: rgba(242, 240, 234, 0.06);
      color: var(--ink);
      padding: 0.85rem 1.6rem;
      font: inherit;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    button:hover {
      background: rgba(242, 240, 234, 0.14);
      border-color: rgba(242, 240, 234, 0.7);
    }
    #hud {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      z-index: 5;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #hud.visible { opacity: 1; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../js/three-0.170.0.module.js",
      "three/addons/": "../js/three-0.170.0-jsm/",
      "tone": "../js/tone-14.8.49.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="overlay">
    <div class="panel">
      <p class="nav"><a href="./index.html">← Portal POC</a></p>
      <h1>Prismatic Fluid</h1>
      <p>Mirrored caustic light + starfield from the same generative state as the sound — concert-wall moodboard lane.</p>
      <button id="start" type="button">Start experience</button>
    </div>
  </div>
  <div id="hud">energy —</div>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    // Vendored tone-*.module.js is a UMD build: it sets globalThis.Tone, not ESM exports.
    import "tone";
    const Tone = globalThis.Tone;
    if (!Tone?.start) {
      throw new Error("Tone.js failed to load (expected globalThis.Tone)");
    }

    // Shared generative world — sight and sound are siblings
    const world = {
      time: 0,
      energy: 0.4,
      hue: 0.72,
      turbulence: 0.35,
      spread: 0.55,
      pulse: 0,
      pulseGate: 0,
      filament: 0.5,
    };

    const canvas = document.getElementById("canvas");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("start");
    const hud = document.getElementById("hud");

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const uniforms = {
      uTime: { value: 0 },
      uEnergy: { value: world.energy },
      uHue: { value: world.hue },
      uTurbulence: { value: world.turbulence },
      uSpread: { value: world.spread },
      uPulse: { value: 0 },
      uFilament: { value: world.filament },
      uResolution: {
        value: new THREE.Vector2(window.innerWidth, window.innerHeight),
      },
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        precision highp float;
        varying vec2 vUv;
        uniform float uTime;
        uniform float uEnergy;
        uniform float uHue;
        uniform float uTurbulence;
        uniform float uSpread;
        uniform float uPulse;
        uniform float uFilament;
        uniform vec2 uResolution;

        vec3 hsv2rgb(vec3 c) {
          vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
          vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
          return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          float a = hash(i);
          float b = hash(i + vec2(1.0, 0.0));
          float c = hash(i + vec2(0.0, 1.0));
          float d = hash(i + vec2(1.0, 1.0));
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }

        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p = m * p;
            a *= 0.5;
          }
          return v;
        }

        // Soft prismatic rainbow along a 0–1 parameter
        vec3 spectrum(float t) {
          t = clamp(t, 0.0, 1.0);
          // warm outer → cool inner feel (ref butterfly)
          float h = fract(0.02 + t * 0.72 + uHue * 0.08);
          float s = 0.75 - t * 0.25;
          float v = 0.55 + t * 0.45;
          return hsv2rgb(vec3(h, s, v));
        }

        void main() {
          vec2 res = uResolution;
          vec2 uv = (gl_FragCoord.xy - 0.5 * res) / res.y;
          float t = uTime;

          // Perfect vertical mirror (concert LED symmetry)
          vec2 p = uv;
          p.x = abs(p.x);

          // Origin near top-center, wings fan down/out
          vec2 origin = vec2(0.0, 0.72);
          vec2 d = p - origin;
          float ang = atan(d.x, -d.y); // 0 = down from hinge
          float r = length(d);

          // Flow / caustic field
          float flowScale = 2.2 + uTurbulence * 3.5;
          vec2 flowUv = vec2(ang * 2.2, r * flowScale - t * (0.18 + uEnergy * 0.22));
          float n = fbm(flowUv);
          float n2 = fbm(flowUv * 1.7 + vec2(2.1, -t * 0.1));

          // Wing mask: butterfly / V silhouette
          float wingOpen = 0.55 + uSpread * 0.75;
          float wingEdge = smoothstep(wingOpen, wingOpen - 0.35, ang + n * 0.12 * uTurbulence);
          float falloff = exp(-r * (1.1 - uEnergy * 0.35));
          float wing = wingEdge * falloff;
          wing *= smoothstep(1.55, 0.15, r);

          // Radial prism rays
          float rays = abs(sin(ang * (14.0 + uEnergy * 10.0) + n * 3.5 + t * 0.4));
          rays = pow(rays, 2.2 - uEnergy);
          float softRays = abs(sin(ang * 6.0 - t * 0.15 + n2));
          softRays = pow(softRays, 3.0);

          // Caustic filaments (piano-backdrop / floor-caustic DNA)
          float filaments = sin(r * (18.0 + uFilament * 22.0) - t * (1.4 + uEnergy) + n * 6.0);
          filaments = smoothstep(0.35, 0.95, filaments) * (0.35 + uFilament * 0.65);

          float bright = wing * (
            rays * 0.85 +
            softRays * 0.45 +
            filaments * 0.7 +
            n2 * 0.25
          );
          bright += wing * uPulse * 0.55 * exp(-r * 2.5);

          // Chromatic split along angle
          float spectT = clamp(ang / wingOpen + n * 0.08, 0.0, 1.0);
          vec3 col = spectrum(spectT) * bright;
          col += spectrum(spectT + 0.08) * filaments * wing * 0.55;
          col += vec3(0.9, 0.95, 1.0) * pow(bright, 2.5) * (0.35 + uPulse * 0.4);

          // Hot hinge at top center
          float hinge = exp(-length(uv - origin) * (8.0 - uPulse * 3.0));
          col += vec3(1.0) * hinge * (0.45 + uEnergy * 0.4);

          // Starfield (void behind the prism)
          float stars = 0.0;
          vec2 cell = floor(uv * vec2(res.y / res.x, 1.0) * 95.0);
          float h = hash(cell);
          if (h > 0.985) {
            float tw = 0.5 + 0.5 * sin(t * (2.0 + h * 5.0) + h * 20.0);
            stars = tw * (h - 0.985) / 0.015;
          }
          // Keep stars mostly outside the bright wing
          col += vec3(stars) * (1.0 - smoothstep(0.05, 0.45, bright));

          // Soft vignette
          float vig = smoothstep(1.4, 0.35, length(uv * vec2(0.75, 1.0)));
          col *= 0.75 + 0.25 * vig;

          gl_FragColor = vec4(col, 1.0);
        }
      `,
    });

    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.1,
      0.55,
      0.15
    );
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    let audioReady = false;
    let drone, shimmer, pulseSynth, filter, chorus, reverb;

    async function initAudio() {
      await Tone.start();
      if (Tone.context?.state !== "running") {
        await Tone.context.resume();
      }

      reverb = new Tone.Reverb({ decay: 7.5, wet: 0.5 }).toDestination();
      chorus = new Tone.Chorus({ frequency: 0.4, delayTime: 3.5, depth: 0.55, wet: 0.35 })
        .connect(reverb)
        .start();
      filter = new Tone.Filter({
        frequency: 700,
        type: "lowpass",
        rolloff: -24,
      }).connect(chorus);

      drone = new Tone.PolySynth(Tone.Synth, {
        maxPolyphony: 5,
        oscillator: { type: "triangle" },
        envelope: { attack: 2.8, decay: 1.2, sustain: 0.8, release: 4 },
        volume: -20,
      }).connect(filter);

      shimmer = new Tone.PolySynth(Tone.Synth, {
        maxPolyphony: 4,
        oscillator: { type: "sine" },
        envelope: { attack: 0.01, decay: 0.8, sustain: 0.1, release: 1.2 },
        volume: -22,
      }).connect(reverb);

      pulseSynth = new Tone.MetalSynth({
        frequency: 120,
        envelope: { attack: 0.001, decay: 0.25, release: 0.15 },
        harmonicity: 4.2,
        modulationIndex: 18,
        resonance: 2800,
        octaves: 1.2,
        volume: -28,
      }).connect(reverb);

      drone.triggerAttack(["F2", "C3", "Ab3", "Eb4"]);
      audioReady = true;
    }

    const shimmerNotes = ["Ab4", "Bb4", "C5", "Eb5", "F5", "G5", "Ab5"];
    let lastPulseBeat = -1;
    let lastShimmerBeat = -1;

    function updateAudioFromWorld() {
      if (!audioReady) return;

      const cutoff = 320 + world.energy * 3200 + world.pulse * 700;
      filter.frequency.rampTo(cutoff, 0.08);
      drone.volume.rampTo(-24 + world.energy * 10, 0.12);
      drone.set({ detune: (world.hue - 0.5) * 55 });
      chorus.wet.rampTo(0.2 + world.turbulence * 0.4, 0.2);
      reverb.wet.rampTo(0.35 + world.spread * 0.35, 0.25);
      pulseSynth.volume.rampTo(-34 + world.filament * 12, 0.1);

      const pulseBeat = Math.floor(world.time * (0.55 + world.energy * 0.9));
      if (pulseBeat !== lastPulseBeat && world.pulseGate > 0.78) {
        lastPulseBeat = pulseBeat;
        pulseSynth.frequency.value = 90 + world.hue * 80;
        pulseSynth.triggerAttackRelease("16n", undefined, 0.2 + world.energy * 0.35);
      }

      // Filament density → sparse high shimmer (same motion as caustic lines)
      const shimBeat = Math.floor(world.time * (1.1 + world.filament * 1.4));
      if (shimBeat !== lastShimmerBeat && world.filament > 0.45 && Math.random() < 0.35 + world.energy * 0.4) {
        lastShimmerBeat = shimBeat;
        const idx = Math.floor((world.hue + world.spread) * shimmerNotes.length) % shimmerNotes.length;
        shimmer.triggerAttackRelease(shimmerNotes[idx], "8n", undefined, 0.15 + world.energy * 0.25);
      }
    }

    function evolveWorld(dt, t) {
      world.time = t;

      world.energy = THREE.MathUtils.clamp(
        0.38 +
          0.22 * Math.sin(t * 0.09) +
          0.16 * Math.sin(t * 0.031 + 0.8) +
          0.1 * Math.sin(t * 0.27),
        0.1,
        0.98
      );

      world.hue = (0.68 + 0.12 * Math.sin(t * 0.04) + 0.06 * Math.sin(t * 0.11)) % 1;

      world.turbulence = THREE.MathUtils.clamp(
        0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 0.065 + 1.4)) + world.energy * 0.2,
        0.08,
        1
      );

      world.spread = THREE.MathUtils.clamp(
        0.45 + 0.28 * Math.sin(t * 0.048) + world.energy * 0.15,
        0.25,
        1
      );

      world.filament = THREE.MathUtils.clamp(
        0.35 + 0.4 * (0.5 + 0.5 * Math.sin(t * 0.12 + 2.2)) + world.turbulence * 0.2,
        0.1,
        1
      );

      const pulsePhase = t * (0.55 + world.energy * 0.9);
      world.pulseGate = 0.5 + 0.5 * Math.sin(pulsePhase * Math.PI * 2);
      world.pulse = Math.pow(Math.max(0, world.pulseGate), 10);
    }

    function applyWorldToVisuals() {
      uniforms.uTime.value = world.time;
      uniforms.uEnergy.value = world.energy;
      uniforms.uHue.value = world.hue;
      uniforms.uTurbulence.value = world.turbulence;
      uniforms.uSpread.value = world.spread;
      uniforms.uPulse.value = world.pulse;
      uniforms.uFilament.value = world.filament;

      bloom.strength = 0.75 + world.energy * 0.95 + world.pulse * 0.5;
      bloom.radius = 0.4 + world.spread * 0.4;
      renderer.toneMappingExposure = 0.95 + world.energy * 0.4;
    }

    let running = false;
    let last = 0;

    function frame(now) {
      requestAnimationFrame(frame);
      if (!running) {
        // Idle preview of the shader without audio
        const t = now * 0.001;
        evolveWorld(0.016, t);
        applyWorldToVisuals();
        composer.render();
        return;
      }

      const t = now * 0.001;
      const dt = Math.min(0.05, (now - last) * 0.001 || 0.016);
      last = now;

      evolveWorld(dt, t);
      applyWorldToVisuals();
      updateAudioFromWorld();

      hud.textContent =
        `energy ${world.energy.toFixed(2)}  ·  hue ${world.hue.toFixed(2)}  ·  ` +
        `turb ${world.turbulence.toFixed(2)}  ·  filament ${world.filament.toFixed(2)}`;

      composer.render();
    }

    requestAnimationFrame(frame);

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      startBtn.textContent = "Starting…";
      try {
        await initAudio();
        running = true;
        overlay.classList.add("hidden");
        hud.classList.add("visible");
      } catch (err) {
        console.error(err);
        startBtn.disabled = false;
        startBtn.textContent = "Start experience";
        alert("Could not start audio. Check browser permissions and try again.");
      }
    });

    window.addEventListener("resize", () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloom.setSize(w, h);
      uniforms.uResolution.value.set(w, h);
    });
  </script>
</body>
</html>
