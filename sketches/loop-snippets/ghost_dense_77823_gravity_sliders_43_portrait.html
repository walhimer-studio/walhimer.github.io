<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ghost Dense 77823 — Gravity Sliders · 43″ portrait wall</title>
</head>
<body>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var rotParam = p.get("rotate");
  // default auto: landscape HDMI → 90° for portrait panel; 270 / 0 / 90 explicit
  var rot =
    rotParam === "270" ? "270" : rotParam === "0" ? "0" : rotParam === "90" ? "90" : "auto";
  // Same-folder art core (framing / sliders). This page is the portrait wall entry.
  var sketch = new URL("ghost_dense_77823_gravity_sliders_43.html", location.href).href;
  var baseHref = new URL("./", location.href).href;

  // Full-bleed software rotate — chronicle for 43″ / 55″ Hisense-class panels.
  // Physical size from documentElement (not window.inner* — those get patched).
  var inject =
    '<base href="' +
    baseHref +
    '">' +
    '<style id="kiosk-portrait-rotate">' +
    "html.kiosk-rot{margin:0!important;width:100%!important;height:100%!important;background:#fff!important;overflow:hidden!important;}" +
    "html.kiosk-rot body{position:fixed!important;margin:0!important;padding:0!important;overflow:hidden!important;background:#fff!important;transform-origin:top left!important;}" +
    "html.kiosk-rot canvas{display:block!important;width:100%!important;height:100%!important;}" +
    "</style>" +
    '<script>(function(){' +
    "var REQUESTED='" +
    rot +
    "';" +
    "function physW(){return document.documentElement.clientWidth;}" +
    "function physH(){return document.documentElement.clientHeight;}" +
    "function chooseRot(){" +
    "if(REQUESTED==='0'||REQUESTED==='90'||REQUESTED==='270')return REQUESTED;" +
    "return physW()>=physH()?'90':'0';" +
    "}" +
    "var ROT=chooseRot();" +
    "var nativesPatched=false;" +
    "function patchNatives(){" +
    "if(nativesPatched||ROT==='0')return;" +
    "nativesPatched=true;" +
    "document.documentElement.classList.add('kiosk-rot');" +
    "Object.defineProperty(window,'innerWidth',{configurable:true,get:function(){return physH();}});" +
    "Object.defineProperty(window,'innerHeight',{configurable:true,get:function(){return physW();}});" +
    "}" +
    "var applying=false;" +
    "function layout(){" +
    "if(applying)return;" +
    "ROT=chooseRot();" +
    "var W=physW(),H=physH(),b=document.body;" +
    "if(!b||!W||!H)return;" +
    "applying=true;" +
    "try{" +
    "if(ROT==='0'){" +
    "document.documentElement.classList.remove('kiosk-rot');" +
    "b.style.removeProperty('width');" +
    "b.style.removeProperty('height');" +
    "b.style.removeProperty('top');" +
    "b.style.removeProperty('left');" +
    "b.style.removeProperty('transform');" +
    "}else{" +
    "patchNatives();" +
    "b.style.setProperty('width',H+'px','important');" +
    "b.style.setProperty('height',W+'px','important');" +
    "if(ROT==='270'){" +
    "b.style.setProperty('top',W+'px','important');" +
    "b.style.setProperty('left','0px','important');" +
    "b.style.setProperty('transform','rotate(-90deg)','important');" +
    "}else{" +
    "b.style.setProperty('top','0px','important');" +
    "b.style.setProperty('left',W+'px','important');" +
    "b.style.setProperty('transform','rotate(90deg)','important');" +
    "}" +
    "}" +
    "window.dispatchEvent(new Event('resize'));" +
    "}finally{applying=false;}" +
    "}" +
    "window.addEventListener('resize',layout,true);" +
    "if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',layout);}" +
    "else{layout();}" +
    "window.addEventListener('load',function(){requestAnimationFrame(layout);});" +
    "})();<\/script>";

  fetch(sketch)
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (html) {
      html = html.replace("</head>", inject + "</head>");
      html = html.replace(
        /<body([^>]*)>/i,
        '<body$1><script>window.dispatchEvent(new Event("resize"));<\/script>'
      );
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (err) {
      document.body.style.font = "14px ui-monospace, monospace";
      document.body.style.padding = "2em";
      document.body.textContent =
        "Portrait load failed: " + err.message + " — open " + sketch;
    });
})();
</script>
</body>
</html>
