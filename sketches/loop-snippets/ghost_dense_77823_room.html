<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghost 77823 — White Room</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #fff; overflow: hidden; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    .hud {
      position: fixed; left: 50%; bottom: 14px;
      transform: translateX(-50%);
      display: flex; justify-content: space-between; align-items: flex-end;
      width: min(92vw, 640px);
      pointer-events: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: #888;
    }
    .hud .seed { letter-spacing: 0.12em; text-transform: none; color: #aaa; }
    #prompt {
      position: fixed; inset: 0; display: grid; place-items: center;
      z-index: 10;
      background: rgba(255,255,255,0.88); color: #2c3034;
      font-family: Georgia, "Times New Roman", serif; font-weight: 300;
      text-align: center; line-height: 1.75; cursor: pointer;
    }
    #prompt.hidden { display: none; }
    #mode {
      position: fixed; top: 14px; right: 14px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px; color: #aaa; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="prompt">
    <div>
      <p><em>Surrender Machines</em></p>
      <p style="margin-top:0.75rem;font-size:14px;">Click to enter the room</p>
      <p style="font-size:12px;color:#888;margin-top:0.35rem;">drag to look · WASD move · F first-person (forward into hall)</p>
    </div>
  </div>
  <div id="mode">walk</div>
  <div class="hud">
    <span id="hud-room">Room A · black · code mural</span>
    <span class="seed" id="hud-seed">ghost seed 77823 · room B</span>
  </div>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="surrender-machines-three-core.js"></script>
  <script>
(function () {
  "use strict";

  const SEED = 77823;
  const ROOM = { width: 28, depth: 28, height: 9 };
  const LAYOUT = { hallwayWidth: 4, hallwayLength: 8, hallwayLengthAB: 16, doorwayWidth: 4 };
  const RW = ROOM.width / 2, RD = ROOM.depth / 2;
  const ROOM_A_X = -(RW + LAYOUT.hallwayLengthAB + RW);
  const ROOM_C_X = RW + LAYOUT.hallwayLength + RW;
  const HALL_AB = { x0: ROOM_A_X + RW, x1: -RW };
  const HALL_BC = { x0: RW, x1: ROOM_C_X - RW };
  const BOUND_ROOM_Z = RD - 1.2;
  const BOUND_HALL_Z = LAYOUT.hallwayWidth / 2 - 0.2;
  const BOUND_X_MIN = ROOM_A_X - RW + 1.2;
  const BOUND_X_MAX = ROOM_C_X + RW - 1.2;
  /** Room A spawn: west of center, facing east into hall A–B (WASD forward = into hall). */
  const SPAWN_A = {
    x: ROOM_A_X - 8,
    y: 1.62,
    z: 0,
    lookX: HALL_AB.x0 + LAYOUT.hallwayLengthAB * 0.45,
  };
  function orientSpawnEast() {
    camera.position.set(SPAWN_A.x, SPAWN_A.y, SPAWN_A.z);
    camera.lookAt(SPAWN_A.lookX, SPAWN_A.y, SPAWN_A.z);
    orbit.target.set(SPAWN_A.lookX, SPAWN_A.y, SPAWN_A.z);
  }
  const PALETTE = {
    ink: 0x2c3034,
    lightBlue: 0x74b4dc,
    skyBlue: 0x80b8e8,
    navy: 0x5a788c,
    gold: 0xeca018,
    maroon: 0x662020,
  };
  const TAU = Math.PI * 2;
  const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

  function makeRng(seed) {
    let s = seed >>> 0;
    return {
      random() {
        s = (s + 0x6d2b79f5) >>> 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },
      uniform(a, b) { return a + this.random() * (b - a); },
      randint(a, b) { return a + Math.floor(this.random() * (b - a + 1)); },
      choice(arr) { return arr[this.randint(0, arr.length - 1)]; },
      chance(p) { return this.random() < p; },
    };
  }

  function cpts(cx, cy, cz, r, plane, n) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = TAU * i / n;
      if (plane === "xz") pts.push(v3(cx + r * Math.cos(a), cy, cz + r * Math.sin(a)));
      else if (plane === "xy") pts.push(v3(cx + r * Math.cos(a), cy + r * Math.sin(a), cz));
      else pts.push(v3(cx, cy + r * Math.sin(a), cz + r * Math.cos(a)));
    }
    return pts;
  }

  class WireBuilder {
    constructor(root) {
      this.root = root;
      this.staticRoot = new THREE.Group();
      this.root.add(this.staticRoot);
      this.spinners = [];
      this.stack = [this.staticRoot];
      this.current = this.staticRoot;
      this.lineColor = PALETTE.ink;
    }
    setColor(color) { this.lineColor = color == null ? PALETTE.ink : color; }
    resetColor() { this.lineColor = PALETTE.ink; }
    pushSpin(px, py, pz, axis, durationSec, reverse) {
      const pivot = new THREE.Group();
      pivot.position.set(px, py, pz);
      const content = new THREE.Group();
      pivot.add(content);
      this.root.add(pivot);
      const speed = (reverse ? -1 : 1) * (TAU / durationSec);
      pivot.name = "machine_spin_" + this.spinners.length;
      this.spinners.push({ pivot, axis, speed });
      this.stack.push(content);
      this.current = content;
    }
    popSpin() {
      if (this.stack.length <= 1) return;
      this.stack.pop();
      this.current = this.stack[this.stack.length - 1];
    }
    _lineGeo(a, b) {
      const g = new THREE.BufferGeometry();
      g.setFromPoints([a, b]);
      return g;
    }
    seg(a, b, opacity) {
      let op = opacity == null ? 1 : opacity;
      if (this.lineColor !== PALETTE.ink) op = Math.min(op, 0.48);
      this.current.add(new THREE.Line(this._lineGeo(a, b), new THREE.LineBasicMaterial({
        color: this.lineColor, transparent: op < 1, opacity: op,
      })));
    }
    spoly(pts, close, opacity) {
      for (let i = 0; i < pts.length; i++) {
        const j = (i + 1) % pts.length;
        if (!close && i === pts.length - 1) break;
        this.seg(pts[i], pts[j], opacity);
      }
    }
    disk(cx, cy, cz, r, plane, n) { this.spoly(cpts(cx, cy, cz, r, plane, n), true); }
    box(x, y, z, bw, bh, bd) {
      const c = [
        v3(x, y, z), v3(x + bw, y, z), v3(x + bw, y, z + bd), v3(x, y, z + bd),
        v3(x, y + bh, z), v3(x + bw, y + bh, z), v3(x + bw, y + bh, z + bd), v3(x, y + bh, z + bd),
      ];
      [[0,1],[0,3],[0,4],[1,5],[3,7],[4,5],[4,7],[5,6],[6,7]].forEach(([a,b]) => this.seg(c[a], c[b]));
      [[1,2],[2,3],[2,6]].forEach(([a,b]) => this.seg(c[a], c[b], 0.45));
    }
    cyl(cx, cy, cz, r, h, n, ribs) {
      const bot = cpts(cx, cy, cz, r, "xz", n);
      const top = cpts(cx, cy + h, cz, r, "xz", n);
      let li = 0, ri = 0;
      for (let i = 1; i < n; i++) {
        if (bot[i].x < bot[li].x) li = i;
        if (bot[i].x > bot[ri].x) ri = i;
      }
      this.spoly(bot, true); this.spoly(top, true);
      this.seg(bot[li], top[li]); this.seg(bot[ri], top[ri]);
      if (ribs) {
        const step = Math.max(1, Math.floor(n / ribs));
        for (let i = 0; i < n; i += step) this.seg(bot[i], top[i], 0.35);
      }
    }
    cylX(cx, cy, cz, r, length, n) {
      const lpts = [], rpts = [];
      for (let i = 0; i < n; i++) {
        const a = TAU * i / n;
        lpts.push(v3(cx - length / 2, cy + r * Math.sin(a), cz + r * Math.cos(a)));
        rpts.push(v3(cx + length / 2, cy + r * Math.sin(a), cz + r * Math.cos(a)));
      }
      let ti = 0, bi = 0;
      for (let i = 1; i < n; i++) {
        if (lpts[i].y < lpts[ti].y) ti = i;
        if (lpts[i].y > lpts[bi].y) bi = i;
      }
      this.spoly(lpts, true); this.spoly(rpts, true);
      this.seg(lpts[ti], rpts[ti]); this.seg(lpts[bi], rpts[bi]);
    }
    cylZ(cx, cy, cz, r, length, n) {
      const lpts = [], rpts = [];
      for (let i = 0; i < n; i++) {
        const a = TAU * i / n;
        lpts.push(v3(cx + r * Math.cos(a), cy + r * Math.sin(a), cz - length / 2));
        rpts.push(v3(cx + r * Math.cos(a), cy + r * Math.sin(a), cz + length / 2));
      }
      let ti = 0, bi = 0;
      for (let i = 1; i < n; i++) {
        if (lpts[i].y < lpts[ti].y) ti = i;
        if (lpts[i].y > lpts[bi].y) bi = i;
      }
      this.spoly(lpts, true); this.spoly(rpts, true);
      this.seg(lpts[ti], rpts[ti]); this.seg(lpts[bi], rpts[bi]);
    }
    ringXZ(cx, cy, cz, rOut, rIn, h, n) {
      for (const yy of [cy, cy + h]) {
        this.spoly(cpts(cx, yy, cz, rOut, "xz", n), true);
        this.spoly(cpts(cx, yy, cz, rIn, "xz", n), true, 0.65);
      }
      const botO = cpts(cx, cy, cz, rOut, "xz", n);
      const topO = cpts(cx, cy + h, cz, rOut, "xz", n);
      let li = 0, ri = 0;
      for (let i = 1; i < n; i++) {
        if (botO[i].x < botO[li].x) li = i;
        if (botO[i].x > botO[ri].x) ri = i;
      }
      this.seg(botO[li], topO[li]); this.seg(botO[ri], topO[ri]);
      const botI = cpts(cx, cy, cz, rIn, "xz", n);
      const topI = cpts(cx, cy + h, cz, rIn, "xz", n);
      this.seg(botI[li], topI[li], 0.65); this.seg(botI[ri], topI[ri], 0.65);
    }
    gearRingXZ(cx, cy, cz, r, teeth, th) {
      this.ringXZ(cx, cy, cz, r, r * 0.82, th, 64);
      const thR = r * 0.078;
      for (let i = 0; i < teeth; i++) {
        const a1 = TAU * (i - 0.4) / teeth, a2 = TAU * (i + 0.4) / teeth;
        const tp = (a, rr, yy) => v3(cx + rr * Math.cos(a), yy, cz + rr * Math.sin(a));
        this.spoly([tp(a1,r,cy+th),tp(a2,r,cy+th),tp(a2,r+thR,cy+th),tp(a1,r+thR,cy+th)], true, 0.75);
        this.seg(tp(a1,r+thR,cy), tp(a1,r+thR,cy+th), 0.55);
      }
    }
    gearRingXY(cx, cy, cz, r, teeth, th) {
      const n = 64;
      const ptsF = cpts(cx, cy, cz, r, "xy", n);
      const ptsB = cpts(cx, cy, cz + th, r, "xy", n);
      this.spoly(ptsF, true); this.spoly(ptsB, true, 0.55);
      this.spoly(cpts(cx, cy, cz, r * 0.82, "xy", n), true, 0.52);
      this.spoly(cpts(cx, cy, cz + th, r * 0.82, "xy", n), true, 0.38);
      const pick = (fn, ax) => {
        let idx = 0;
        for (let i = 1; i < n; i++) if (fn(ax(ptsF[i]), ax(ptsF[idx]))) idx = i;
        return idx;
      };
      [[Math.min,p=>p.y],[Math.max,p=>p.y],[Math.min,p=>p.x],[Math.max,p=>p.x]].forEach(([fn,ax]) => {
        const idx = pick(fn, ax);
        this.seg(ptsF[idx], ptsB[idx], 0.78);
      });
      const thR = r * 0.078;
      for (let i = 0; i < teeth; i++) {
        const a1 = TAU * (i - 0.4) / teeth, a2 = TAU * (i + 0.4) / teeth;
        const tp = (a, rr, dz) => v3(cx + rr * Math.cos(a), cy + rr * Math.sin(a), cz + dz);
        this.spoly([tp(a1,r,0),tp(a2,r,0),tp(a2,r+thR,0),tp(a1,r+thR,0)], true, 0.55);
        this.seg(tp(a1,r+thR,0), tp(a1,r+thR,th), 0.32);
      }
    }
    gearRingYZ(cx, cy, cz, r, teeth, th) {
      const n = 72;
      const yz = (dx, rr) => {
        const out = [];
        for (let i = 0; i < n; i++) {
          const a = TAU * i / n;
          out.push(v3(cx + dx, cy + rr * Math.sin(a), cz + rr * Math.cos(a)));
        }
        return out;
      };
      const ptsF = yz(0, r), ptsB = yz(th, r);
      this.spoly(ptsF, true); this.spoly(ptsB, true, 0.55);
      this.spoly(yz(0, r * 0.82), true, 0.52);
      this.spoly(yz(th, r * 0.82), true, 0.38);
      const pick = (fn, ax) => {
        let idx = 0;
        for (let i = 1; i < n; i++) if (fn(ax(ptsF[i]), ax(ptsF[idx]))) idx = i;
        return idx;
      };
      [[Math.min,p=>p.y],[Math.max,p=>p.y],[Math.min,p=>p.x],[Math.max,p=>p.x]].forEach(([fn,ax]) => {
        this.seg(ptsF[pick(fn, ax)], ptsB[pick(fn, ax)], 0.78);
      });
      const thR = r * 0.078;
      for (let i = 0; i < teeth; i++) {
        const a1 = TAU * (i - 0.4) / teeth, a2 = TAU * (i + 0.4) / teeth;
        const tp = (a, rr, dx) => v3(cx + dx, cy + rr * Math.sin(a), cz + rr * Math.cos(a));
        this.spoly([tp(a1,r,0),tp(a2,r,0),tp(a2,r+thR,0),tp(a1,r+thR,0)], true, 0.55);
        this.seg(tp(a1,r+thR,0), tp(a1,r+thR,th), 0.32);
      }
    }
    gearXZ(cx, cy, cz, r, teeth, th) {
      const thR = r * 0.12;
      for (let i = 0; i < teeth; i++) {
        const a1 = TAU * (i - 0.38) / teeth, a2 = TAU * (i + 0.38) / teeth;
        const tp = (a, rr, yy) => v3(cx + rr * Math.cos(a), yy, cz + rr * Math.sin(a));
        this.spoly([tp(a1,r,cy+th),tp(a2,r,cy+th),tp(a2,r+thR,cy+th),tp(a1,r+thR,cy+th)], true, 0.75);
        this.seg(tp(a1,r+thR,cy), tp(a1,r+thR,cy+th), 0.5);
      }
      this.disk(cx, cy, cz, r, "xz", 48);
      this.disk(cx, cy + th, cz, r * 0.88, "xz", 48);
      this.disk(cx, cy + th, cz, r * 0.18, "xz", 48);
    }
    spokes(cx, cy, cz, r, n, plane) {
      for (let i = 0; i < n; i++) {
        const a = Math.PI * i / n;
        if (plane === "xz") {
          this.seg(v3(cx+r*Math.cos(a),cy,cz+r*Math.sin(a)), v3(cx-r*Math.cos(a),cy,cz-r*Math.sin(a)), 0.4);
        } else if (plane === "yz") {
          this.seg(v3(cx,cy+r*Math.sin(a),cz+r*Math.cos(a)), v3(cx,cy-r*Math.sin(a),cz-r*Math.cos(a)), 0.4);
        } else {
          this.seg(v3(cx+r*Math.cos(a),cy+r*Math.sin(a),cz), v3(cx-r*Math.cos(a),cy-r*Math.sin(a),cz), 0.4);
        }
      }
    }
    pipe(a, b) { this.seg(a, b); }
  }

  function spinDur(rng, lo, hi) { return rng.uniform(lo, hi); }

  function drawMachine(w, rng) {
    let baseTop = 0;
    const nLayers = rng.randint(3, 6);
    const baseW = rng.uniform(5.5, 7.5);
    const baseD = rng.uniform(3.5, 5.0);
    for (let i = 0; i < nLayers; i++) {
      const shrink = i * rng.uniform(0.12, 0.22);
      let yOff = 0;
      for (let j = 0; j < i; j++) yOff += rng.uniform(0.12, 0.26);
      w.box(-baseW/2+shrink, yOff, -baseD/2+shrink, baseW-shrink*2, rng.uniform(0.12,0.26), baseD-shrink*2);
    }
    for (let i = 0; i < nLayers; i++) baseTop += rng.uniform(0.12, 0.26);

    const outerR = rng.uniform(2.2, 3.4);
    const outerTeeth = rng.randint(36, 60);
    const outerTh = rng.uniform(0.18, 0.32);
    const outerY = rng.uniform(1.4, 2.2);
    const outerOx = rng.uniform(-0.5, 0.5);
    const outerOz = rng.uniform(-0.5, 0.5);

    w.pushSpin(outerOx, outerY, outerOz, "y", spinDur(rng, 18, 26), rng.chance(0.5));
    w.setColor(PALETTE.lightBlue);
    w.gearRingXZ(0, 0, 0, outerR, outerTeeth, outerTh);
    w.spokes(0, outerTh / 2, 0, outerR * 0.88, rng.randint(5, 10), "xz");
    w.resetColor();
    w.popSpin();

    for (let i = 0; i < rng.randint(8, 14); i++) {
      const r = rng.uniform(0.4, outerR - 0.3);
      const teeth = rng.randint(8, 44);
      const y = rng.uniform(baseTop, outerY + 1.5);
      const th = rng.uniform(0.08, 0.24);
      const ox = rng.uniform(-0.6, 0.6);
      const oz = rng.uniform(-0.6, 0.6);
      const plane = rng.choice(["xz","xz","xy","xy","yz","yz"]);
      const axis = plane === "xz" ? "y" : plane === "xy" ? "z" : "x";
      w.pushSpin(ox, y, oz, axis, spinDur(rng, 8, 18), rng.chance(0.5));
      if (i % 5 === 0) w.setColor(PALETTE.maroon);
      if (plane === "xz") w.gearRingXZ(0, 0, 0, r, teeth, th);
      else if (plane === "xy") w.gearRingXY(0, 0, 0, r, teeth, th);
      else w.gearRingYZ(0, 0, 0, r, teeth, th);
      w.resetColor();
      w.popSpin();
    }

    for (let i = 0; i < rng.randint(10, 20); i++) {
      w.box(rng.uniform(-2.8,1.5), rng.uniform(baseTop,3.0), rng.uniform(-1.5,1.5),
            rng.uniform(0.4,2.5), rng.uniform(0.3,2.0), rng.uniform(0.3,2.0));
    }

    const towers = [];
    for (let i = 0; i < rng.randint(12, 20); i++) {
      towers.push([rng.uniform(-2.4,2.2), baseTop, rng.uniform(-1.2,1.2)]);
    }
    for (let ti = 0; ti < towers.length; ti++) {
      const tx = towers[ti][0], ty = towers[ti][1], tz = towers[ti][2];
      const th = rng.uniform(2.0, 4.5);
      w.setColor(PALETTE.navy);
      w.cyl(tx, ty, tz, 0.1, th, 48, 0);
      w.resetColor();
      const nG = rng.randint(2, 6);
      for (let j = 0; j < nG; j++) {
        const gy = ty + (th * (j + 1)) / (nG + 1) + rng.uniform(-0.12, 0.12);
        w.pushSpin(tx, gy, tz, "y", spinDur(rng, 5, 11), rng.chance(0.5));
        if (ti === 0 && j === 0) w.setColor(PALETTE.gold);
        w.gearXZ(0, 0, 0, rng.uniform(0.28, 1.3), rng.randint(6, 24), rng.uniform(0.07, 0.22));
        w.resetColor();
        w.popSpin();
      }
    }

    const discStep = rng.uniform(0.16, 0.28);
    const discShrink = rng.uniform(0.12, 0.22);
    for (let i = 0; i < rng.randint(10, 20); i++) {
      const yy = baseTop + i * discStep;
      const r = outerR * 0.92 - i * discShrink;
      if (r > 0.15) {
        w.pushSpin(rng.uniform(-0.3,0.3), yy, rng.uniform(-0.3,0.3), "y", spinDur(rng,10,20), rng.chance(0.5));
        w.disk(0, 0, 0, r, "xz", 48);
        w.popSpin();
      }
    }

    const cylConfigs = [];
    for (let i = 0; i < rng.randint(6, 10); i++) {
      cylConfigs.push([rng.uniform(0.1,2.8), rng.uniform(0.3,4.2), rng.randint(2,14)]);
    }
    cylConfigs.sort((a, b) => b[0] - a[0]);
    cylConfigs.forEach(([r, h, ribs], ci) => {
      if (ci === 0) w.setColor(PALETTE.skyBlue);
      w.cyl(rng.uniform(-0.4,0.4), baseTop, rng.uniform(-0.4,0.4), r, h, 48, ribs);
      w.resetColor();
    });
    for (let i = 0; i < rng.randint(4, 8); i++) {
      w.cyl(rng.uniform(-2.2,2.2), baseTop, rng.uniform(-1.5,1.5), rng.uniform(0.3,1.0), rng.uniform(0.8,2.8), 48, rng.randint(2,6));
    }
    for (let i = 0; i < rng.randint(4, 8); i++) {
      w.cylX(rng.uniform(-0.5,0.5), rng.uniform(baseTop+0.3,3.5), rng.uniform(-0.8,0.8), rng.uniform(0.18,0.5), rng.uniform(2.5,5.5), 32);
    }
    for (let i = 0; i < rng.randint(2, 5); i++) {
      w.cylZ(rng.uniform(-0.5,0.5), rng.uniform(baseTop+0.3,3.5), rng.uniform(-0.4,0.4), rng.uniform(0.2,0.45), rng.uniform(2.5,4.5), 32);
    }
    for (let i = 0; i < rng.randint(8, 16); i++) {
      const plane = rng.choice(["yz","yz","xy","xy","yz"]);
      const cx = plane === "yz" ? rng.choice([-2.2,-2.2,2.2]) : rng.uniform(-1.5,1.5);
      const cy = rng.uniform(baseTop + 0.2, 3.0);
      const cz = plane === "yz" ? rng.uniform(-1.2,1.2) : rng.choice([-1.2,-1.2,1.2]);
      const r = rng.uniform(0.3, 1.05);
      const axis = plane === "xy" ? "z" : "x";
      w.pushSpin(cx, cy, cz, axis, spinDur(rng, 6, 12), rng.chance(0.5));
      w.disk(0, 0, 0, r, plane, 48);
      w.disk(0, 0, 0, r * 0.55, plane, 48);
      w.spokes(0, 0, 0, r * 0.48, rng.randint(4, 8), plane);
      w.popSpin();
    }
    const nPipes = rng.randint(14, 24);
    const anchors = [];
    for (let i = 0; i < nPipes * 2; i++) {
      anchors.push(v3(rng.uniform(-2.5,2.5), rng.uniform(baseTop+0.5,4.0), rng.uniform(-1.5,1.5)));
    }
    for (let i = 0; i < nPipes; i++) w.pipe(anchors[i * 2], anchors[i * 2 + 1]);
    for (let i = 0; i < rng.randint(16, 28); i++) {
      w.box(rng.uniform(-2.6,2.6), rng.uniform(baseTop,3.8), rng.uniform(-1.6,1.6),
            rng.uniform(0.12,0.6), rng.uniform(0.08,0.42), rng.uniform(0.12,0.48));
    }
  }

  function buildGhostMachine(root, cx, cz) {
    const machine = new THREE.Group();
    machine.name = "ghost_dense_77823";
    machine.position.set(cx, 0, cz);
    root.add(machine);
    const builder = new WireBuilder(machine);
    drawMachine(builder, makeRng(SEED));
    return builder;
  }

  function buildRoomAt(group, cx, cz, name, doors) {
    const isCodeRoom = name === "room_a";
    const surfMat = new THREE.MeshBasicMaterial({ color: isCodeRoom ? 0x000000 : 0xffffff });
    const edgeMat = new THREE.LineBasicMaterial({ color: isCodeRoom ? 0xffffff : 0xc8c8c8 });
    const hw = ROOM.width / 2, hd = ROOM.depth / 2, h = ROOM.height, wt = 0.15;
    const yFloor = 0.04, yCeil = h - 0.03, inset = 0.01;
    const ix0 = cx - hw + wt / 2 + inset, ix1 = cx + hw - wt / 2 - inset;
    const iz0 = cz - hd + wt / 2 + inset, iz1 = cz + hd - wt / 2 - inset;
    const yFloorEdge = yFloor + inset, yCeilEdge = yCeil - inset;
    const halfDoor = LAYOUT.doorwayWidth / 2, segD = hd - halfDoor;
    const room = new THREE.Group();
    room.name = name;
    group.add(room);
    function box(n, sx, sy, sz, x, y, z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), surfMat);
      mesh.name = n;
      mesh.position.set(x, y, z);
      room.add(mesh);
    }
    function edge(n, ax, ay, az, bx, by, bz) {
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([v3(ax, ay, az), v3(bx, by, bz)]),
        edgeMat
      );
      line.name = n;
      line.renderOrder = 1;
      room.add(line);
    }
    box(name + "_floor", ROOM.width, 0.08, ROOM.depth, cx, 0, cz);
    box(name + "_ceiling", ROOM.width, 0.06, ROOM.depth, cx, h, cz);
    box(name + "_wall_n", ROOM.width, h, wt, cx, h / 2, cz - hd);
    box(name + "_wall_s", ROOM.width, h, wt, cx, h / 2, cz + hd);
    function ew(side, hasDoor) {
      const x = cx + (side === "east" ? hw : -hw);
      const p = name + "_wall_" + side;
      if (!hasDoor) { box(p, wt, h, ROOM.depth, x, h / 2, cz); return; }
      box(p + "_s", wt, h, segD, x, h / 2, cz - halfDoor - segD / 2);
      box(p + "_n", wt, h, segD, x, h / 2, cz + halfDoor + segD / 2);
    }
    ew("west", doors.doorWest);
    ew("east", doors.doorEast);
    const cg = isCodeRoom ? 0.04 : 0;
    edge("floor_n", ix0 + cg, yFloorEdge, iz0, ix1 - cg, yFloorEdge, iz0);
    edge("floor_e", ix1, yFloorEdge, iz0 + cg, ix1, yFloorEdge, iz1 - cg);
    edge("floor_s", ix1 - cg, yFloorEdge, iz1, ix0 + cg, yFloorEdge, iz1);
    edge("floor_w", ix0, yFloorEdge, iz1 - cg, ix0, yFloorEdge, iz0 + cg);
    edge("ceil_n", ix0 + cg, yCeilEdge, iz0, ix1 - cg, yCeilEdge, iz0);
    edge("ceil_e", ix1, yCeilEdge, iz0 + cg, ix1, yCeilEdge, iz1 - cg);
    edge("ceil_s", ix1 - cg, yCeilEdge, iz1, ix0 + cg, yCeilEdge, iz1);
    edge("ceil_w", ix0, yCeilEdge, iz1 - cg, ix0, yCeilEdge, iz0 + cg);
    edge("corner_nw", ix0, yFloorEdge + cg, iz0, ix0, yCeilEdge - cg, iz0);
    edge("corner_ne", ix1, yFloorEdge + cg, iz0, ix1, yCeilEdge - cg, iz0);
    edge("corner_se", ix1, yFloorEdge + cg, iz1, ix1, yCeilEdge - cg, iz1);
    edge("corner_sw", ix0, yFloorEdge + cg, iz1, ix0, yCeilEdge - cg, iz1);
    if (name === "room_a") applyRoomAWallpaper(room, cx, cz, hw, hd, h, halfDoor, segD, wt);
  }

  function getWallpaperSource() {
    return [
      "// ghost_dense_77823 — generative machine (JavaScript only)",
      "// seed " + SEED,
      "",
      makeRng.toString(),
      "",
      cpts.toString(),
      "",
      WireBuilder.toString(),
      "",
      spinDur.toString(),
      "",
      drawMachine.toString(),
    ].join("\n");
  }

  function pickCodeColor(tok) {
    if (/^\/\//.test(tok)) return "#707070";
    if (/^(function|class|const|let|for|if|return|new|this|pushSpin|popSpin|drawMachine|WireBuilder)$/.test(tok)) {
      return "#74b4dc";
    }
    if (/^0x[0-9a-fA-F]+$/.test(tok) || /^[0-9.]+$/.test(tok) || tok === "SEED") return "#eca018";
    if (/^["'`]/.test(tok)) return "#eca018";
    return "#aaaaaa";
  }

  function drawCodeTokens(ctx, raw, x, y, fontPx) {
    const tokens = raw.match(/\s+|[^\s]+/g) || [];
    let cx = x;
    tokens.forEach(function (tok) {
      if (/^\s+$/.test(tok)) {
        cx += fontPx * 0.22 * tok.length;
        return;
      }
      ctx.fillStyle = pickCodeColor(tok);
      ctx.fillText(tok, cx, y);
      cx += ctx.measureText(tok).width + fontPx * 0.06;
    });
  }

  function rasterizeReadableCodeWallpaper() {
    const source = getWallpaperSource();
    const lines = source.split("\n");
    const W = 2048, H = 2048;
    const FOOT_PX = Math.round((0.3048 / ROOM.height) * H);
    const lineH = Math.round(FOOT_PX * 1.05);
    const pad = Math.round(FOOT_PX * 0.35);
    const maxW = W - pad * 2;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, W, H);
    ctx.font = FOOT_PX + 'px "IBM Plex Mono", Menlo, Consolas, monospace';
    ctx.textBaseline = "alphabetic";

    let y = pad + FOOT_PX;
    lines.forEach(function (raw) {
      let rest = raw;
      while (rest.length > 0 && y < H - pad) {
        let n = rest.length;
        while (n > 1 && ctx.measureText(rest.slice(0, n)).width > maxW) n--;
        drawCodeTokens(ctx, rest.slice(0, n), pad, y, FOOT_PX);
        rest = rest.slice(n);
        y += lineH;
      }
    });

    const tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    return tex;
  }

  let sharedCodeWallMat = null;

  function makeCodeWallMaterial() {
    if (!sharedCodeWallMat) {
      sharedCodeWallMat = new THREE.MeshBasicMaterial({
        map: rasterizeReadableCodeWallpaper(),
        side: THREE.FrontSide,
        depthWrite: true,
        polygonOffset: true,
        polygonOffsetFactor: -1,
      });
    }
    return sharedCodeWallMat;
  }

  function addCodeWallPlane(parent, mat, w, height, x, y, z, rotY, n) {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, height), mat);
    mesh.name = n;
    mesh.position.set(x, y, z);
    mesh.rotation.y = rotY;
    mesh.renderOrder = 2;
    parent.add(mesh);
  }

  function applyRoomAWallpaper(room, cx, cz, hw, hd, height, halfDoor, segD, wallT) {
    const yMid = height * 0.5, face = wallT / 2 + 0.002;
    const mat = makeCodeWallMaterial();
    addCodeWallPlane(room, mat, ROOM.width, height, cx, yMid, cz - hd + face, 0, "room_a_wp_n");
    addCodeWallPlane(room, mat, ROOM.width, height, cx, yMid, cz + hd - face, Math.PI, "room_a_wp_s");
    addCodeWallPlane(room, mat, ROOM.depth, height, cx - hw + face, yMid, cz, Math.PI / 2, "room_a_wp_w");
    addCodeWallPlane(room, mat, segD, height, cx + hw - face, yMid, cz - halfDoor - segD / 2, -Math.PI / 2, "room_a_wp_e_s");
    addCodeWallPlane(room, mat, segD, height, cx + hw - face, yMid, cz + halfDoor + segD / 2, -Math.PI / 2, "room_a_wp_e_n");
  }

  function buildHallwayAt(group, x0, x1, name, isCodeStyle) {
    const surfMat = new THREE.MeshBasicMaterial({ color: isCodeStyle ? 0x000000 : 0xffffff });
    const edgeMat = new THREE.LineBasicMaterial({ color: isCodeStyle ? 0xffffff : 0xc8c8c8 });
    const h = ROOM.height, wt = 0.15, hw = LAYOUT.hallwayWidth / 2;
    const len = x1 - x0, cx = (x0 + x1) / 2;
    const yFloor = 0.04, yCeil = h - 0.03, inset = 0.01;
    const ix0 = x0 + inset, ix1 = x1 - inset;
    const iz0 = -hw + wt / 2 + inset, iz1 = hw - wt / 2 - inset;
    const yFloorEdge = yFloor + inset, yCeilEdge = yCeil - inset;
    const cg = isCodeStyle ? 0.04 : 0;
    const hall = new THREE.Group();
    hall.name = name;
    group.add(hall);
    function box(n, sx, sy, sz, x, y, z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), surfMat);
      mesh.name = n;
      mesh.position.set(x, y, z);
      hall.add(mesh);
    }
    function edge(n, ax, ay, az, bx, by, bz) {
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([v3(ax, ay, az), v3(bx, by, bz)]),
        edgeMat
      );
      line.name = n;
      line.renderOrder = 1;
      hall.add(line);
    }
    box(name + "_floor", len, 0.08, LAYOUT.hallwayWidth, cx, 0, 0);
    box(name + "_ceiling", len, 0.06, LAYOUT.hallwayWidth, cx, h, 0);
    box(name + "_wall_n", len, h, wt, cx, h / 2, -hw);
    box(name + "_wall_s", len, h, wt, cx, h / 2, hw);
    edge("floor_n", ix0 + cg, yFloorEdge, iz0, ix1 - cg, yFloorEdge, iz0);
    edge("floor_e", ix1, yFloorEdge, iz0 + cg, ix1, yFloorEdge, iz1 - cg);
    edge("floor_s", ix1 - cg, yFloorEdge, iz1, ix0 + cg, yFloorEdge, iz1);
    edge("floor_w", ix0, yFloorEdge, iz1 - cg, ix0, yFloorEdge, iz0 + cg);
    edge("ceil_n", ix0 + cg, yCeilEdge, iz0, ix1 - cg, yCeilEdge, iz0);
    edge("ceil_e", ix1, yCeilEdge, iz0 + cg, ix1, yCeilEdge, iz1 - cg);
    edge("ceil_s", ix1 - cg, yCeilEdge, iz1, ix0 + cg, yCeilEdge, iz1);
    edge("ceil_w", ix0, yCeilEdge, iz1 - cg, ix0, yCeilEdge, iz0 + cg);
    edge("corner_nw", ix0, yFloorEdge + cg, iz0, ix0, yCeilEdge - cg, iz0);
    edge("corner_ne", ix1, yFloorEdge + cg, iz0, ix1, yCeilEdge - cg, iz0);
    edge("corner_se", ix1, yFloorEdge + cg, iz1, ix1, yCeilEdge - cg, iz1);
    edge("corner_sw", ix0, yFloorEdge + cg, iz1, ix0, yCeilEdge - cg, iz1);
    if (isCodeStyle) {
      const yMid = h * 0.5, face = wt / 2 + 0.002;
      const mat = makeCodeWallMaterial();
      addCodeWallPlane(hall, mat, len, h, cx, yMid, -hw + face, 0, name + "_wp_n");
      addCodeWallPlane(hall, mat, len, h, cx, yMid, hw - face, Math.PI, name + "_wp_s");
    }
  }

  function buildWhiteRoom(root) {
    const complex = new THREE.Group();
    complex.name = "white_room_complex";
    root.add(complex);
    buildRoomAt(complex, ROOM_A_X, 0, "room_a", { doorWest: false, doorEast: true });
    buildRoomAt(complex, 0, 0, "room_b", { doorWest: true, doorEast: true });
    buildRoomAt(complex, ROOM_C_X, 0, "room_c", { doorWest: true, doorEast: false });
    buildHallwayAt(complex, HALL_AB.x0, HALL_AB.x1, "hall_a_b", true);
    buildHallwayAt(complex, HALL_BC.x0, HALL_BC.x1, "hall_b_c", false);
  }

  function clampWalk(pos) {
    pos.x = THREE.Math.clamp(pos.x, BOUND_X_MIN, BOUND_X_MAX);
    const inHall = (pos.x >= HALL_AB.x0 && pos.x <= HALL_AB.x1) ||
      (pos.x >= HALL_BC.x0 && pos.x <= HALL_BC.x1);
    const zBound = inHall ? BOUND_HALL_Z : BOUND_ROOM_Z;
    pos.z = THREE.Math.clamp(pos.z, -zBound, zBound);
  }

  const prompt = document.getElementById("prompt");
  const modeEl = document.getElementById("mode");

  if (typeof THREE === "undefined" || typeof THREE.OrbitControls !== "function") {
    prompt.querySelector("div").innerHTML =
      "<p><em>Surrender Machines</em></p>" +
      "<p style='margin-top:0.75rem;font-size:14px;color:#662020'>Three.js failed to load. Check internet connection and reload.</p>";
    return;
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0xffffff, 1);
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.05, 200);

  const world = new THREE.Group();
  scene.add(world);
  buildWhiteRoom(world);
  const builder = buildGhostMachine(world, 0, 0);

  const SURRENDER_SCALE = (ROOM.height * 0.52) / 680;
  const ROOM_C_ZONE_X0 = ROOM_C_X - RW + 0.5;
  const ROOM_C_ZONE_X1 = ROOM_C_X + RW - 0.5;
  let surrenderActive = false;
  let surrenderEmbed = null;

  if (typeof createSurrenderMachineEmbed === "function") {
    surrenderEmbed = createSurrenderMachineEmbed({
      parent: world,
      x: ROOM_C_X,
      y: 0.04,
      z: 0,
      scale: SURRENDER_SCALE,
      flat: true,
      seed: 77823,
      sliders: { anger: 50, ego: 50, attachment: 50 },
    });
    surrenderEmbed.lights.forEach(function (l) { scene.add(l); });
  }

  const GHOST_SPIN_X0 = HALL_AB.x0 - 2;
  const GHOST_SPIN_X1 = HALL_BC.x0;
  let ghostSpinActive = false;

  const hudRoom = document.getElementById("hud-room");
  const hudSeed = document.getElementById("hud-seed");

  function updateHud(pos) {
    ghostSpinActive = pos.x >= GHOST_SPIN_X0 && pos.x <= GHOST_SPIN_X1;

    if (pos.x < HALL_AB.x1) {
      hudRoom.textContent = pos.x >= ROOM_A_X - RW ? "Room A · black · code mural" : "Approach · Room A";
      hudSeed.textContent = "ghost seed 77823 · room B ahead";
    } else if (pos.x < HALL_BC.x0) {
      hudRoom.textContent = pos.x < 0 ? "Hall A–B" : "Room B · ghost wireframe";
      hudSeed.textContent = "seed 77823";
    } else if (pos.x < ROOM_C_X + RW) {
      hudRoom.textContent = pos.x < HALL_BC.x1 ? "Hall B–C" : "Room C · surrender machine";
      hudSeed.textContent = surrenderEmbed
        ? "surrender · seed " + surrenderEmbed.state.seed
        : "surrender machine missing";
    } else {
      hudRoom.textContent = "Room C · surrender machine";
      hudSeed.textContent = surrenderEmbed
        ? "surrender · seed " + surrenderEmbed.state.seed
        : "surrender machine missing";
    }
    surrenderActive = pos.x >= ROOM_C_ZONE_X0 && pos.x <= ROOM_C_ZONE_X1;
  }

  const orbit = new THREE.OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true;
  orbit.enabled = false;

  const walk = new THREE.PointerLockControls(camera, renderer.domElement);
  orientSpawnEast();

  prompt.addEventListener("click", () => {
    prompt.classList.add("hidden");
    orbit.enabled = true;
    modeEl.textContent = "orbit — drag · WASD · F walk";
  });

  walk.addEventListener("lock", () => {
    orbit.enabled = false;
    modeEl.textContent = "walk — WASD · Shift run · Esc";
  });
  walk.addEventListener("unlock", () => {
    orbit.enabled = true;
    orientSpawnEast();
    modeEl.textContent = "orbit — drag · F walk";
  });

  window.addEventListener("keydown", (e) => {
    if (e.code === "KeyO") {
      walk.unlock();
      orbit.enabled = true;
      prompt.classList.add("hidden");
      modeEl.textContent = "orbit — drag · F walk";
    }
    if (e.code === "KeyF" && !walk.isLocked) {
      walk.lock().catch(() => {
        modeEl.textContent = "walk blocked — drag to look";
      });
    }
  });

  const keys = {};
  window.addEventListener("keydown", (e) => { keys[e.code] = true; });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });

  const clock = new THREE.Clock();
  function tick() {
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.05);

    if (ghostSpinActive) {
      builder.spinners.forEach((s) => {
        const d = s.speed * dt;
        if (s.axis === "x") s.pivot.rotation.x += d;
        else if (s.axis === "y") s.pivot.rotation.y += d;
        else s.pivot.rotation.z += d;
      });
    }

    if (surrenderEmbed) {
      surrenderEmbed.update(dt, surrenderActive);
    }

    const moving = keys.KeyW || keys.KeyS || keys.KeyA || keys.KeyD ||
      keys.ArrowUp || keys.ArrowDown || keys.ArrowLeft || keys.ArrowRight;

    if (walk.isLocked) {
      const vel = ((keys.ShiftLeft || keys.ShiftRight) ? 4 : 2) * dt;
      if (keys.KeyW || keys.ArrowUp) walk.moveForward(vel);
      if (keys.KeyS || keys.ArrowDown) walk.moveForward(-vel);
      if (keys.KeyA || keys.ArrowLeft) walk.moveRight(-vel);
      if (keys.KeyD || keys.ArrowRight) walk.moveRight(vel);
      camera.position.y = 1.62;
    } else if (orbit.enabled && moving) {
      const vel = ((keys.ShiftLeft || keys.ShiftRight) ? 4 : 2) * dt;
      const fwd = new THREE.Vector3();
      camera.getWorldDirection(fwd);
      fwd.y = 0;
      fwd.normalize();
      const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
      if (keys.KeyW || keys.ArrowUp) camera.position.addScaledVector(fwd, vel);
      if (keys.KeyS || keys.ArrowDown) camera.position.addScaledVector(fwd, -vel);
      if (keys.KeyA || keys.ArrowLeft) camera.position.addScaledVector(right, -vel);
      if (keys.KeyD || keys.ArrowRight) camera.position.addScaledVector(right, vel);
      camera.position.y = 1.62;
      orbit.target.copy(camera.position).add(fwd.multiplyScalar(2));
    } else if (orbit.enabled) {
      orbit.update();
    }

    clampWalk(camera.position);
    updateHud(camera.position);
    renderer.render(scene, camera);
  }
  tick();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  renderer.setSize(window.innerWidth, window.innerHeight);

  window.getWallpaperSource = getWallpaperSource;
})();
  </script>
</body>
