<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Column tiles — breathing fullscreen (p5.js)</title>
  <meta name="description" content="Generative gradient columns, fullscreen — no frame, seedable breathing animation." />
  <link rel="canonical" href="https://mark-walhimer.com/sketches/column-tiles-breathing-fullscreen.html" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    #controlsToggle {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 20;
      width: 52px;
      height: 52px;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 0 0 0 8px;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, background 0.2s ease;
    }
    #controlsToggle:hover,
    #controlsToggle:focus-visible {
      opacity: 0.4;
      background: rgba(0, 0, 0, 0.06);
      outline: none;
    }
    body.controls-visible #controlsToggle {
      opacity: 0.25;
    }
    body.controls-visible #controlsToggle:hover,
    body.controls-visible #controlsToggle:focus-visible {
      opacity: 0.5;
    }
    #toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      padding: 10px 12px;
      font: 14px/1.4 system-ui, sans-serif;
      color: #333;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    body.controls-visible #toolbar {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    #toolbar label { display: inline-flex; align-items: center; gap: 6px; }
    #toolbar input[type="number"] {
      width: 7rem;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #toolbar select {
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    #toolbar button {
      padding: 8px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    #toolbar button:hover:not(:disabled) { background: #eee; }
    #toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { flex: 1 1 100%; text-align: center; min-height: 1.4em; color: #555; }
  </style>
  <style>
    #wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    #wrap canvas {
      display: block;
    }
    .seed-row { flex: 1 1 100%; justify-content: center; gap: 12px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script src="https://unpkg.com/gif.js@0.2.0/dist/gif.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <button type="button" id="controlsToggle" aria-label="Toggle controls" aria-pressed="false" title="Toggle controls (top-right)"></button>
  <div id="toolbar">
    <div class="seed-row" style="display:flex;flex-wrap:wrap;align-items:center;">
      <label>Art seed <input type="number" id="seedInput" min="0" step="1" title="Deterministic randomness for tile colors" /></label>
      <button type="button" id="btnRandomSeed" title="Pick a new random seed">Random seed</button>
      <button type="button" id="btnApplySeed" title="Rebuild preview with the seed above">Apply seed</button>
      <label>Batch count <input type="number" id="batchCount" min="1" max="500" value="10" /></label>
      <button type="button" id="btnZipPng" title="ZIP of PNGs: baseSeed, baseSeed+1, ... at export pixel density">Download ZIP (PNGs)</button>
      <button type="button" id="btnZipWebm" title="ZIP of short WebMs, one per seed — high resolution and capture FPS">Download ZIP (WebMs)</button>
    </div>
    <label>Video capture FPS
      <select id="captureFps" title="Browser may cap this (often 60). 120 needs a high refresh display.">
        <option value="60" selected>60</option>
        <option value="120">120</option>
      </select>
    </label>
    <button type="button" id="btnVideo" title="WebM at selected FPS, high bitrate">Download WebM video</button>
    <button type="button" id="btnGif" title="GIF is capped at lower fps; file size grows quickly">Download GIF (12 fps)</button>
    <span id="status"></span>
  </div>
  <main id="wrap"></main>
  <script>
(function initControlsToggle() {
  const btn = document.getElementById('controlsToggle');
  const STORAGE_KEY = 'columnTilesFullscreenControls';
  function setVisible(on) {
    document.body.classList.toggle('controls-visible', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    try { localStorage.setItem(STORAGE_KEY, on ? '1' : '0'); } catch (_) {}
  }
  let visible = false;
  try { visible = localStorage.getItem(STORAGE_KEY) === '1'; } catch (_) {}
  setVisible(visible);
  btn.addEventListener('click', () => {
    setVisible(!document.body.classList.contains('controls-visible'));
  });
})();
  </script>
  <script>
// Configuration constants
/** Original 800×800 design — drawn in ref space, scaled to fit window */
const REF_SIZE = 800;
const COLUMN_COUNT = 3;
const TILE_COUNT = 3;
const GRADIENT_COUNT = 3;

const COLUMN_WIDTH = 200;
const COLUMN_HEIGHT = 700;
const COLUMN_SPACING = 200;
const COLUMN_START_X = 200;

const TILE_WIDTH = 178;
const TILE_HEIGHT = 233;

// Visual constants
const BLUR_AMOUNT = 10;
/** Blur capture width tracks tile width (was 100 @ 150px tile) */
const BLUR_CAPTURE_WIDTH = 118;
const BLUR_CAPTURE_OFFSET_X = BLUR_CAPTURE_WIDTH / 2;
/** Vertical fade inside each tile — slightly more transparent than original */
const ALPHA_MIN = 58;
const ALPHA_MAX = 94;
const BASE_ALPHA = 100;

// Color constants
const HUE_OPTIONS = [0, 30, 210]; // Red, yellow, blue
const SATURATION_MIN = 80;
const SATURATION_MAX = 100;
const BRIGHTNESS_MIN = 80;
const BRIGHTNESS_MAX = 100;

// Breathing constants
const BREATH_SPEED = 2;
const BREATH_INTENSITY = 125;
const BRIGHTEN_FACTOR = 0.18;

const DISPLAY_PIXEL_DENSITY = 1;
/** Batch / still PNG — 4× => 3200×3200 from 800 logical canvas */
const PNG_PIXEL_DENSITY = 4;
/** GIF: separate from PNG (gif.js struggles with huge frames); 2× = 1600×1600 */
const GIF_PIXEL_DENSITY = 2;
/** WebM — high-res motion (4× => 3200px backing for 800 logical). Lower if the tab slows. */
const VIDEO_PIXEL_DENSITY = 4;
/** Bits per second — high for large frames (adjust if files are huge) */
const VIDEO_BITS_PER_SECOND = 80_000_000;

const RECORD_SECONDS = 5;
const GIF_FPS = 12;
const GIF_SECONDS = 3;
/** Max clips per WebM ZIP (avoid multi-hour runs / RAM issues) */
const BATCH_WEBM_MAX = 30;

/** Still frame time (seconds) for PNG exports — breathing phase at this t */
const PNG_STILL_T = 0;

// State variables
let gradientCount = GRADIENT_COUNT;
let baseImage;
let brightImage;
let currentPixelDensity = DISPLAY_PIXEL_DENSITY;

/** Integer seed passed to randomSeed() for reproducible artwork */
let artSeed;

function fitCanvasSide() {
  return max(100, floor(min(windowWidth, windowHeight)));
}

function refScale() {
  return width / REF_SIZE;
}

function withRefCoords(fn) {
  push();
  scale(refScale());
  fn();
  pop();
}

function canvasExportLabel() {
  return width + 'x' + height;
}

function setup() {
  createCanvas(fitCanvasSide(), fitCanvasSide()).parent('wrap');
  artSeed = floor(random(1e9));
  syncSeedInput();
  applyPixelDensityAndRebuild(DISPLAY_PIXEL_DENSITY);

  document.getElementById('btnVideo').addEventListener('click', exportWebM);
  document.getElementById('btnGif').addEventListener('click', exportGif);
  document.getElementById('btnApplySeed').addEventListener('click', applySeedFromInput);
  document.getElementById('btnRandomSeed').addEventListener('click', randomizeSeed);
  document.getElementById('btnZipPng').addEventListener('click', exportBatchPngZip);
  document.getElementById('btnZipWebm').addEventListener('click', exportBatchWebmZip);
}

function windowResized() {
  const side = fitCanvasSide();
  resizeCanvas(side, side);
  applyPixelDensityAndRebuild(currentPixelDensity);
}

function getCaptureFps() {
  const sel = document.getElementById('captureFps');
  const v = sel ? parseInt(sel.value, 10) : 60;
  return Number.isFinite(v) && v > 0 ? v : 60;
}

function syncSeedInput() {
  const el = document.getElementById('seedInput');
  if (el) el.value = String(artSeed);
}

function readSeedFromInput() {
  const el = document.getElementById('seedInput');
  const v = parseInt(el && el.value, 10);
  if (!Number.isFinite(v) || v < 0) {
    setStatus('Enter a non-negative integer seed.');
    return null;
  }
  return v;
}

function applySeedFromInput() {
  const v = readSeedFromInput();
  if (v === null) return;
  artSeed = v;
  applyPixelDensityAndRebuild(DISPLAY_PIXEL_DENSITY);
  setStatus('Applied seed ' + artSeed + '.');
}

function randomizeSeed() {
  artSeed = floor(random(1e9));
  syncSeedInput();
  applyPixelDensityAndRebuild(DISPLAY_PIXEL_DENSITY);
  setStatus('New random seed: ' + artSeed + '.');
}

function applyPixelDensityAndRebuild(pd) {
  currentPixelDensity = pd;
  pixelDensity(pd);
  randomSeed(artSeed);
  colorMode(HSB, 360, 100, 100, 255);
  rectMode(CENTER);
  imageMode(CENTER);
  background(0, 0, 255);
  drawArtwork();
  baseImage = get(0, 0, width, height);
  brightImage = baseImage.get();
  brightenImage(brightImage, BRIGHTEN_FACTOR);
}

function draw() {
  drawBreathingFrame(millis() * 0.001);
}

/**
 * @param {number} tSec - time in seconds (use wall clock for preview/video; fixed steps for GIF)
 */
function drawBreathingFrame(tSec) {
  let phase = (sin(tSec * TWO_PI * BREATH_SPEED) + 1) * 0.5;
  let overlayAlpha = phase * BREATH_INTENSITY;
  background(0, 0, 255);
  push();
  imageMode(CORNER);
  noTint();
  image(baseImage, 0, 0);
  tint(255, overlayAlpha);
  image(brightImage, 0, 0);
  pop();
}

function setStatus(msg) {
  const el = document.getElementById('status');
  if (el) el.textContent = msg || '';
}

function setBusy(busy) {
  ['btnVideo', 'btnGif', 'btnZipPng', 'btnZipWebm', 'btnApplySeed', 'btnRandomSeed', 'seedInput', 'batchCount', 'captureFps'].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.disabled = busy;
  });
}

function pickMediaRecorderMime() {
  const candidates = [
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  for (const c of candidates) {
    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(c)) {
      return c;
    }
  }
  return '';
}

/**
 * Records the current canvas animation to a WebM Blob (draw() must keep running).
 * @param {HTMLCanvasElement} canvasEl
 * @param {number} durationSec
 * @param {number} captureFps passed to captureStream()
 */
function recordCanvasToWebmBlob(canvasEl, durationSec, captureFps, mime) {
  return new Promise((resolve, reject) => {
    const stream = canvasEl.captureStream(captureFps);
    const rec = new MediaRecorder(stream, {
      mimeType: mime,
      videoBitsPerSecond: VIDEO_BITS_PER_SECOND
    });
    const chunks = [];
    rec.ondataavailable = (e) => {
      if (e.data && e.data.size) chunks.push(e.data);
    };
    rec.onstop = () => {
      resolve(new Blob(chunks, { type: mime }));
    };
    rec.onerror = (e) => reject(e);
    rec.start(100);
    setTimeout(() => {
      try {
        if (typeof rec.requestData === 'function') {
          rec.requestData();
        }
        rec.stop();
      } catch (err) {
        reject(err);
      }
    }, durationSec * 1000);
  });
}

function exportWebM() {
  if (typeof MediaRecorder === 'undefined') {
    setStatus('MediaRecorder not supported in this browser.');
    return;
  }
  const mime = pickMediaRecorderMime();
  if (!mime) {
    setStatus('No supported WebM codec found.');
    return;
  }

  const fps = getCaptureFps();
  setBusy(true);
  setStatus('Preparing high-DPI canvas...');

  frameRate(fps);
  applyPixelDensityAndRebuild(VIDEO_PIXEL_DENSITY);

  const canvasEl = document.querySelector('#wrap canvas');
  setStatus('Recording ' + RECORD_SECONDS + ' s at ~' + fps + ' fps capture...');

  recordCanvasToWebmBlob(canvasEl, RECORD_SECONDS, fps, mime)
    .then((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download =
        'column-tiles-fullscreen_seed-' +
        artSeed +
        '-' +
        canvasExportLabel() +
        '-' +
        VIDEO_PIXEL_DENSITY +
        'x-' +
        fps +
        'fps.webm';
      a.click();
      URL.revokeObjectURL(url);
      frameRate(60);
      applyPixelDensityAndRebuild(DISPLAY_PIXEL_DENSITY);
      setBusy(false);
      setStatus('Saved WebM.');
    })
    .catch((e) => {
      console.error(e);
      frameRate(60);
      applyPixelDensityAndRebuild(DISPLAY_PIXEL_DENSITY);
      setBusy(false);
      setStatus('Recording failed; see console.');
    });
}

async function exportBatchWebmZip() {
  if (typeof MediaRecorder === 'undefined') {
    setStatus('MediaRecorder not supported in this browser.');
    return;
  }
  if (typeof JSZip === 'undefined') {
    setStatus('JSZip failed to load.');
    return;
  }
  const mime = pickMediaRecorderMime();
  if (!mime) {
    setStatus('No supported WebM codec found.');
    return;
  }

  const base = readSeedFromInput();
  if (base === null) return;

  const countEl = document.getElementById('batchCount');
  const count = parseInt(countEl && countEl.value, 10);
  if (!Number.isFinite(count) || count < 1 || count > BATCH_WEBM_MAX) {
    setStatus('For WebM batch, count must be between 1 and ' + BATCH_WEBM_MAX + '.');
    return;
  }

  const fps = getCaptureFps();
  setBusy(true);
  frameRate(fps);

  const zip = new JSZip();
  const folder = zip.folder('column-tiles-fullscreen-webms');

  try {
    for (let i = 0; i < count; i++) {
      artSeed = base + i;
      syncSeedInput();
      setStatus(
        'Recording ' + (i + 1) + ' / ' + count + ' (seed ' + artSeed + ', ~' + fps + ' fps)...'
      );

      applyPixelDensityAndRebuild(VIDEO_PIXEL_DENSITY);

      const canvasEl = document.querySelector('#wrap canvas');
      const blob = await recordCanvasToWebmBlob(canvasEl, RECORD_SECONDS, fps, mime);

      const name =
        'column-tiles-fullscreen_seed-' +
        artSeed +
        '-' +
        canvasExportLabel() +
        '-' +
        VIDEO_PIXEL_DENSITY +
        'x-' +
        fps +
        'fps.webm';
      folder.file(name, blob);
    }

    setStatus('Building ZIP (' + count + ' WebMs)...');
    const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });

    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'column-tiles-fullscreen_webm_batch-base-' + base + '-n' + count + '-' + fps + 'fps.zip';
    a.click();
    URL.revokeObjectURL(url);

    artSeed = base;
    syncSeedInput();
    frameRate(60);
    applyPixelDensityAndRebuild(DISPLAY_PIXEL_DENSITY);
    setStatus('Saved ZIP with ' + count + ' WebMs.');
  } catch (err) {
    console.error(err);
    artSeed = base;
    syncSeedInput();
    frameRate(60);
    applyPixelDensityAndRebuild(DISPLAY_PIXEL_DENSITY);
    setStatus('Batch WebM failed: ' + (err && err.message ? err.message : err));
  } finally {
    setBusy(false);
  }
}

async function exportGif() {
  if (typeof GIF === 'undefined') {
    setStatus('gif.js failed to load.');
    return;
  }

  setBusy(true);
  setStatus('Rendering GIF frames...');

  try {
    applyPixelDensityAndRebuild(GIF_PIXEL_DENSITY);

    const canvasEl = document.querySelector('#wrap canvas');
    const w = canvasEl.width;
    const h = canvasEl.height;
    const frameDelay = Math.round(1000 / GIF_FPS);
    const totalFrames = Math.ceil(GIF_SECONDS * GIF_FPS);

    const gif = new GIF({
      workers: 2,
      quality: 12,
      width: w,
      height: h,
      workerScript: 'https://unpkg.com/gif.js@0.2.0/dist/gif.worker.js'
    });

    gif.on('finished', function (blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download =
        'column-tiles-fullscreen_seed-' + artSeed + '-' + canvasExportLabel() + '-' + GIF_PIXEL_DENSITY + 'x.gif';
      a.click();
      URL.revokeObjectURL(url);
      applyPixelDensityAndRebuild(DISPLAY_PIXEL_DENSITY);
      setBusy(false);
      setStatus('Saved GIF.');
    });

    for (let i = 0; i < totalFrames; i++) {
      drawBreathingFrame(i / GIF_FPS);
      await new Promise((r) => requestAnimationFrame(r));
      gif.addFrame(canvasEl, { copy: true, delay: frameDelay });
      if (i % 3 === 0 || i === totalFrames - 1) {
        setStatus('GIF frame ' + (i + 1) + ' / ' + totalFrames + '...');
      }
    }

    setStatus('Encoding GIF (may take a moment)...');
    await new Promise((r) => setTimeout(r, 0));
    gif.render();
  } catch (err) {
    console.error(err);
    applyPixelDensityAndRebuild(DISPLAY_PIXEL_DENSITY);
    setBusy(false);
    setStatus('GIF export failed: ' + (err && err.message ? err.message : err));
  }
}

async function exportBatchPngZip() {
  if (typeof JSZip === 'undefined') {
    setStatus('JSZip failed to load.');
    return;
  }
  const base = readSeedFromInput();
  if (base === null) return;

  const countEl = document.getElementById('batchCount');
  const count = parseInt(countEl && countEl.value, 10);
  if (!Number.isFinite(count) || count < 1 || count > 500) {
    setStatus('Batch count must be between 1 and 500.');
    return;
  }

  setBusy(true);
  noLoop();

  const zip = new JSZip();
  const folder = zip.folder('column-tiles-fullscreen-pngs');

  try {
    for (let i = 0; i < count; i++) {
      artSeed = base + i;
      syncSeedInput();
      setStatus('Rendering ' + (i + 1) + ' / ' + count + ' (seed ' + artSeed + ')...');

      applyPixelDensityAndRebuild(PNG_PIXEL_DENSITY);
      drawBreathingFrame(PNG_STILL_T);

      const canvasEl = document.querySelector('#wrap canvas');
      const blob = await new Promise((resolve, reject) => {
        canvasEl.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/png');
      });

      const name = 'column-tiles-fullscreen_seed-' + artSeed + '-' + canvasExportLabel() + '-' + PNG_PIXEL_DENSITY + 'x.png';
      folder.file(name, blob);
    }

    setStatus('Building ZIP...');
    const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'column-tiles-fullscreen_batch-base-' + base + '-n' + count + '.zip';
    a.click();
    URL.revokeObjectURL(url);

    artSeed = base;
    syncSeedInput();
    applyPixelDensityAndRebuild(DISPLAY_PIXEL_DENSITY);
    setStatus('Saved ZIP with ' + count + ' PNGs.');
  } catch (err) {
    console.error(err);
    artSeed = base;
    syncSeedInput();
    applyPixelDensityAndRebuild(DISPLAY_PIXEL_DENSITY);
    setStatus('Batch export failed: ' + (err && err.message ? err.message : err));
  } finally {
    loop();
    setBusy(false);
  }
}

function drawArtwork() {
  withRefCoords(drawColumns);
  applyBlurEffect();
}

function drawColumns() {
  const centerY = REF_SIZE / 2;

  for (let i = 0; i < COLUMN_COUNT; i++) {
    const x = COLUMN_START_X + COLUMN_SPACING * i;

    noStroke();
    fill(0, 0, 0, 0);
    rect(x, centerY, COLUMN_WIDTH, COLUMN_HEIGHT);

    drawTilesInColumn(x, centerY);
  }
}

function drawTilesInColumn(x, centerY) {
  const columnTop = centerY - COLUMN_HEIGHT / 2;
  const columnBottom = centerY + COLUMN_HEIGHT / 2;
  const firstTileCenterY = columnTop + TILE_HEIGHT / 2;
  const lastTileCenterY = columnBottom - TILE_HEIGHT / 2;

  for (let j = 0; j < TILE_COUNT; j++) {
    let tileY;
    if (TILE_COUNT === 1) {
      tileY = (firstTileCenterY + lastTileCenterY) / 2;
    } else {
      tileY = map(j, 0, TILE_COUNT - 1, firstTileCenterY, lastTileCenterY);
    }
    const colors = getRandomColors(gradientCount);
    drawGradientTile(x, tileY, colors);
  }
}

function drawGradientTile(x, y, colors) {
  const cnv = createGraphics(TILE_WIDTH, TILE_HEIGHT);
  // Main canvas may use pixelDensity 2–4 for exports; tile buffers must stay 1:1 logical px
  // or loadPixels/image() mismatch squishes tiles into thin strips.
  cnv.pixelDensity(1);
  cnv.colorMode(HSB, 360, 100, 100, 255);
  cnv.noStroke();
  cnv.loadPixels();

  for (let i = 0; i < cnv.width; i++) {
    for (let j = 0; j < cnv.height; j++) {
      const index = (i + j * cnv.width) * 4;
      const colorValue = interpolateColors(colors, i, cnv.width);
      const alpha = map(j, 0, max(1, cnv.height - 1), ALPHA_MIN, ALPHA_MAX);

      const r = red(colorValue);
      const g = green(colorValue);
      const b = blue(colorValue);

      cnv.pixels[index] = r;
      cnv.pixels[index + 1] = g;
      cnv.pixels[index + 2] = b;
      cnv.pixels[index + 3] = alpha;
    }
  }

  cnv.updatePixels();
  image(cnv, x, y);
}

function interpolateColors(colors, x, width) {
  const segmentLength = width / (colors.length - 1);
  const segmentIndex = floor(x / segmentLength);
  const startColor = colors[segmentIndex];
  const endColor = colors[segmentIndex + 1];
  const t = (x % segmentLength) / segmentLength;

  return lerpColor(startColor, endColor, t);
}

function getRandomColors(count) {
  return Array.from({ length: count }, () => {
    const hue = random(HUE_OPTIONS);
    const saturation = random(SATURATION_MIN, SATURATION_MAX);
    const brightness = random(BRIGHTNESS_MIN, BRIGHTNESS_MAX);
    return color(hue, saturation, brightness, BASE_ALPHA);
  });
}

function applyBlurEffect() {
  const s = refScale();
  const centerY = (REF_SIZE / 2) * s;
  const blurWidth = BLUR_CAPTURE_WIDTH * s;
  const blurOffsetX = BLUR_CAPTURE_OFFSET_X * s;
  const blurOffsetY = 350 * s;
  const columnHeight = COLUMN_HEIGHT * s;

  for (let i = 0; i < COLUMN_COUNT; i++) {
    const x = (COLUMN_START_X + COLUMN_SPACING * i) * s;
    const img = get(
      x - blurOffsetX,
      centerY - blurOffsetY,
      blurWidth,
      columnHeight
    );
    img.filter(BLUR, BLUR_AMOUNT);
    image(img, x, centerY);
  }
}

function brightenImage(img, factor) {
  img.loadPixels();
  for (let i = 0; i < img.pixels.length; i += 4) {
    let r = img.pixels[i];
    let g = img.pixels[i + 1];
    let b = img.pixels[i + 2];
    let a = img.pixels[i + 3];

    r = lerp(r, 255, factor);
    g = lerp(g, 255, factor);
    b = lerp(b, 255, factor);

    img.pixels[i] = r;
    img.pixels[i + 1] = g;
    img.pixels[i + 2] = b;
    img.pixels[i + 3] = a;
  }
  img.updatePixels();
}
