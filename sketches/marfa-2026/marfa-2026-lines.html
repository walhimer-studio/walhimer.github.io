<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marfa 2026 — pen lines</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e8e8e8; }
    canvas { display: block; width: 100%; height: 100%; }
    #hint {
      position: fixed; left: 10px; top: 10px; z-index: 2;
      font: 12px/1.4 ui-monospace, monospace;
      color: rgba(40, 40, 40, 0.75);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint"></div>
  <canvas id="card"></canvas>
  <script>
/**
 * Marfa 2026 — pen lines. One still per seed.
 * The swirl is the raster turn, frozen: vertical, horizontal,
 * vertical down, horizontal right. Neighboring lines are one
 * step out of phase, so the corners lock into the whirl.
 * N picks a new seed and writes ?format=square&seconds=60&seed=
 */
const { floor, min, max, ceil } = Math;

const FIELD_W = 256;
const FIELD_H = 384;
const INCH_W = 4;
const INCH_H = 6;
const INK = '#0044ff';
const ART = { x: 10, y: 12, w: 236, h: 236 };
const CARD_NAME = 'Mark Walhimer';
const CARD_URL = 'https://mark-walhimer.com/marfa-2026';
const CARD_IG = 'https://www.instagram.com/markwalhimer/';
const CARD_LINES = [
  ['Mark Walhimer', 2.4],
  ['mark-walhimer.com', 1.85],
  ['/marfa-2026', 1.85],
  ['@markwalhimer', 1.85],
];

// vertical, horizontal, vertical down, horizontal right
const TURN = [[0, -1], [1, 0], [0, 1], [1, 0]];

const FONT = {
  ' ': ['00000', '00000', '00000', '00000', '00000', '00000', '00000'],
  M: ['10001', '11011', '10101', '10001', '10001', '10001', '10001'],
  W: ['10001', '10001', '10001', '10101', '10101', '11011', '10001'],
  a: ['00000', '00000', '01110', '00001', '01111', '10001', '01111'],
  c: ['00000', '00000', '01111', '10000', '10000', '10000', '01111'],
  e: ['00000', '00000', '01110', '10001', '11111', '10000', '01110'],
  f: ['00110', '01001', '01000', '11100', '01000', '01000', '01000'],
  g: ['00000', '01111', '10001', '10001', '01111', '00001', '01110'],
  h: ['10000', '10000', '10110', '11001', '10001', '10001', '10001'],
  i: ['00100', '00000', '01100', '00100', '00100', '00100', '01110'],
  k: ['10000', '10010', '10100', '11000', '10100', '10010', '10001'],
  l: ['01100', '00100', '00100', '00100', '00100', '00100', '01110'],
  m: ['00000', '00000', '11010', '10101', '10101', '10001', '10001'],
  n: ['00000', '00000', '10110', '11001', '10001', '10001', '10001'],
  o: ['00000', '00000', '01110', '10001', '10001', '10001', '01110'],
  p: ['00000', '01110', '10001', '10001', '11110', '10000', '10000'],
  r: ['00000', '00000', '10110', '11001', '10000', '10000', '10000'],
  s: ['00000', '00000', '01111', '10000', '01110', '00001', '11110'],
  t: ['01000', '01000', '11100', '01000', '01000', '01001', '00110'],
  w: ['00000', '00000', '10001', '10101', '10101', '10101', '01010'],
  ':': ['00000', '00100', '00100', '00000', '00100', '00100', '00000'],
  '/': ['00001', '00010', '00100', '00100', '00100', '01000', '10000'],
  '@': ['01110', '10001', '10111', '10101', '10111', '10000', '01110'],
  '.': ['00000', '00000', '00000', '00000', '00000', '01100', '01100'],
  '-': ['00000', '00000', '00000', '01110', '00000', '00000', '00000'],
  d: ['00001', '00001', '01111', '10001', '10001', '10001', '01111'],
  '0': ['01110', '10001', '10011', '10101', '11001', '10001', '01110'],
  '1': ['00100', '01100', '00100', '00100', '00100', '00100', '01110'],
  '2': ['01110', '10001', '00001', '00110', '01000', '10000', '11111'],
  '3': ['01110', '10001', '00001', '00110', '00001', '10001', '01110'],
  '4': ['00010', '00110', '01010', '10010', '11111', '00010', '00010'],
  '5': ['11111', '10000', '11110', '00001', '00001', '10001', '01110'],
  '6': ['01110', '10000', '10000', '11110', '10001', '10001', '01110'],
  '7': ['11111', '00001', '00010', '00100', '01000', '01000', '01000'],
  '8': ['01110', '10001', '10001', '01110', '10001', '10001', '01110'],
  '9': ['01110', '10001', '10001', '01111', '00001', '10001', '01110'],
};

const seedFromUrl = () => {
  const raw = new URLSearchParams(location.search).get('seed');
  const n = raw == null || raw === '' ? 1 : Number(raw);
  if (!Number.isFinite(n)) return 1;
  return (n >>> 0) % 1000000000;
};

const seedLabel = (seed) => String(seed).padStart(9, '0');

const cardFromUrl = () => {
  const raw = new URLSearchParams(location.search).get('card');
  const n = raw == null || raw === '' ? 1 : Number(raw);
  if (!Number.isFinite(n)) return 1;
  return min(100, max(1, floor(n)));
};

const setSeedUrl = (seed, card) => {
  const url = new URL(location.href);
  url.search = `?format=square&seconds=60&seed=${seed >>> 0}&card=${card}`;
  history.replaceState(null, '', url.toString());
};

const mulberry32 = (seed) => {
  let a = seed >>> 0;
  return () => {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

const clamp = (v, lo, hi) => min(hi, max(lo, v));

const clipPoly = (pts, box) => {
  const L = box.x;
  const T = box.y;
  const R = box.x + box.w;
  const B = box.y + box.h;
  const inside = (p) => p[0] >= L && p[0] <= R && p[1] >= T && p[1] <= B;
  const cut = (a, b) => {
    const vertical = a[0] === b[0];
    if (vertical) {
      if (a[0] < L || a[0] > R) return null;
      const y0 = clamp(a[1], T, B);
      const y1 = clamp(b[1], T, B);
      if (y0 === y1) return null;
      return [[a[0], y0], [a[0], y1]];
    }
    if (a[1] < T || a[1] > B) return null;
    const x0 = clamp(a[0], L, R);
    const x1 = clamp(b[0], L, R);
    if (x0 === x1) return null;
    return [[x0, a[1]], [x1, a[1]]];
  };
  const paths = [];
  let cur = [];
  const flush = () => {
    if (cur.length > 1) paths.push(cur);
    cur = [];
  };
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i];
    const b = pts[i + 1];
    if (inside(a) && inside(b)) {
      if (!cur.length) cur.push(a);
      cur.push(b);
      continue;
    }
    const seg = cut(a, b);
    if (!seg) {
      flush();
      continue;
    }
    if (!cur.length) cur.push(seg[0]);
    else {
      const last = cur[cur.length - 1];
      if (last[0] !== seg[0][0] || last[1] !== seg[0][1]) {
        flush();
        cur.push(seg[0]);
      }
    }
    cur.push(seg[1]);
    if (!inside(b)) flush();
  }
  flush();
  return paths;
};

const along = (dist, seg) => {
  let d = dist;
  let x = 0;
  let y = 0;
  let n = 0;
  while (d > 0.01 && n < 64) {
    const [dx, dy] = TURN[n % 4];
    const step = min(seg, d);
    x += dx * step;
    y += dy * step;
    d -= step;
    n += 1;
  }
  return [x, y];
};

const swirl = (x0, y0, count, gap, seg, steps) => {
  const lines = [];
  const span = steps * seg;
  for (let i = 0; i < count; i++) {
    const phase = i * gap;
    const pts = [along(phase, seg)];
    const firstCorner = ceil(phase / seg) * seg;
    for (let d = firstCorner; d < phase + span; d += seg) pts.push(along(d, seg));
    pts.push(along(phase + span, seg));
    lines.push(pts.map(([x, y]) => [x0 + x, y0 + y + i * gap]));
  }
  return lines;
};

const hatch = (x, y, w, h, gap, vertical) => {
  const lines = [];
  if (vertical) {
    for (let px = x; px <= x + w; px += gap) lines.push([[px, y], [px, y + h]]);
  } else {
    for (let py = y; py <= y + h; py += gap) lines.push([[x, py], [x + w, py]]);
  }
  return lines;
};

const textWidth = (text, s) => text.length * 6 * s;

const fontPaths = (text, y, s, align) => {
  const paths = [];
  const ink = (text.length - 1) * 6 * s + 5 * s;
  const x0 = align === 'right'
    ? ART.x + ART.w - ink
    : align === 'left'
      ? ART.x
      : (FIELD_W - textWidth(text, s)) / 2;
  let x = x0;
  for (const ch of text) {
    const rows = FONT[ch] || FONT[' '];
    const h = rows.length;
    const w = rows[0].length;
    for (let ry = 0; ry < h; ry++) {
      let run = -1;
      for (let rx = 0; rx <= w; rx++) {
        const on = rx < w && rows[ry][rx] === '1';
        if (on && run < 0) run = rx;
        if (!on && run >= 0) {
          paths.push({
            closed: false,
            kind: 'letter',
            weight: s * 0.92,
            pts: [
              [x + run * s, y + (ry + 0.5) * s],
              [x + rx * s, y + (ry + 0.5) * s],
            ],
          });
          run = -1;
        }
      }
    }
    for (let rx = 0; rx < w; rx++) {
      let run = -1;
      for (let ry = 0; ry <= h; ry++) {
        const on = ry < h && rows[ry][rx] === '1';
        if (on && run < 0) run = ry;
        if (!on && run >= 0) {
          paths.push({
            closed: false,
            kind: 'letter',
            weight: s * 0.92,
            pts: [
              [x + (rx + 0.5) * s, y + run * s],
              [x + (rx + 0.5) * s, y + ry * s],
            ],
          });
          run = -1;
        }
      }
    }
    x += 6 * s;
  }
  return paths;
};

const build = (seed, card) => {
  const rnd = mulberry32(seed);
  const art = [];
  const bands = 2;
  for (let b = 0; b < bands; b++) {
    const gap = 4;
    const seg = 32 + floor(rnd() * 16);
    const count = 16 + floor(rnd() * 6);
    const steps = 12;
    const x0 = ART.x + floor(rnd() * 28);
    const y0 = ART.y + 64 + floor(rnd() * 36);
    for (const pts of swirl(x0, y0, count, gap, seg, steps)) {
      for (const part of clipPoly(pts, ART)) {
        art.push({ closed: false, pts: part });
      }
    }
  }
  if (rnd() < 0.75) {
    const vertical = rnd() < 0.5;
    const gap = 4 + floor(rnd() * 2);
    const x = ART.x + floor(rnd() * (ART.w * 0.4));
    const y = ART.y + floor(rnd() * (ART.h * 0.3));
    const w = 48 + floor(rnd() * 70);
    const h = 36 + floor(rnd() * 50);
    for (const pts of hatch(x, y, w, h, gap, vertical)) {
      for (const part of clipPoly(pts, ART)) {
        art.push({ closed: false, pts: part });
      }
    }
  }

  const letters = [];
  art.unshift({
    closed: true,
    pts: [
      [ART.x, ART.y],
      [ART.x + ART.w, ART.y],
      [ART.x + ART.w, ART.y + ART.h],
      [ART.x, ART.y + ART.h],
    ],
  });
  const SEED_S = 1;
  const LINE_GAP = 5;
  const SEED_GAP = 18;
  const BOTTOM = 16;
  const lines = [
    [`seed ${seedLabel(seed)} - ${card}/100`, SEED_S, 'left'],
    ...CARD_LINES.map(([text, s]) => [text, s, 'center']),
  ];
  let block = 0;
  lines.forEach(([, s], i) => {
    block += 7 * s;
    if (i === 0) block += SEED_GAP;
    else if (i < lines.length - 1) block += LINE_GAP;
  });
  let y = FIELD_H - BOTTOM - block;
  lines.forEach(([text, s, align], i) => {
    letters.push(...fontPaths(text, y, s, align));
    y += 7 * s + (i === 0 ? SEED_GAP : LINE_GAP);
  });
  return { art, letters };
};

let cached = null;
let cachedSeed = null;

const draw = () => {
  const seed = seedFromUrl();
  const card = cardFromUrl();
  const key = `${seed}:${card}`;
  if (cachedSeed !== key) {
    cached = build(seed, card);
    cachedSeed = key;
  }
  const { art, letters } = cached;
  const canvas = document.getElementById('card');
  const ctx = canvas.getContext('2d');
  const dpr = min(2, window.devicePixelRatio || 1);
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  canvas.width = floor(vw * dpr);
  canvas.height = floor(vh * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#e8e8e8';
  ctx.fillRect(0, 0, vw, vh);

  const margin = 28;
  const scale = min((vw - margin * 2) / FIELD_W, (vh - margin * 2) / FIELD_H);
  const ox = (vw - FIELD_W * scale) / 2;
  const oy = (vh - FIELD_H * scale) / 2;

  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, FIELD_W, FIELD_H);
  ctx.strokeStyle = INK;
  ctx.lineJoin = 'miter';
  ctx.lineCap = 'square';
  ctx.lineWidth = 1.05;
  for (const path of art) {
    ctx.beginPath();
    ctx.moveTo(path.pts[0][0], path.pts[0][1]);
    for (let i = 1; i < path.pts.length; i++) ctx.lineTo(path.pts[i][0], path.pts[i][1]);
    if (path.closed) ctx.closePath();
    ctx.stroke();
  }
  for (const path of letters) {
    ctx.lineWidth = path.weight;
    ctx.beginPath();
    ctx.moveTo(path.pts[0][0], path.pts[0][1]);
    for (let i = 1; i < path.pts.length; i++) ctx.lineTo(path.pts[i][0], path.pts[i][1]);
    ctx.stroke();
  }
  ctx.restore();

  document.getElementById('hint').textContent =
    `Marfa 2026 · pen · N new seed · seed ${seedLabel(seed)} · ${card}/100 · still · 4×6`;

  window.PLOT = {
    seed,
    card,
    name: CARD_NAME,
    url: CARD_URL,
    instagram: CARD_IG,
    field: [FIELD_W, FIELD_H],
    inches: [INCH_W, INCH_H],
    art: [ART.x, ART.y, ART.w, ART.h],
    paths: art.concat(letters),
  };
};

draw();
window.addEventListener('resize', draw);
window.addEventListener('keydown', (e) => {
  if (e.key !== 'n' && e.key !== 'N' || e.repeat) return;
  cachedSeed = null;
  const card = cardFromUrl() >= 100 ? 1 : cardFromUrl() + 1;
  setSeedUrl(floor(Math.random() * 1000000000), card);
  draw();
});
  </script>
</body>
</html>
