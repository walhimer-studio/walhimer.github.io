/**

 * Invisible RGB motion map · seed · sonification · Machine DNA lifeline · ?seed=N · N rebirth.

const DEFAULT_SEED = 77823;
const LIFESPAN_MS = 480000;
const SURRENDER_MS = 4200;

const makeRng = (seed) => {
  let s = seed >>> 0;
  return {
    random() {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    uniform(a, b) { return a + this.random() * (b - a); },
    randint(a, b) { return a + Math.floor(this.random() * (b - a + 1)); },
    choice(arr) { return arr[this.randint(0, arr.length - 1)]; },
    chance(p) { return this.random() < p; },
  };
};

const parseInitialSeed = () => {
  try {
    const q = new URLSearchParams(location.search).get('seed');
    if (q != null && q !== '') {
      const n = Number(q) >>> 0;
      if (Number.isFinite(n)) return n;
    }
  } catch (_) {}
  return DEFAULT_SEED >>> 0;
};

const rgbToHsl = (r, g, b) => {
  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);
  const l = (max + min) * 0.5;
  if (max === min) return [0, 0, l];
  const d = max - min;
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h = 0;
  if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
  else if (max === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  return [h / 6, s, l];
};

const hslToRgb = (h, s, l) => {
  if (s === 0) return [l, l, l];
  const hue2rgb = (p, q, t) => {
    let tt = t;
    if (tt < 0) tt += 1;
    if (tt > 1) tt -= 1;
    if (tt < 1 / 6) return p + (q - p) * 6 * tt;
    if (tt < 1 / 2) return q;
    if (tt < 2 / 3) return p + (q - p) * (2 / 3 - tt) * 6;
    return p;
  };
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s;
  const p = 2 * l - q;
  return [hue2rgb(p, q, h + 1 / 3), hue2rgb(p, q, h), hue2rgb(p, q, h - 1 / 3)];
};

const hueRotateRgb = (rgb, deg) => {
  const [h, s, l] = rgbToHsl(rgb[0] / 255, rgb[1] / 255, rgb[2] / 255);
  const nh = (h + deg / 360 + 1) % 1;
  const ns = min(1, max(0.35, s * 1.05));
  return hslToRgb(nh, ns, min(0.92, max(0.38, l))).map((v) => floor(v * 255));
};

const shuffleInPlace = (arr, rng) => {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = rng.randint(0, i);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};

  const r = makeRng(seed);
  const r2 = makeRng(seed ^ 0x9e3779b9);
  const r3 = makeRng(seed ^ 0x517cc1b7);
  const hueShift = r.uniform(0, 360);
  const palette = {};
  for (const [k, v] of Object.entries(BASE_PAL)) {
    if (k === 'white') {
      palette[k] = v.slice();
      continue;
    }
    palette[k] = hueRotateRgb(v, hueShift + r2.uniform(-30, 30));
  }
  const fluoroKeys = Object.keys(BASE_PAL).filter((k) => k !== 'white');
  const spectrumKeys = shuffleInPlace(fluoroKeys.slice(), r3);
  const cell = r.choice([8, 16, 32]);
  return {
    seed: seed >>> 0,
    palette,
    spectrumKeys,
    canvas: {
      cell,
      grid: cell * r.choice([1, 2, 4]),
      depthSpawn: r.uniform(0.04, 0.22),

/** Fluoro monospace source layer — transparent bg, colored ink. */
const rasterizeCodeArtLayer = (size = 2048) => {
  const lines = ART_SOURCE_RAW.split('\n');
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, size, size);

  const fontSize = max(10, floor(size / 58));
  const lineH = floor(fontSize * 1.28);
  const pad = floor(fontSize * 0.5);
  const maxW = size - pad * 2;
  ctx.font = `${fontSize}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textBaseline = 'top';

  const inks = [
    PAL.pink, PAL.yellow, PAL.mint, PAL.orange, PAL.violet, PAL.skyBlue, PAL.magenta, PAL.blend,
  ];

  let y = pad;
  let lineIdx = 0;
  for (const raw of lines) {
    let rest = raw;
    while (rest.length > 0 && y < size - pad) {
      let n = rest.length;
      while (n > 1 && ctx.measureText(rest.slice(0, n)).width > maxW) n--;
      const line = rest.slice(0, n);
      const isComment = /^\s*(\/\/|\*)/.test(line);
      const ink = isComment ? PAL.skyBlue : inks[lineIdx % inks.length];
      ctx.fillStyle = `rgb(${ink[0]},${ink[1]},${ink[2]})`;
      ctx.fillText(line, pad, y);
      rest = rest.slice(n);
      y += lineH;
      lineIdx++;
    }
    if (y >= size - pad) break;
  }

  const imgData = ctx.getImageData(0, 0, size, size);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const a = max(d[i], d[i + 1], d[i + 2]);
    d[i + 3] = a > 12 ? 255 : 0;
  }
  ctx.putImageData(imgData, 0, 0);

  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.needsUpdate = true;
  return tex;
};

const rgb01 = (c) => [c[0] / 255, c[1] / 255, c[2] / 255];

const Canvas2d = () => {
  let ctx, width, height, scanners = [], layers = [], depthProbes = [];
  let profile = {
    cell: 16,
    grid: 32,
    depthSpawn: 0.09,
    scannerSpawn: 0.14,
    layerSpawn: 0.1,
    maxLayers: 4,
    depthCap: 0.35,
    capMul: 0.4,
  };

  const setProfile = (p) => { profile = { ...profile, ...p }; };

  const depthProbe = (x, y, size, life, b) => () => {
    ctx.fillStyle = `rgba(0,0,${b},1)`;
    ctx.fillRect(x, y, size, size);
    return --life > 0;
  };

  const greenLevel = (time, opt) => {
    if (!opt.auto) return [1, 2, 4][opt.mode] ?? 1;
    return [1, 2, 4][floor(time / 90000) % 3];
  };

  const scanner = (x, y, size, dir, speed, life, g) => {
    const d = [...dir];
    return () => {
      ctx.fillStyle = `rgba(0,${g},0,1)`;
      ctx.fillRect(x, y, size, size);
      x += d[0] * speed;
      y += d[1] * speed;
      if (d[0]) {
        if (x < 0 || x > width - size) {
          x = x < 0 ? 0 : width - size;
          y += size * d[0];
          d[0] *= -1;
        }
        if (y < -size || y >= height) life = 0;
      }
      if (d[1]) {
        if (y < 0 || y > height - size) {
          y = y < 0 ? 0 : height - size;
          x += size * d[1];
          d[1] *= -1;
        }
        if (x < -size || x >= width) life = 0;
      }
      return --life > 0;
    };
  };

  const layer = (x, y, w, h, grid, life, c) => {
    const pts = [[x, y]];
    let yp = y;
    let xp = x + w;
    const edgeX = () => {
      const s = 1 + floor(rnd() * 3);
      const xs = Array.from({ length: s }, () => floor(rnd() * (w - grid) / grid) * grid).sort((a, b) => a - b);
      for (let i = 0; i < s; i++) {
        pts.push([x + xs[i], yp]);
        yp += rnd() < 0.5 ? grid : -grid;
        pts.push([x + xs[i], yp]);
      }
    };
    const edgeY = (reverse) => {
      const s = 1 + floor(rnd() * 3);
      const ys = Array.from({ length: s }, () => floor(rnd() * (h - grid) / grid) * grid)
        .sort((a, b) => (reverse ? b - a : a - b));
      for (let i = 0; i < s; i++) {
        pts.push([xp, y + ys[i]]);
        xp += rnd() < 0.5 ? grid : -grid;
        pts.push([xp, y + ys[i]]);
      }
    };
    if (y !== 0) edgeX();
    pts.push([x + w, yp]);
    xp = x + w;
    if (x + w !== width) edgeY(false);
    pts.push([xp, y + h]);
    yp = y + h;
    if (y + h !== height) {
      const s = 1 + floor(rnd() * 3);
      const xs = Array.from({ length: s }, () => floor(rnd() * (w - grid) / grid) * grid).sort((a, b) => b - a);
      for (let i = 0; i < s; i++) {
        pts.push([x + xs[i], yp]);
        yp += rnd() < 0.5 ? grid : -grid;
        pts.push([x + xs[i], yp]);
      }
    }
    pts.push([x, yp]);
    xp = x;
    if (x !== 0) {
      edgeY(true);
      pts[0] = [xp, y];
    }
    return () => {
      ctx.fillStyle = `rgba(${c},0,0,1)`;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      ctx.fill();
      return --life > 0;
    };
  };

  const init = () => {
    ctx = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  };

  const setup = () => {
    width = floor(window.innerWidth);
    height = floor(window.innerHeight);
    ctx.canvas.width = width;
    ctx.canvas.height = height;
  };

  const draw = (time, options) => {
    ctx.clearRect(0, 0, width, height);
    ctx.globalCompositeOperation = 'source-over';
    scanners = scanners.filter((fn) => fn());
    ctx.globalCompositeOperation = 'lighter';
    layers = layers.filter((fn) => fn());
    depthProbes = depthProbes.filter((fn) => fn());

    const cell = profile.cell;
    const cap = floor(sqrt(floor(width / cell) * floor(height / cell)) * profile.capMul);

    if (depthProbes.length < cap * profile.depthCap && rnd() < profile.depthSpawn) {
      const x = floor(rnd() * floor((width - cell) / cell)) * cell;
      const y = floor(rnd() * floor((height - cell) / cell)) * cell;
      const b = pow(2, floor(rnd() * 4));
      depthProbes.push(depthProbe(x, y, cell, (10 + floor(rnd() * 18)) * 32, b));
    }

    if (scanners.length < cap && rnd() < profile.scannerSpawn) {
      const x = floor(rnd() * floor((width - cell) / cell)) * cell;
      const y = floor(rnd() * floor((height - cell) / cell)) * cell;
      const dir = rnd() < 0.5 ? [floor(rnd() * 2) * 2 - 1, 0] : [0, floor(rnd() * 2) * 2 - 1];
      const speed = pow(2, floor(rnd() * 2));
      const stride = pow(2, floor(rnd() * 2));
      const g = greenLevel(time, options);
      const n = dir[0]
        ? 1 + floor(rnd() * ((dir[0] < 0 ? y : height - y) / (cell * stride)))
        : 1 + floor(rnd() * ((dir[1] < 0 ? x : width - x) / (cell * stride)));
      const life = (14 + floor(rnd() * 20)) * 32;
      for (let i = 0; i < n; i++) {
        scanners.push(scanner(x + dir[1] * stride * cell * i, y + dir[0] * stride * cell * i, cell, dir, speed, life, g));
      }
    }

    const grid = profile.grid;
    if (layers.length < profile.maxLayers && rnd() < profile.layerSpawn) {
      const cols = floor(width / grid);
      const rows = floor(height / grid);
      const vert = rnd() < 0.5;
      const w = vert ? floor(cols * (0.2 + rnd() * 0.5)) * grid : width;
      const h = vert ? height : floor(rows * (0.2 + rnd() * 0.5)) * grid;
      let lx = rnd() < 0.5 ? 0 : width - w;
      let ly = rnd() < 0.5 ? 0 : height - h;
      if (rnd() < 0.3) {
        lx = floor(rnd() * floor((width - w) / grid)) * grid;
        ly = floor(rnd() * floor((height - h) / grid)) * grid;
      }
      layers.push(layer(lx, ly, w, h, grid, (8 + floor(rnd() * 16)) * 32, pow(2, floor(rnd() * 6))));
    }

    ctx.globalCompositeOperation = 'source-over';
    return ctx.getImageData(0, 0, width, height);
  };

  const reset = () => {
    scanners = [];
    layers = [];
    depthProbes = [];
  };

  return { init, setup, draw, reset, setProfile };
};

const SLICE_FRAG = [

  'uniform float uSlice;',

  '    if (mod(dr, 4.0) >= 2.0) oxy.x += 1.0 / dims.x;',
  '    if (mod(dr, 8.0) >= 4.0) oxy.y -= 1.0 / dims.y;',
  '    if (mod(dr, 16.0) >= 8.0) oxy.x -= 1.0 / dims.x;',
  '    if (mod(dr, 32.0) >= 16.0) oxy.y += 2.0 / dims.y;',
  '    if (mod(dr, 64.0) >= 32.0) oxy.x += 2.0 / dims.x;',
  '    if (mod(dr, 128.0) >= 64.0) oxy.y -= 2.0 / dims.y;',

  '    if (mod(db, 2.0) >= 1.0) oz += 1.0;',
  '    if (mod(db, 4.0) >= 2.0) oz -= 1.0;',
  '    if (mod(db, 8.0) >= 4.0) oz += 2.0;',
  '    if (mod(db, 16.0) >= 8.0) oz -= 2.0;',
  '    col = sampleVol(uv + oxy, oz);',
  '  }',
  '  if (doSpectrum == 1) {',
  '    if (mod(dg, 2.0) >= 1.0) {',

  '    }',
  '    vec2 cUv = fract(uv * 0.38);',
  '    vec4 code = texture2D(codeImg, cUv);',
  '    col = mix(col, code.rgb, code.a * codeVeil);',
  '    if (mod(dg, 4.0) >= 2.0) {',
  '      vec3 spec = mix(specA, specB, fract(time * 0.14));',
  '      col = mix(col, spec, specAlphaAB);',
  '    }',
  '    if (mod(dg, 8.0) >= 4.0) col = mix(col, specInk, specAlphaInk);',

  '}',
].join('\n');

const CUBE_FRAG = [
  'precision highp float;',
  'uniform sampler2D vol;',
  'uniform vec3 dims;',
  'uniform vec3 boxSize;',
  'varying vec3 vPos;',
  'varying vec3 vRayDir;',
  'vec2 atlasUV(vec2 uv, float z) { return vec2(uv.x, (z + uv.y) / dims.z); }',
  'vec3 sampleVol(vec3 p) {',
  '  vec3 q = clamp(p, 0.001, 0.999);',
  '  float z = q.z * (dims.z - 1.0);',
  '  return texture2D(vol, atlasUV(q.xy, z)).rgb;',
  '}',
  'void main() {',
  '  vec3 ro = vPos;',
  '  vec3 rd = normalize(vRayDir);',
  '  vec3 inv = 1.0 / max(abs(rd), 1e-4);',
  '  vec3 t0 = (-boxSize - ro) * inv;',
  '  vec3 t1 = ( boxSize - ro) * inv;',
  '  vec3 tmin = min(t0, t1);',
  '  vec3 tmax = max(t0, t1);',
  '  float ta = max(max(tmin.x, tmin.y), tmin.z);',
  '  float tb = min(min(tmax.x, tmax.y), tmax.z);',
  '  if (tb < max(ta, 0.0)) { gl_FragColor = vec4(1.0); return; }',
  '  float tStart = max(ta, 0.0);',
  '  vec3 col = vec3(1.0);',
  '  for (float i = 0.0; i < 48.0; i++) {',
  '    float t = tStart + (tb - tStart) * (i + 0.5) / 48.0;',
  '    vec3 p = (ro + rd * t) / (boxSize * 2.0) + 0.5;',
  '    if (any(lessThan(p, vec3(0.0))) || any(greaterThan(p, vec3(1.0)))) continue;',
  '    vec3 s = sampleVol(p);',
  '    float ink = length(s - vec3(1.0));',
  '    float a = clamp(0.06 + ink * 0.55, 0.0, 0.92);',
  '    col = mix(col, s, a);',
  '  }',
  '  gl_FragColor = vec4(col, 1.0);',
  '}',
].join('\n');

const MotionSoundscape = () => {
  const MOTION_SAMPLE_MS = 48;
  let ctx, master, ready = false, on = false;
  let rGain, gGain, bGain, rOsc, rOsc2, gOsc, gOsc2, bOsc, rFilt, gFilt, bFilt;
  let clickGain, lastAt = 0;
  let recDest = null;
  const smooth = { r: 0, g: 0, b: 0 };

  const init = () => {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);

    const chain = (type, freq, filtType, filtFreq, filtQ) => {
      const osc = ctx.createOscillator();
      const filt = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      filt.type = filtType;
      filt.frequency.value = filtFreq;
      if (filtQ) filt.Q.value = filtQ;
      gain.gain.value = 0;
      osc.connect(filt);
      filt.connect(gain);
      gain.connect(master);
      osc.start();
      return { osc, filt, gain };
    };

    const ra = chain('sawtooth', 72, 'bandpass', 220, 1.2);
    const rb = chain('sawtooth', 74.5, 'bandpass', 220, 1.2);
    rOsc = ra.osc;
    rOsc2 = rb.osc;
    rGain = ra.gain;
    rFilt = ra.filt;
    rb.gain.gain.value = 0;
    rOsc2.disconnect();
    rOsc2.connect(rFilt);

    const ga = chain('sine', 330, 'bandpass', 900, 0.6);
    const gb = chain('sine', 337, 'bandpass', 900, 0.6);
    gOsc = ga.osc;
    gOsc2 = gb.osc;
    gGain = ga.gain;
    gFilt = ga.filt;
    gb.gain.gain.value = 0;
    gOsc2.disconnect();
    gOsc2.connect(gFilt);

    const ba = chain('triangle', 55, 'lowpass', 140);
    bOsc = ba.osc;
    bGain = ba.gain;
    bFilt = ba.filt;

    clickGain = ctx.createGain();
    clickGain.gain.value = 1;
    clickGain.connect(master);
    ready = true;
  };

  const resume = async () => {
    init();
    if (ctx.state === 'suspended') await ctx.resume();
  };

  const ensureOn = async () => {
    await resume();
    if (on) return true;
    on = true;
    master.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 0.08);
    return true;
  };

  const toggle = async () => {
    await resume();
    on = !on;
    master.gain.linearRampToValueAtTime(on ? 0.22 : 0, ctx.currentTime + 0.08);
    return on;
  };

  const motionEnergy = (pixels) => {
    const d = pixels.data;
    let r = 0, g = 0, b = 0, n = 0;
    const stride = 4 * 24;
    for (let i = 0; i < d.length; i += stride) {
      r += d[i];
      g += d[i + 1];
      b += d[i + 2];
      n++;
    }
    return { r: r / n / 255, g: g / n / 255, b: b / n / 255 };
  };

  const maybeClick = (rAmt) => {
    if (!on || rAmt < 0.04 || rnd() > rAmt * 0.35) return;
    const len = floor(ctx.sampleRate * 0.018);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (rnd() * 2 - 1) * pow(1 - i / len, 2.2);
    const src = ctx.createBufferSource();
    const env = ctx.createGain();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 160 + rAmt * 400;
    bp.Q.value = 2;
    src.buffer = buf;
    env.gain.value = 0.08 + rAmt * 0.2;
    src.connect(bp);
    bp.connect(env);
    env.connect(clickGain);
    src.start();
  };

  const update = (pixels, time) => {
    if (!ready || !on) return;
    if (time - lastAt < MOTION_SAMPLE_MS) return;
    lastAt = time;

    const raw = motionEnergy(pixels);
    const k = 0.18;
    smooth.r += (raw.r - smooth.r) * k;
    smooth.g += (raw.g - smooth.g) * k;
    smooth.b += (raw.b - smooth.b) * k;

    const t = ctx.currentTime;
    const ci = floor(time * 0.00035) % SPECTRUM.length;
    const spec = SPECTRUM[ci];
    const specHz = 220 + (spec[0] + spec[1] + spec[2]) / 765 * 280;

    rGain.gain.linearRampToValueAtTime(pow(smooth.r, 0.7) * 0.42, t + 0.05);
    rOsc.frequency.linearRampToValueAtTime(58 + smooth.r * 90, t + 0.05);
    rOsc2.frequency.linearRampToValueAtTime(60 + smooth.r * 92, t + 0.05);
    rFilt.frequency.linearRampToValueAtTime(140 + smooth.r * 520, t + 0.05);
    maybeClick(smooth.r);

    gGain.gain.linearRampToValueAtTime(pow(smooth.g, 0.65) * 0.38, t + 0.05);
    gOsc.frequency.linearRampToValueAtTime(specHz * (0.9 + smooth.g * 0.5), t + 0.05);
    gOsc2.frequency.linearRampToValueAtTime(specHz * (0.93 + smooth.g * 0.52), t + 0.05);
    gFilt.frequency.linearRampToValueAtTime(500 + smooth.g * 1800, t + 0.05);

    bGain.gain.linearRampToValueAtTime(pow(smooth.b, 0.75) * 0.45, t + 0.05);
    bOsc.frequency.linearRampToValueAtTime(38 + smooth.b * 110, t + 0.05);
    bFilt.frequency.linearRampToValueAtTime(90 + smooth.b * 220, t + 0.05);
  };

  const setMasterGain = (scale) => {
    if (!ready) return;
    master.gain.linearRampToValueAtTime(max(0, scale) * 0.22, ctx.currentTime + 0.06);
  };

  const getAudioStream = async () => {
    await ensureOn();
    if (!recDest) {
      recDest = ctx.createMediaStreamDestination();
      master.connect(recDest);
    }
    return recDest.stream;
  };

  return { resume, ensureOn, toggle, update, getAudioStream, setMasterGain, isOn: () => on };
};

const CanvasRecorder = (getCanvas, getAudioStream) => {
  let recorder = null;
  let chunks = [];
  let active = false;

  const pickMime = () => {
    const types = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4;codecs=avc1,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm',
    ];
    return types.find((t) => MediaRecorder.isTypeSupported(t)) || '';
  };

  const recExt = (mimeType) => (mimeType.startsWith('video/mp4') ? 'mp4' : 'webm');

  const setRecHint = (on) => {
    const hint = document.getElementById('hint');
    if (hint) hint.dataset.rec = on ? '1' : '';
  };

  const start = async () => {
    if (active) return false;
    const canvas = getCanvas();
    if (!canvas || !canvas.captureStream) return false;

    const mimeType = pickMime();
    if (!mimeType) {
      console.warn('MediaRecorder: no supported mp4/webm mime type');
      return false;
    }

    const videoStream = canvas.captureStream(60);
    const audioStream = await getAudioStream();
    const stream = new MediaStream([
      ...videoStream.getVideoTracks(),
      ...audioStream.getAudioTracks(),
    ]);

    chunks = [];
    recorder = new MediaRecorder(stream, {
      mimeType,
      videoBitsPerSecond: 16_000_000,
    });
    recorder.ondataavailable = (e) => {
      if (e.data.size) chunks.push(e.data);
    };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: mimeType.split(';')[0] });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      a.href = url;
      a.download = `invisible-layer-june-7-2026-vol3d-${ts}.${recExt(mimeType)}`;
      a.click();
      URL.revokeObjectURL(url);
      stream.getTracks().forEach((t) => t.stop());
      active = false;
      setRecHint(false);
    };

    recorder.start(1000);
    active = true;
    setRecHint(true);
    return true;
  };

  const stop = () => {
    if (!active || !recorder) return;
    if (recorder.state !== 'inactive') recorder.stop();
    recorder = null;
  };

  const toggle = async () => {
    if (active) {
      stop();
      return false;
    }
    return start();
  };

  return { toggle, isActive: () => active };
};


const VolRoomGPU = () => {
  let volDepth = 24;
  const MAX_ATLAS_H = 8192;
  const ROOM_SIZE = 156;

  let renderer, scene, camera, innerVol, cubeMat;
  let frontScene, frontCam, frontMat;
  let sliceScene, sliceCam, sliceMat, sliceRT;
  let volTex = [null, null], volId = 0;
  let imgTex, codeImgTex, motTex, motScratch;
  let codeWallMeshes = [];
  let artLayerGroup;
  let ART_LAYER_Z = 20;
  let width, height, depth, aspect;
  let bx = 1, by = 1, bz = 1;
  let viewRot = { x: 0, y: 0, drag: false, px: 0, py: 0 };
  const camPos = new THREE.Vector3();
  let camPosReady = false;
  let travelOn = true;
  let travelPhase = 0;
  let TRAVEL_RATE = 0.11;
  let travelFreq = { wx: 0.95, wy: 0.55, wz: 0.72, wz2: 1.6, look: 0.35 };
  let travelStyle = {
    orbitSign: 1,
    signX: 1,
    signY: 1,
    signZ: 1,
    yawSign: 1,
    modeFreq: 0.18,
    phases: { px: 0, py: 0, pz: 0, pl: 0, pOrbit: 0, pVert: 0, pDolly: 0, pLat: 0, pLook: 0 },
    weights: { orbit: 0.8, vertical: 0.5, dolly: 0.5, lateral: 0.4 },
  };
  let seedGpu = null;
  let codeWallScale = 1.55;
  const moveKeys = { forward: false, back: false, left: false, right: false };
  const MANUAL_SPEED = 34;
  const fwd = new THREE.Vector3();
  const right = new THREE.Vector3();

  const clampPos = () => {
    const m = 0.92;
    camPos.x = max(-bx * m * 1.25, min(bx * m * 1.25, camPos.x));
    camPos.y = max(-by * 0.25, min(by * m * 1.35, camPos.y));
    camPos.z = max(-bz * 2.5, min(bz * 2.5 + ART_LAYER_Z + 40, camPos.z));
  };

  const nudgeAlongView = (delta) => {
    const lookDir = new THREE.Vector3();
    camera.rotation.order = 'YXZ';
    camera.rotation.y = viewRot.x;
    camera.rotation.x = viewRot.y;
    camera.rotation.z = 0;
    camera.position.copy(camPos);
    camera.updateMatrixWorld();
    camera.getWorldDirection(lookDir);
    camPos.addScaledVector(lookDir, delta);
    clampPos();
  };

  const updateTravel = (timeMs, dragging) => {
    if (!travelOn) return;

    const dt = min(0.05, max(0.001, (timeMs - (updateTravel.lastMs || timeMs)) / 1000));
    updateTravel.lastMs = timeMs;
    travelPhase += dt * TRAVEL_RATE;

    const p = travelPhase;
    const f = travelFreq;
    const t = travelStyle;
    const dir = t.orbitSign;

    const wob = (base, phase, k) => base * (0.28 + 0.72 * (0.5 + 0.5 * sin(p * t.modeFreq * k + phase)));
    const wOrbit = wob(t.weights.orbit, t.phases.pOrbit, 1.0);
    const wVert = wob(t.weights.vertical, t.phases.pVert, 1.15);
    const wDolly = wob(t.weights.dolly, t.phases.pDolly, 0.82);
    const wLat = wob(t.weights.lateral, t.phases.pLat, 1.28);

    const orbitX = dir * cos(p * f.wx + t.phases.px) * bx * 0.58 * wOrbit;
    const orbitZ = dir * sin(p * f.wz + t.phases.pz) * bz * 0.92 * wOrbit;
    const latX = t.signX * sin(p * f.wz2 * 0.75 + t.phases.pl) * bx * 0.42 * wLat;
    const latSide = t.signX * cos(p * f.wx * 0.85 + t.phases.pl) * bx * 0.2 * wLat;
    const vertY = t.signY * sin(p * f.wy * 1.2 + t.phases.py) * by * 0.36 * wVert
      + t.signY * cos(p * f.wy * 0.48 + t.phases.py * 0.4) * by * 0.14 * wVert;
    const dollyZ = t.signZ * sin(p * f.wz2 * 1.15 + t.phases.pDolly) * (bz * 0.62 + 14) * wDolly;
    const dollyFwd = t.signZ * cos(p * f.wz2 * 0.55 + t.phases.pDolly) * 12 * wDolly;

    const nx = orbitX + latX + latSide;
    const ny = 4 + vertY;
    const nz = ART_LAYER_Z + orbitZ + dollyZ + dollyFwd;
    camPos.set(nx, ny, nz);

    if (dragging) return;

    const lookX = nx + t.yawSign * (
      dir * sin(p * f.wx + f.look + t.phases.pLook) * 10 * wOrbit
      + t.signX * cos(p * f.wz2 + t.phases.pl) * 7 * wLat
    );
    const lookY = ny + t.signY * sin(p * f.wy + f.look * 0.7 + t.phases.py) * 4.5 * wVert;
    const lookZ = nz + dir * cos(p * f.wz + f.look + t.phases.pLook) * 8 * wOrbit
      + t.signZ * sin(p * f.wz2 + t.phases.pDolly) * 6 * wDolly;

    viewRot.x = atan2(lookX - nx, lookZ - nz);
    viewRot.y = atan2(lookY - ny, sqrt(pow(lookX - nx, 2) + pow(lookZ - nz, 2)));
    viewRot.y = max(-0.62, min(0.62, viewRot.y));
  };

  const anyMoveKey = () => moveKeys.forward || moveKeys.back || moveKeys.left || moveKeys.right;

  const applyManualMove = (timeMs) => {
    if (!anyMoveKey()) return false;

    const dt = min(0.05, max(0.001, (timeMs - (applyManualMove.lastMs || timeMs)) / 1000));
    applyManualMove.lastMs = timeMs;

    camera.rotation.order = 'YXZ';
    camera.rotation.y = viewRot.x;
    camera.rotation.x = viewRot.y;
    camera.rotation.z = 0;
    camera.position.copy(camPos);
    camera.updateMatrixWorld();
    camera.getWorldDirection(fwd);
    right.setFromMatrixColumn(camera.matrixWorld, 0);

    let mv = 0;
    let strafe = 0;
    if (moveKeys.forward) mv += MANUAL_SPEED * dt;
    if (moveKeys.back) mv -= MANUAL_SPEED * dt;
    if (moveKeys.left) strafe -= MANUAL_SPEED * dt;
    if (moveKeys.right) strafe += MANUAL_SPEED * dt;

    camPos.addScaledVector(fwd, mv);
    camPos.addScaledVector(right, strafe);
    clampPos();
    return true;
  };

  const setMoveKey = (name, down) => {
    if (name in moveKeys) moveKeys[name] = down;
  };

  const volSize = () => {
    let w = floor(window.innerWidth);
    let h = floor(window.innerHeight);
    const maxH = floor(MAX_ATLAS_H / volDepth);
    if (h > maxH) {
      const s = maxH / h;
      h = maxH;
      w = max(64, floor(w * s));
    }
    return { w: max(64, w), h: max(64, h) };
  };

  const palette16 = () => {
    const a = new Uint8Array(16 * 16 * 4);
    for (let i = 0; i < 256; i++) {
      const x = i % 16;
      const y = floor(i / 16);
      const grid = x % 4 === 0 || y % 4 === 0;
      const c = grid ? SPECTRUM[((x >> 2) + (y >> 2) * 2) % SPECTRUM.length] : PAL.white;
      const veil = grid ? 0.12 + (((x >> 2) + (y >> 2)) % 5) * 0.07 : 0;
      a[i * 4] = c[0];
      a[i * 4 + 1] = c[1];
      a[i * 4 + 2] = c[2];
      a[i * 4 + 3] = floor(veil * 255);
    }
    return a;
  };

  const makeAtlas = (w, h, d) => {
    const data = new Uint8Array(w * h * d * 4);
    data.fill(255);
    const tex = new THREE.DataTexture(data, w, h * d, THREE.RGBAFormat, THREE.UnsignedByteType);
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.needsUpdate = true;
    return tex;
  };

  const makeDataTex = (w, h, data) => {
    const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.UnsignedByteType);
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.needsUpdate = true;
    return tex;
  };

  const makeFlatRT = (w, h) => new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter,
    depthBuffer: false,
    stencilBuffer: false,
  });

  const modeFlags = (mode) => {
    if (mode === 1) return { raster: 1, spectrum: 0 };
    if (mode === 2) return { raster: 0, spectrum: 1 };
    return { raster: 1, spectrum: 1 };
  };

  const setSliceUniforms = (mat, time, options) => {
    const { raster, spectrum } = modeFlags(options.mode);
    const ci = floor(time * 0.00035) % SPECTRUM.length;
    mat.uniforms.time.value = time * 0.001;
    mat.uniforms.doRaster.value = raster;
    mat.uniforms.doSpectrum.value = spectrum;
    mat.uniforms.specA.value.set(...rgb01(SPECTRUM[ci]));
    mat.uniforms.specB.value.set(...rgb01(SPECTRUM[(ci + 3) % SPECTRUM.length]));
    mat.uniforms.specInk.value.set(...rgb01(PAL.blend));
  };

  const bindOrbit = () => {
    const el = renderer.domElement;
    el.addEventListener('pointerdown', (e) => {
      el.focus({ preventScroll: true });
      viewRot.drag = true;
      viewRot.px = e.clientX;
      viewRot.py = e.clientY;
      snd.ensureOn();
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      if (!viewRot.drag) return;
      viewRot.x += (e.clientX - viewRot.px) * 0.005;
      viewRot.y += (e.clientY - viewRot.py) * 0.005;
      viewRot.y = max(-0.8, min(0.8, viewRot.y));
      viewRot.px = e.clientX;
      viewRot.py = e.clientY;
    });
    el.addEventListener('pointerup', () => { viewRot.drag = false; });
    el.addEventListener('pointercancel', () => { viewRot.drag = false; });
    el.addEventListener('wheel', (e) => {
      e.preventDefault();
      snd.ensureOn();
      const scale = e.ctrlKey ? 0.0035 : 0.07;
      nudgeAlongView(-e.deltaY * scale);
    }, { passive: false });
  };

  const nudgeZoom = (delta) => {
    nudgeAlongView(delta);
  };

  const toggleTravel = () => {
    travelOn = !travelOn;
    updateTravel.lastMs = performance.now();
    return travelOn;
  };

  const syncCodeArtSurfaces = () => {
    if (codeImgTex) codeImgTex.dispose();
    codeImgTex = rasterizeCodeArtLayer(2048);
    if (sliceMat) sliceMat.uniforms.codeImg.value = codeImgTex;

    codeWallMeshes.forEach((m) => (artLayerGroup || scene).remove(m));
    codeWallMeshes.length = 0;
    if (!bx) return;

    const parent = artLayerGroup || scene;
    const mat = new THREE.MeshBasicMaterial({
      map: codeImgTex,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.94,
      depthWrite: false,
    });
    const plane = new THREE.PlaneGeometry(bx * codeWallScale, by * (codeWallScale * 0.72));
    [
      [0, 0, -bz * 0.86, 0],
      [0, 0, bz * 0.86, Math.PI],
      [-bx * 0.86, 0, 0, Math.PI * 0.5],
      [bx * 0.86, 0, 0, -Math.PI * 0.5],
    ].forEach(([x, y, z, ry]) => {
      const mesh = new THREE.Mesh(plane, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.y = ry;
      mesh.renderOrder = 2;
      parent.add(mesh);
      codeWallMeshes.push(mesh);
    });
  };

  const init = () => {
    if (!THREE) throw new Error('Three.js required');

    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
    renderer.setClearColor(0xffffff, 1);
    document.body.appendChild(renderer.domElement);
    renderer.domElement.tabIndex = 0;
    renderer.domElement.style.outline = 'none';
    renderer.domElement.focus({ preventScroll: true });

    scene = new THREE.Scene();
    artLayerGroup = new THREE.Group();
    artLayerGroup.position.set(0, 0, ART_LAYER_Z);
    scene.add(artLayerGroup);
    camera = new THREE.PerspectiveCamera(72, 1, 0.01, ROOM_SIZE * 2.5);
    camera.position.set(0, 0, 0);

    cubeMat = new THREE.ShaderMaterial({
      uniforms: {
        vol: { value: null },
        dims: { value: new THREE.Vector3(1, 1, volDepth) },
        boxSize: { value: new THREE.Vector3(1, 1, 0.4) },
      },
      vertexShader: CUBE_VERT,
      fragmentShader: CUBE_FRAG,
      side: THREE.BackSide,
      depthWrite: false,
    });

    frontScene = new THREE.Scene();
    frontCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    frontMat = new THREE.ShaderMaterial({
      uniforms: {
        vol: { value: null },
        dims: { value: new THREE.Vector3(1, 1, volDepth) },
      },
      vertexShader: VERT,
      fragmentShader: FRONT_FRAG,
      depthTest: false,
      depthWrite: false,
    });
    frontScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), frontMat));

    sliceScene = new THREE.Scene();
    sliceCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const sliceUniforms = () => ({
      buf: { value: null },
      img: { value: null },
      mot: { value: null },
      time: { value: 0 },
      dims: { value: new THREE.Vector3(1, 1, volDepth) },
      uSlice: { value: 0 },
      doRaster: { value: 1 },
      doSpectrum: { value: 1 },
      specA: { value: new THREE.Vector3() },
      specB: { value: new THREE.Vector3() },
      specInk: { value: new THREE.Vector3() },
      specAlphaAB: { value: 0.24 },
      specAlphaInk: { value: 0.36 },
      paletteVeil: { value: 0.88 },
      codeImg: { value: null },
      codeVeil: { value: 0.62 },
    });
    sliceMat = new THREE.ShaderMaterial({
      uniforms: sliceUniforms(),
      vertexShader: VERT,
      fragmentShader: SLICE_FRAG,
      depthTest: false,
      depthWrite: false,
    });
    sliceScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), sliceMat));
    bindOrbit();
  };

  const setup = () => {
    aspect = window.innerWidth / max(window.innerHeight, 1);
    renderer.setPixelRatio(min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = aspect;
    camera.updateProjectionMatrix();

    bx = ROOM_SIZE * (seedGpu?.roomRx ?? 0.48);
    by = ROOM_SIZE * (seedGpu?.roomRy ?? 0.48);
    bz = ROOM_SIZE * (seedGpu?.roomRz ?? 0.2);

    ({ w: width, h: height } = volSize());
    depth = volDepth;

    volTex.forEach((t) => t && t.dispose());
    volTex = [makeAtlas(width, height, depth), makeAtlas(width, height, depth)];
    volId = 0;

    if (imgTex) imgTex.dispose();
    if (motTex) motTex.dispose();
    imgTex = makeDataTex(16, 16, palette16());
    motTex = makeDataTex(width, height, new Uint8Array(width * height * 4));

    if (sliceRT) sliceRT.dispose();
    sliceRT = makeFlatRT(width, height);

    sliceMat.uniforms.dims.value.set(width, height, depth);
    frontMat.uniforms.dims.value.set(width, height, depth);
    cubeMat.uniforms.dims.value.set(width, height, depth);
    cubeMat.uniforms.boxSize.value.set(bx, by, bz);

    if (innerVol) artLayerGroup.remove(innerVol);

    innerVol = new THREE.Mesh(new THREE.BoxGeometry(bx * 2, by * 2, bz * 2), cubeMat);
    innerVol.renderOrder = 1;
    artLayerGroup.add(innerVol);
    syncCodeArtSurfaces();

    if (!camPosReady) {
      camPos.set(0, seedGpu?.camStartY ?? 20, seedGpu?.camStartZ ?? 92);
      viewRot.x = 0;
      viewRot.y = seedGpu?.viewPitch ?? -0.055;
      camPosReady = true;
    }
    clampPos();
  };

  const uploadMot = (pixels) => {
    if (!motScratch) {
      motScratch = document.createElement('canvas');
    }
    if (motScratch.width !== width || motScratch.height !== height) {
      motScratch.width = width;
      motScratch.height = height;
    }
    const src = document.createElement('canvas');
    src.width = pixels.width;
    src.height = pixels.height;
    src.getContext('2d').putImageData(pixels, 0, 0);
    const ctx = motScratch.getContext('2d');
    ctx.clearRect(0, 0, width, height);
    ctx.drawImage(src, 0, 0, width, height);
    const d = ctx.getImageData(0, 0, width, height);
    motTex.image.data.set(d.data);
    motTex.needsUpdate = true;
  };

  const copySliceToAtlas = (destTex, z) => {
    const gl = renderer.getContext();
    renderer.initTexture(destTex);
    const destProps = renderer.properties.get(destTex);
    const rtProps = renderer.properties.get(sliceRT);
    gl.bindTexture(gl.TEXTURE_2D, destProps.__webglTexture);
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtProps.__webglFramebuffer);
    gl.copyTexSubImage2D(gl.TEXTURE_2D, 0, 0, z * height, 0, 0, width, height);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  };

  const render = (time, pixels, options) => {
    uploadMot(pixels);

    const volPrev = volId;
    const volCur = volId ^= 1;

    sliceMat.uniforms.buf.value = volTex[volPrev];
    sliceMat.uniforms.img.value = imgTex;
    sliceMat.uniforms.codeImg.value = codeImgTex;
    sliceMat.uniforms.mot.value = motTex;
    setSliceUniforms(sliceMat, time, options);

    renderer.setRenderTarget(sliceRT);
    for (let z = 0; z < depth; z++) {
      sliceMat.uniforms.uSlice.value = z;
      renderer.render(sliceScene, sliceCam);
      copySliceToAtlas(volTex[volCur], z);
    }

    frontMat.uniforms.vol.value = volTex[volCur];
    renderer.render(frontScene, frontCam);
    renderer.setRenderTarget(null);

    innerVol.material.uniforms.vol.value = volTex[volCur];

    const manual = applyManualMove(time);
    if (!manual) updateTravel(time, viewRot.drag);

    camera.rotation.order = 'YXZ';
    camera.rotation.y = viewRot.x;
    camera.rotation.x = viewRot.y;
    camera.rotation.z = 0;
    camera.position.copy(camPos);
    renderer.render(scene, camera);
  };

  const refreshPalette = () => {
    if (!width) return;
    if (imgTex) imgTex.dispose();
    imgTex = makeDataTex(16, 16, palette16());
    if (sliceMat) sliceMat.uniforms.img.value = imgTex;
    syncCodeArtSurfaces();
  };

  const setTravel = (on) => {
    travelOn = !!on;
    updateTravel.lastMs = performance.now();
    return travelOn;
  };

  const resetPass = () => {
    camPosReady = false;
    travelPhase = 0;
    viewRot.x = 0;
    viewRot.y = seedGpu?.viewPitch ?? -0.055;
    setup();
  };

  const applySeedProfile = (g) => {
    seedGpu = g;
    volDepth = g.depth;
    TRAVEL_RATE = g.travelRate;
    travelFreq = g.travelFreq;
    if (g.travel) travelStyle = g.travel;
    ART_LAYER_Z = g.artZ;
    codeWallScale = g.codeScale;
    if (artLayerGroup) artLayerGroup.position.set(0, 0, ART_LAYER_Z);
    if (sliceMat) {
      sliceMat.uniforms.specAlphaAB.value = g.specAlphaAB;
      sliceMat.uniforms.specAlphaInk.value = g.specAlphaInk;
      sliceMat.uniforms.paletteVeil.value = g.paletteVeil;
      sliceMat.uniforms.codeVeil.value = g.codeVeil;
      sliceMat.uniforms.dims.value.set(
        sliceMat.uniforms.dims.value.x || 1,
        sliceMat.uniforms.dims.value.y || 1,
        volDepth
      );
    }
    if (frontMat) frontMat.uniforms.dims.value.z = volDepth;
    if (cubeMat) cubeMat.uniforms.dims.value.z = volDepth;
  };

  return {
    init, setup, render, refreshPalette, nudgeZoom, toggleTravel, setTravel, setMoveKey, resetPass,
    applySeedProfile,
    getCanvas: () => renderer?.domElement ?? null,
    getRenderer: () => renderer,
    getScene: () => scene,
    getCamera: () => camera,
    getSliceRT: () => sliceRT,
    getVolSize: () => ({ w: width, h: height }),
  };
};

const c2d = Canvas2d();
const gpu = VolRoomGPU();
const snd = MotionSoundscape();
const rec = CanvasRecorder(() => gpu.getCanvas(), () => snd.getAudioStream());

const lifebar = document.getElementById('lifebar');
const seedHud = document.getElementById('seed-hud');
const options = { auto: true, mode: 0 };

const seriesTitle = (seed) => `Invisible Layer June-7-2026 · ${seed >>> 0}`;

const updateSeedHud = (extra) => {
  const label = seriesTitle(activeSeed);
  seedHud.textContent = extra ? `${label} · ${extra}` : label;
  document.title = label;
};

const applySeed = (seed) => {
  activeSeed = seed >>> 0;
  seedProfile = buildSeedProfile(activeSeed);
  orgRng = makeRng(activeSeed);
  applyPaletteFromProfile(seedProfile);
  c2d.setProfile(seedProfile.canvas);
  c2d.reset();
  gpu.applySeedProfile(seedProfile.gpu);
  options.mode = seedProfile.defaultMode;
  options.auto = seedProfile.autoMode;
  updateSeedHud();
};

const randomSeed = () => ((Math.random() * 0x100000000) >>> 0);

const LED_MODULE_URL = '../../machine-aesthetic/console/led/forward-slice-export.mjs';
let ledExport = null;

const setLedHud = (extra) => {
  updateSeedHud(extra);
};

const ensureLedExport = async () => {
  if (ledExport) return ledExport;
  if (location.protocol === 'file:') {
    throw new Error('open via http://127.0.0.1:8080/… (not file://) for LED');
  }
  const mod = await import(LED_MODULE_URL);
  ledExport = mod.createForwardSliceLedExport({
    onStatus: setLedHud,
    getCameraFrame: () => ({
      renderer: gpu.getRenderer(),
      scene: gpu.getScene(),
      camera: gpu.getCamera(),
      THREE,
    }),
  });
  return ledExport;
};

const rebirth = (t, nextSeed) => {
  applySeed(nextSeed ?? randomSeed());
  gpu.resetPass();
  gpu.refreshPalette();
  lifeStart = t;
  lifePhase = 'live';
  surrenderAt = 0;
  lifebar.style.width = '0%';
  snd.setMasterGain(1);
  gpu.setTravel(true);
};

const updateLife = (t) => {
  if (!lifeStart) lifeStart = t;

  if (lifePhase === 'live') {
    const pct = min(100, ((t - lifeStart) / LIFESPAN_MS) * 100);
    lifebar.style.width = `${pct.toFixed(2)}%`;
    if (t - lifeStart >= LIFESPAN_MS) {
      lifePhase = 'surrender';
      surrenderAt = t;
      gpu.setTravel(false);
    }
    return;
  }

  if (lifePhase === 'surrender') {
    lifebar.style.width = '100%';
    const k = min(1, (t - surrenderAt) / SURRENDER_MS);
    snd.setMasterGain(1 - k);
    if (t - surrenderAt >= SURRENDER_MS) rebirth(t);
  }
};

let showHint = true;

document.addEventListener('keydown', async (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright') {
    e.preventDefault();
    await snd.ensureOn();
    if (k === 'arrowup') gpu.setMoveKey('forward', true);
    if (k === 'arrowdown') gpu.setMoveKey('back', true);
    if (k === 'arrowleft') gpu.setMoveKey('left', true);
    if (k === 'arrowright') gpu.setMoveKey('right', true);
    return;
  }
  if (k === 'h') {
    showHint = !showHint;
    document.getElementById('hint').style.opacity = showHint ? '1' : '0';
  }
  if (k === 'm') await snd.toggle();
  if (k === 't') gpu.toggleTravel();
  if (k === 'r') { await snd.ensureOn(); await rec.toggle(); }
  if (k === 'l') {
    if (e.repeat) return;
    e.preventDefault();
    try {
      const led = await ensureLedExport();
      await led.toggleStream();
    } catch (err) {
      setLedHud(`LED err: ${err.message}`);
    }
  }
  if (k === 'n') rebirth(performance.now());
  if (k === 'a') options.auto = !options.auto;
  if (k === '1') { options.mode = 0; options.auto = false; }
  if (k === '2') { options.mode = 1; options.auto = false; }
  if (k === '3') { options.mode = 2; options.auto = false; }
  if (k === '+' || k === '=') { await snd.ensureOn(); gpu.nudgeZoom(2.8); }
  if (k === '-' || k === '_') { await snd.ensureOn(); gpu.nudgeZoom(-2.8); }
});

document.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup') gpu.setMoveKey('forward', false);
  if (k === 'arrowdown') gpu.setMoveKey('back', false);
  if (k === 'arrowleft') gpu.setMoveKey('left', false);
  if (k === 'arrowright') gpu.setMoveKey('right', false);
});

function setup() {
  c2d.setup();
  gpu.setup();
}

function frame(t) {
  updateLife(t);
  const pixels = c2d.draw(t, options);
  gpu.render(t, pixels, options);
  if (ledExport?.isStreaming?.()) ledExport.tickAfterRender();
  snd.update(pixels, t);
  requestAnimationFrame(frame);
}

c2d.init();
gpu.init();
applySeed(activeSeed);
setup();
loadCenteredArtwork(() => gpu.refreshPalette());
window.addEventListener('resize', setup);
requestAnimationFrame(frame);
  </script>
</body>
</html>
