<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surrender Machine — controls preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --offwhite: #f0ede6;
      --dim: #888880;
      --rule: #2a2a2a;
      --accent: #c8a882;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #machine-stage {
      position: fixed;
      inset: 0;
      background: #fff;
    }

    #machine-stage canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #controls {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, 94vw);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      z-index: 20;
      align-items: stretch;
    }

    .ctrl {
      background: rgba(10, 10, 10, 0.82);
      border: 1px solid var(--rule);
      padding: 12px 14px;
      backdrop-filter: blur(6px);
    }

    .ctrl-label {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ctrl-label span.val {
      color: var(--offwhite);
      font-size: 11px;
    }

    .ctrl input[type="range"] {
      display: block;
      width: 100%;
      height: 3px;
      appearance: none;
      background: var(--rule);
      outline: none;
      cursor: pointer;
    }

    .ctrl input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--offwhite);
      cursor: pointer;
      transition: background 0.15s;
    }

    .ctrl input[type="range"]::-webkit-slider-thumb:hover {
      background: var(--accent);
    }

    .ctrl-desc {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 9.5px;
      color: #555;
      margin-top: 6px;
      letter-spacing: 0.06em;
    }

    #surrender-btn {
      background: rgba(200, 168, 130, 0.12);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 12px 14px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    #surrender-btn:hover {
      background: rgba(200, 168, 130, 0.25);
    }

    #surrender-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    #surrender-btn.surrendered {
      border-color: rgba(200, 168, 130, 0.2);
      color: rgba(200, 168, 130, 0.3);
    }

    .hint {
      position: fixed;
      top: 14px;
      left: 14px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: #888;
      pointer-events: none;
      z-index: 5;
    }

    .hud {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: min(92vw, 640px);
      pointer-events: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #888;
      z-index: 5;
    }

    .hud .seed {
      letter-spacing: 0.12em;
      text-transform: none;
      color: #aaa;
    }

    @media (max-width: 620px) {
      #controls {
        grid-template-columns: 1fr 1fr;
        top: 12px;
        gap: 8px;
      }
      #controls #surrender-btn {
        grid-column: 2 / 3;
      }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="machine-stage"></div>

  <div id="controls" role="group" aria-label="Surrender machine emotion sliders">
    <div class="ctrl" id="ctrl-anger">
      <div class="ctrl-label">Anger <span class="val" id="val-anger">50</span></div>
      <input type="range" id="sl-anger" min="0" max="100" value="50" aria-label="Anger" />
      <div class="ctrl-desc">gears break</div>
    </div>
    <div class="ctrl" id="ctrl-ego">
      <div class="ctrl-label">Ego <span class="val" id="val-ego">50</span></div>
      <input type="range" id="sl-ego" min="0" max="100" value="50" aria-label="Ego" />
      <div class="ctrl-desc">static interference</div>
    </div>
    <div class="ctrl" id="ctrl-attachment">
      <div class="ctrl-label">Attachment <span class="val" id="val-attachment">50</span></div>
      <input type="range" id="sl-attachment" min="0" max="100" value="50" aria-label="Attachment" />
      <div class="ctrl-desc">static residue</div>
    </div>
    <button type="button" id="surrender-btn">Surrender</button>
  </div>

  <p class="hint">drag orbit · scroll zoom · sliders · surrender</p>
  <div class="hud">
    <span>Surrender Machine · Room C preview</span>
    <span class="seed" id="hud-seed">seed 77823</span>
  </div>

  <script src="surrender-machines-three-core.js?v=20260601-live-stress"></script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const SEED = 77823;
    const MACHINE_SCALE = (9 * 0.52) / 680;
    const FADE_DURATION = 14;

    globalThis.THREE = THREE;

    const stage = document.getElementById("machine-stage");

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0xffffff, 1);
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.05,
      200
    );
    camera.position.set(0, 2.4, 7.5);

    const world = new THREE.Group();
    scene.add(world);

    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.target.set(0, 1.2, 0);
    orbit.update();

    const slAnger = document.getElementById("sl-anger");
    const slEgo = document.getElementById("sl-ego");
    const slAttachment = document.getElementById("sl-attachment");
    const valAnger = document.getElementById("val-anger");
    const valEgo = document.getElementById("val-ego");
    const valAttachment = document.getElementById("val-attachment");
    const surrenderBtn = document.getElementById("surrender-btn");

    function getSliderValues() {
      return {
        anger: Number(slAnger.value),
        ego: Number(slEgo.value),
        attachment: Number(slAttachment.value),
      };
    }

    function syncSliderLabels() {
      valAnger.textContent = slAnger.value;
      valEgo.textContent = slEgo.value;
      valAttachment.textContent = slAttachment.value;
    }

    let surrenderEmbed = null;

    if (typeof globalThis.createSurrenderMachineEmbed === "function") {
      surrenderEmbed = globalThis.createSurrenderMachineEmbed({
        parent: world,
        x: 0,
        y: 0.04,
        z: 0,
        scale: MACHINE_SCALE,
        flat: true,
        seed: SEED,
        sliders: getSliderValues(),
      });
      surrenderEmbed.lights.forEach((l) => scene.add(l));
      surrenderEmbed.setStaticOverlayVisible(true);
    } else {
      console.error("createSurrenderMachineEmbed missing");
    }

    function onSliderInput() {
      syncSliderLabels();
    }

    [slAnger, slEgo, slAttachment].forEach((el) => {
      el.addEventListener("input", onSliderInput);
    });

    surrenderBtn.addEventListener("click", () => {
      if (!surrenderEmbed) return;
      const st = surrenderEmbed.state;
      if (st.surrendered || st.surrenderStart != null) return;
      st.surrenderStart = sceneTime;
      surrenderBtn.textContent = "Surrendering…";
      surrenderBtn.disabled = true;
      surrenderBtn.classList.add("surrendered");
    });

    const clock = new THREE.Clock();
    let sceneTime = 0;

    function tick() {
      requestAnimationFrame(tick);
      const dt = Math.min(clock.getDelta(), 0.05);
      sceneTime += dt;

      if (surrenderEmbed) {
        const st = surrenderEmbed.state;
        if (st.surrenderStart != null) {
          st.shadowAmount = Math.min((sceneTime - st.surrenderStart) / FADE_DURATION, 1);
          if (st.shadowAmount >= 1) st.surrendered = true;
        }
        surrenderEmbed.applySliders(getSliderValues());
        surrenderEmbed.update(dt, true);
      }

      orbit.update();

      renderer.render(scene, camera);
    }

    tick();

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", onResize);
    onResize();
  </script>
</body>
</html>
