<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surrender Machine — seed 653057</title>
  <script>
    if (new URLSearchParams(location.search).get("embed") === "room") {
      document.documentElement.classList.add("embed-room");
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a;
      --offwhite: #f0ede6;
      --dim: #888880;
      --rule: #2a2a2a;
      --accent: #c8a882;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }

    html.embed-room .hint,
    html.embed-room .hud { display: none !important; }
    html.embed-room #machine-stage {
      position: absolute;
      inset: 0;
    }
    html.embed-room #sound-btn {
      bottom: 12px;
      right: 12px;
    }

    #machine-stage {
      position: fixed;
      inset: 0;
      background: #fff;
    }
    #machine-stage canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #controls {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, 94vw);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto auto;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
      align-items: stretch;
    }
    .ctrl {
      pointer-events: all;
      background: rgba(10,10,10,0.82);
      border: 1px solid var(--rule);
      padding: 12px 14px;
      backdrop-filter: blur(6px);
    }
    .ctrl-label {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ctrl-label span.val { color: var(--offwhite); font-size: 11px; }
    .ctrl input[type=range] {
      display: block !important;
      width: 100%;
      height: 3px;
      appearance: none;
      background: var(--rule);
      outline: none;
      cursor: pointer;
    }
    .ctrl input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--offwhite);
      cursor: pointer;
    }
    .ctrl-desc {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 9.5px;
      color: #555;
      margin-top: 6px;
      letter-spacing: 0.06em;
    }
    #fs-refresh, #surrender-btn {
      pointer-events: all;
      background: rgba(10,10,10,0.82);
      border: 1px solid var(--rule);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 12px 14px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }
    #fs-refresh { color: var(--dim); transition: color 0.15s, border-color 0.15s; }
    #fs-refresh:hover { color: var(--offwhite); border-color: var(--accent); }
    #fs-refresh svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    #surrender-btn {
      background: rgba(200,168,130,0.12);
      border-color: var(--accent);
      color: var(--accent);
    }
    #surrender-btn:hover { background: rgba(200,168,130,0.25); }
    #surrender-btn:disabled { opacity: 0.35; cursor: default; }
    #surrender-btn.surrendered { border-color: rgba(200,168,130,0.2); color: rgba(200,168,130,0.3); }

    #zero-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 5;
    }
    #zero-hint.visible { opacity: 1; }
    #zero-hint p {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: clamp(16px, 2.5vw, 24px);
      color: #333;
      letter-spacing: 0.06em;
    }

    #sound-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 999;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(10,10,10,0.82);
      backdrop-filter: blur(8px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.55;
      transition: opacity 0.2s, border-color 0.2s;
      padding: 0;
      color: var(--offwhite);
    }
    #sound-btn:hover { opacity: 1; border-color: var(--accent); }
    #sound-btn.on { opacity: 1; border-color: var(--accent); }
    #sound-btn svg { width: 16px; height: 16px; display: block; }

    .hud {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: min(92vw, 640px);
      pointer-events: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #666;
      z-index: 20;
    }
    .hud .seed { letter-spacing: 0.12em; text-transform: none; color: #888; }
    .hint {
      position: fixed;
      top: 14px;
      left: 14px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: #555;
      pointer-events: none;
      z-index: 20;
    }

    @media (max-width: 620px) {
      #controls { grid-template-columns: 1fr 1fr; }
      #controls #fs-refresh { grid-column: 1 / 2; flex-direction: row; justify-content: center; }
      #controls #surrender-btn { grid-column: 2 / 3; }
    }
  </style>
</head>
<body>
  <p class="hint">drag orbit · scroll zoom · sliders · surrender</p>
  <div class="hud">
    <span>Surrender Machine · interactive · HTML</span>
    <span class="seed" id="seed-label">seed 653057</span>
  </div>

  <div id="machine-stage">
    <div id="controls">
      <div class="ctrl" id="ctrl-anger">
        <div class="ctrl-label">Anger <span class="val" id="val-anger">50</span></div>
        <input type="range" id="sl-anger" min="0" max="100" value="50" />
        <div class="ctrl-desc">gears break</div>
      </div>
      <div class="ctrl" id="ctrl-ego">
        <div class="ctrl-label">Ego <span class="val" id="val-ego">50</span></div>
        <input type="range" id="sl-ego" min="0" max="100" value="50" />
        <div class="ctrl-desc">static interference</div>
      </div>
      <div class="ctrl" id="ctrl-attachment">
        <div class="ctrl-label">Attachment <span class="val" id="val-attachment">50</span></div>
        <input type="range" id="sl-attachment" min="0" max="100" value="50" />
        <div class="ctrl-desc">static residue</div>
      </div>
      <button id="fs-refresh" aria-label="New machine">
        <svg viewBox="0 0 24 24">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        New Machine
      </button>
      <button id="surrender-btn">Surrender</button>
    </div>
    <div id="zero-hint"><p>The circuit is open.</p></div>
  </div>

  <button id="sound-btn" title="Toggle sound" aria-label="Toggle sound">
    <svg id="icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
    </svg>
    <svg id="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    </svg>
  </button>

  <script src="../../js/p5-1.11.2.min.js"></script>
  <script src="surrender-machines-core.js?v=20260601-p5-room"></script>
</body>
</html>
