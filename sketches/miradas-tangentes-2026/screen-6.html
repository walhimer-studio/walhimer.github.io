<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>917 (around) — Screen 6 · Miradas Tangentes · Mark Walhimer</title>
  <meta name="description" content="917 (around) — meditative exploration of translucency and orbital motion. Miradas Tangentes, Madrid 2026, screen 6." />
  <link rel="canonical" href="https://mark-walhimer.com/sketches/miradas-tangentes-2026/screen-6.html" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    video {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video
    id="screen"
    src="assets/06-01-mark-walhimer.mp4"
    autoplay
    loop
    muted
    playsinline
  ></video>
  <script>
    const video = document.getElementById('screen');
    video.play().catch(function () {
      document.body.addEventListener('click', function once() {
        video.play();
        document.body.removeEventListener('click', once);
      });
    });
  </script>
</body>
</html>
